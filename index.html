<script>
'use strict';

/* ═══════════════════════════════════════════════════════════════════
   CONSTANTS
   ═══════════════════════════════════════════════════════════════════ */

/* Two axes, deliberately kept apart. TAGS say what a lesson IS and live in
   the cool half; STATUS says how ready it is and runs the warm traffic light.
   Any tag added later has to stay cool, or the two start reading as one. */
const TAGS = {
  none:    { label:'No tag',     color:'transparent' },
  test:    { label:'Test',       color:'#4338ca' },   /* indigo — the heaviest */
  quiz:    { label:'Quiz',       color:'#7c3aed' },   /* violet — test's sibling */
  lab:     { label:'Lab',        color:'#0d9488' },   /* teal — hands-on */
  project: { label:'Project',    color:'#c026d3' },   /* fuchsia — creative */
  review:  { label:'Review',     color:'#0284c7' },   /* sky — consolidation */
  trip:    { label:'Field Trip', color:'#db2777' },   /* pink — the outing */
};
/* Tags that count as an assessment for collision detection in the month view. */
const ASSESSMENT = new Set(['test','quiz']);

/* A tag says what the lesson IS. Status says whether it's ready to teach —
   a different question, so it gets its own control rather than crowding the
   tag list. Deliberately short: anything finer becomes a chore to maintain. */
const STATUS = {
  unplanned: { label:'Unplanned',   short:'Unplanned', color:'#dc2626' },
  wip:       { label:'In Progress', short:'WIP',       color:'#f97316' },
  waiting:   { label:'Waiting on Materials', short:'Waiting', color:'#eab308' },
  ready:     { label:'Ready',       short:'Ready',     color:'#16a34a' },
};

/* An untouched lesson far out isn't a problem, it's just future work. So
   "Unplanned" is only asserted inside a horizon — from today out to
   state.planAhead weeks. Behind it, nothing: you already taught that. */
const DEFAULT_PLAN_AHEAD = 2;
const planAheadWeeks = () => Math.max(0, Number(state.planAhead ?? DEFAULT_PLAN_AHEAD));

function effectiveStatus(lesson, date){
  if (lesson && lesson.status && STATUS[lesson.status]) return lesson.status;
  if (!date) return null;
  const today = iso(new Date());
  if (date < today) return null;
  if (date > addDays(today, planAheadWeeks() * 7)) return null;
  return 'unplanned';
}

const DOW  = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const DOW3 = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MON  = ['January','February','March','April','May','June','July',
              'August','September','October','November','December'];
const WEEKDAYS   = [1,2,3,4,5];          // Mon–Fri, the default teaching week
const WEEK_ORDER = [1,2,3,4,5,6,0];      // Mon…Sun, the order columns appear in
const PALETTE = ['#2563eb','#059669','#d97706','#7c3aed','#dc2626','#0d9488','#db2777','#65a30d'];
const STORAGE_KEY = 'lessonPlannerSandbox.v2';

const ALL = 'ALL';                       // sentinel course id for the all-classes tab

/* ═══════════════════════════════════════════════════════════════════
   DATE HELPERS  (dates are 'YYYY-MM-DD' strings, parsed as local)
   ═══════════════════════════════════════════════════════════════════ */

const pad = n => String(n).padStart(2,'0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y,m-1,d); };
const addDays = (s,n) => { const d = parse(s); d.setDate(d.getDate()+n); return iso(d); };
const dow = s => parse(s).getDay();
const isWeekday = s => { const w = dow(s); return w >= 1 && w <= 5; };
const isWeekend = s => !isWeekday(s);

/* Weekends are hidden until they're wanted. A class set to meet on a Saturday
   turns them on by itself — otherwise its lessons would exist with nowhere on
   screen to show them. */
const weekendsInUse = () =>
  state.courses.some(c => c.weekdays.some(w => w === 0 || w === 6));
const showWeekends = () => !!(state && (state.weekends || weekendsInUse()));
const visibleDows  = () => showWeekends() ? WEEK_ORDER : WEEKDAYS;
const isVisibleDay = s => visibleDows().includes(dow(s));

function weekStart(s){                   // Monday of the week containing s
  const w = dow(s);
  return addDays(s, w === 0 ? -6 : 1 - w);
}
const fmtShort = s => { const d = parse(s); return `${d.getMonth()+1}/${d.getDate()}`; };
const fmtLong  = s => { const d = parse(s);
  return `${DOW[d.getDay()]}, ${MON[d.getMonth()]} ${d.getDate()}`; };
const fmtMed   = s => { const d = parse(s); return `${MON[d.getMonth()].slice(0,3)} ${d.getDate()}`; };
const fmtMedY  = s => { const d = parse(s);
  return `${MON[d.getMonth()].slice(0,3)} ${d.getDate()}, ${d.getFullYear()}`; };
const fmtDay   = s => { const d = parse(s);
  return `${DOW3[d.getDay()]}, ${MON[d.getMonth()].slice(0,3)} ${d.getDate()}, ${d.getFullYear()}`; };
const fmtDayLong = s => { const d = parse(s);
  return `${DOW[d.getDay()]}, ${MON[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`; };
const dayDiff  = (a,b) => Math.round((parse(a) - parse(b)) / 86400000);
const uid = () => Math.random().toString(36).slice(2,10);

/* The handler has always accepted ctrlKey, but every label said ⌘ — so the
   Windows machine was being told to press a key it doesn't have. */
const IS_MAC = /Mac|iPhone|iPad|iPod/.test(navigator.platform || navigator.userAgent || '');
const MODG = IS_MAC ? '\u2318' : 'Ctrl';        // alone, inside a <kbd>
const MODK = IS_MAC ? '\u2318' : 'Ctrl+';       // inline in a sentence

/* Whether to advertise shortcuts on the controls themselves. localStorage,
   not state: "have I learned the shortcuts yet" is about the person at the
   keyboard, and state travels to the other machine in planner.json. */
const HINTS_KEY = 'lessonPlanner.hints';
const showHints = () => localStorage.getItem(HINTS_KEY) === '1';
function setHints(on){
  localStorage.setItem(HINTS_KEY, on ? '1' : '0');
  document.body.classList.toggle('hints', on);
  render();
}

/** A span of days, collapsing whatever the two ends share.
    "Aug 24 – 28, 2026" · "Aug 31 – Sep 4, 2026" · "Dec 28, 2026 – Jan 1, 2027" */
function fmtRange(a, b){
  const x = parse(a), y = parse(b);
  const mA = MON[x.getMonth()].slice(0,3), mB = MON[y.getMonth()].slice(0,3);
  if (x.getFullYear() !== y.getFullYear())
    return `${mA} ${x.getDate()}, ${x.getFullYear()} – ${mB} ${y.getDate()}, ${y.getFullYear()}`;
  if (x.getMonth() !== y.getMonth())
    return `${mA} ${x.getDate()} – ${mB} ${y.getDate()}, ${y.getFullYear()}`;
  return `${mA} ${x.getDate()} – ${y.getDate()}, ${y.getFullYear()}`;
}

/** The same span with months spelled out, for the top bar only. */
function fmtRangeLong(a, b){
  const x = parse(a), y = parse(b);
  const mA = MON[x.getMonth()], mB = MON[y.getMonth()];
  if (x.getFullYear() !== y.getFullYear())
    return `${mA} ${x.getDate()}, ${x.getFullYear()} – ${mB} ${y.getDate()}, ${y.getFullYear()}`;
  if (x.getMonth() !== y.getMonth())
    return `${mA} ${x.getDate()} – ${mB} ${y.getDate()}, ${y.getFullYear()}`;
  return `${mA} ${x.getDate()} – ${y.getDate()}, ${y.getFullYear()}`;
}

/* ═══════════════════════════════════════════════════════════════════
   TERMS
   ───────────────────────────────────────────────────────────────────
   A term is just a start date. The school owns a default set; a class
   may override it. Week numbers count from the start of whichever term
   contains the date, so "Week 3 · S2" means the third week of the
   second semester — not the third week of the year.
   ═══════════════════════════════════════════════════════════════════ */

const TERM_MODES = {
  semester:  { n:2, abbr:'S', label:'Semesters',  long:'Semester'  },
  year:      { n:1, abbr:'',  label:'Whole year', long:''          },
  trimester: { n:3, abbr:'T', label:'Trimesters', long:'Trimester' },
  custom:    { n:0, abbr:'T', label:'Custom',     long:'Term'      },
};

/** N term starts spread evenly across a year, each snapped to a Monday. */
function spreadTerms(yearStart, yearEnd, n){
  const a = parse(yearStart), b = parse(yearEnd);
  const out = [yearStart];
  for (let i = 1; i < n; i++)
    out.push(weekStart(iso(new Date(a.getTime() + (b - a) * i / n))));
  return out;
}

const termsFor = c => (c && c.terms) ? c.terms : state.terms;

/** Which term a date falls in: { index, start, mode, count } */
function termOn(date, c){
  const t = termsFor(c);
  if (!t || !t.starts || !t.starts.length) return null;
  let i = 0;
  t.starts.forEach((s,k) => { if (date >= s) i = k; });
  return { index:i, start:t.starts[i], mode:t.mode, count:t.starts.length };
}

const termAbbr = t =>
  t && t.count > 1 && TERM_MODES[t.mode] && TERM_MODES[t.mode].abbr
    ? TERM_MODES[t.mode].abbr + (t.index + 1) : '';

/** Spelled out, for the top bar's month view — a month spans several weeks,
    so a week number there would be wrong; the term is the honest unit. */
const termLong = t =>
  t && t.count > 1 && TERM_MODES[t.mode] && TERM_MODES[t.mode].long
    ? TERM_MODES[t.mode].long + ' ' + (t.index + 1) : '';

/** "Week 3 · S1", or just "Week 3" when the year isn't divided. */
function weekLabel(date, c){
  const t = termOn(date, c);
  if (!t) return '';
  const n = Math.floor(dayDiff(weekStart(date), weekStart(t.start)) / 7) + 1;
  if (n < 1) return '';
  const abbr = termAbbr(t);
  return abbr ? `Week ${n} · ${abbr}` : `Week ${n}`;
}

/* ═══════════════════════════════════════════════════════════════════
   SEED DATA  (loaded on demand, never automatically)
   ═══════════════════════════════════════════════════════════════════ */

const mkRows = labels => labels.map(l => ({ id:uid(), label:l }));

function emptyState(){
  const yearStart = '2026-08-24', yearEnd = '2027-06-04';
  return {
    schemaVersion: 4,
    yearStart, yearEnd,
    archives: [],
    terms: { mode:'semester', starts: spreadTerms(yearStart, yearEnd, 2) },
    holidays: [],
    courses: [],
    lessons: {},
  };
}


/* ═══════════════════════════════════════════════════════════════════
   STATE + PERSISTENCE + UNDO
   ═══════════════════════════════════════════════════════════════════ */

let state, ui, undoStack = [], redoStack = [];

function load(){
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return migrate(JSON.parse(raw));
  } catch(e){ console.warn('load failed', e); }
  return emptyState();
}

/** Bring older files forward.
    v1 = rotating cycle · v2 = weekdays · v3 = terms · v4 = archived years. */
/** Rows this class shows only during a given calendar week. Pinned to dates,
    not to lesson positions — so nothing in the ripple engine has to know they
    exist, and inserting a day earlier leaves them on the week they were made
    for rather than dragging them along. */
function weekRowsOn(course, date){
  return (course.weekRows || []).filter(r => date >= r.from && date <= r.to);
}
/** Every row a given date shows: the class's permanent set, then this week's. */
const rowsFor = (course, date) =>
  date ? course.rows.concat(weekRowsOn(course, date)) : course.rows;

/* ═══════════════════════════════════════════════════════════════════
   HOMEWORK
   ───────────────────────────────────────────────────────────────────
   Two rows carry behaviour, identified by name so renaming a row into
   one is all it takes. An assignment line stores its due date in the
   cell's own HTML — duplicateDay and copyDayTo clone `cells` wholesale
   but enumerate lesson fields longhand, so the HTML is the one place a
   new field survives both for free.

     data-due="+2"          two meetings later — rides the ripple
     data-due="2026-12-19"  that exact date — pinned
     data-due="d2"          two calendar days later — moves with the lesson
                            that assigned it, but the gap stays in days, so
                            it can land on a day the class doesn't meet

   data-dueon holds the rendered label and is rewritten every paint. It
   is never read as truth. Drawing the pill from it via ::after keeps it
   out of htmlToText, and therefore out of search and both exports.
   ═══════════════════════════════════════════════════════════════════ */

const HW_DUE = 'homework due', HW_ASSIGNED = 'homework assigned';
const rowRole = r => {
  const n = String(r.label || '').trim().toLowerCase();
  return n === HW_DUE ? 'due' : n === HW_ASSIGNED ? 'assigned' : null;
};
const findRow = (c, role) => c.rows.find(r => rowRole(r) === role) || null;

/** Undefined means "auto": on when both rows are present by name. */
function hwOn(c){
  /* The flag only ever turns it off; presence of both rows is what turns it
     on, so the toggle's On action adds whichever is missing. */
  if (c.homework === false) return false;
  return !!(findRow(c,'due') && findRow(c,'assigned'));
}

const isPinned = v => /^\d{4}-\d{2}-\d{2}$/.test(v || '');
const isRelative = v => /^\+\d+$/.test(v || '');
const isDays = v => /^d\d+$/.test(v || '');

/**
 * Where an assignment lands.
 *   { date, kind }  — date is null when it runs past the end of the course
 *   kind: 'classes' counts meetings, so a holiday or a No Class day carries it
 *         along · 'days' counts calendar days from the assigning lesson, so the
 *         gap is fixed and it can land off a meeting day · 'date' doesn't move.
 */
function resolveDue(due, assignIdx, dates){
  if (isPinned(due)) return { date: due, kind:'date' };
  if (isRelative(due)) return { date: dates[assignIdx + Number(due.slice(1))] || null, kind:'classes' };
  if (isDays(due)){
    const from = dates[assignIdx];
    return { date: from ? addDays(from, Number(due.slice(1))) : null, kind:'days' };
  }
  return null;
}

/** Every assignment line in a cell, with its raw due value. */
function assignmentsIn(html){
  if (!html) return [];
  const box = document.createElement('div');
  box.innerHTML = html;
  const blocks = [...box.querySelectorAll('li,div,p')].filter(n => !n.querySelector('li,div,p'));
  const nodes = blocks.length ? blocks : (box.textContent.trim() ? [box] : []);
  return nodes.map(n => ({ text: (n.textContent || '').trim(), due: n.getAttribute('data-due') }))
              .filter(a => a.text);
}

/**
 * Everything due on `date` for this course, gathered from earlier lessons.
 * Derived on every paint and never written anywhere — which is what makes
 * "you can't delete the populated text" true by construction rather than by
 * enforcement.
 */
/**
 * Every assignment in the class, indexed by the date it lands on. One pass
 * over the lessons, one HTML parse each — anything needing more than a single
 * cell's worth must build this rather than calling dueOn in a loop, which is
 * how a year export turned into a hundred thousand parses.
 */
function buildDueIndex(c, dates){
  const map = new Map();
  if (!hwOn(c)) return map;
  const src = findRow(c,'assigned');
  if (!src) return map;
  c.lessons.forEach((id, i) => {
    const l = state.lessons[id];
    if (!l) return;
    assignmentsIn(l.cells[src.id]).forEach(a => {
      const r = resolveDue(a.due, i, dates);
      if (!r || !r.date) return;
      if (!map.has(r.date)) map.set(r.date, []);
      map.get(r.date).push({ text:a.text, from: dates[i] || null, pinned: r.kind === 'date' });
    });
  });
  return map;
}


function migrate(data){
  if (!data || !data.courses) return emptyState();
  /* Read the version as a NUMBER. The oldest files predate the field, and
     `undefined < 3` is false — which would skip the migration entirely and
     hand back a v1 file pretending to be current. The old `>= 3` test got
     this right by accident; an inverted comparison doesn't. */
  const at = () => Number(data.schemaVersion) || 0;
  if (at() < 3) migrateTo3(data);
  if (at() < 4){
    data.archives = data.archives || [];
    data.schemaVersion = 4;
  }
  return data;
}

function migrateTo3(data){
  data.courses.forEach(c => {
    if (!c.weekdays) c.weekdays = [...WEEKDAYS];   // old cycleDays don't map; assume all
    delete c.cycleDays;
    if (!c.startDate) c.startDate = data.yearStart;
    if (!c.endDate)   c.endDate   = data.yearEnd;
    if (!c.cancelled) c.cancelled = [];
    if (c.terms === undefined) c.terms = null;     // null = follow the school default
  });
  delete data.cycleLength;
  if (!data.terms)
    data.terms = { mode:'semester', starts: spreadTerms(data.yearStart, data.yearEnd, 2) };
  data.schemaVersion = 3;
}

const DIRTY_KEY = 'lessonPlanner.dirtySince';
const SETUP_KEY = 'lessonPlanner.setupAsked';
/* The moment of the FIRST unsaved change, not the latest — that's what gives
   the warning its clock. Persisted, because the case that actually matters is
   a tab reopened days later with work that was never backed up. */
let dirtySince = Number(localStorage.getItem(DIRTY_KEY)) || 0;
let lastSavedAt = 0;

function markDirty(){
  if (dirtySince) return;          /* save() runs per keystroke — this guard is
                                      what stops a write and a repaint per character */
  dirtySince = Date.now();
  localStorage.setItem(DIRTY_KEY, String(dirtySince));
  paintStorageBadge();
}
function markClean(){
  if (!dirtySince) return;
  dirtySince = 0;
  localStorage.removeItem(DIRTY_KEY);
  paintStorageBadge();
}

function save(){
  /* localStorage stays a mirror even when a folder is connected — it costs
     nothing and means a folder going missing never loses the day's work. */
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
  catch(e){ console.warn('save failed', e); }
  if (typeof scheduleFolderSave === 'function') scheduleFolderSave();
  if (typeof markDirty === 'function') markDirty();
}
const clone = o => JSON.parse(JSON.stringify(o));

/**
 * Undo snapshots leave the archive out. Past years are read-only between
 * rollovers, and the stack holds 60 entries — cloning several dead years on
 * every edit is the most expensive mistake available in this file. The live
 * array is re-attached on restore, so undo never sees a gap.
 *
 * Rollover is the one change that DOES touch archives, so it banks a `full`
 * entry instead; see rolloverYear.
 */
function snapshot(){
  const keep = state.archives;
  state.archives = undefined;
  const snap = clone(state);
  state.archives = keep;
  return snap;
}
function restore(snap){
  snap.archives = state.archives;
  state = snap;
}

/** Wrap a mutation so the whole thing becomes ONE undo entry. */
function commit(label, fn, full){
  undoStack.push(full ? { label, snap: clone(state), full:true }
                      : { label, snap: snapshot() });
  if (undoStack.length > 60) undoStack.shift();
  redoStack = [];
  fn();
  invalidateSchedule();
  save();
  render();
  schedulePaneRepaint();
  if (label) toast(label);
}
/**
 * A targeted undo entry, for typing. Cloning the whole state on every cell
 * focus would be wasteful, so a text edit records a pair of functions instead
 * of a snapshot. They look their target up by id rather than closing over the
 * object, because undoing a structural change swaps `state` for a fresh clone
 * and any captured reference would then be pointing at an orphan.
 */
function pushEdit(label, apply, invert){
  undoStack.push({ label, apply, invert });
  if (undoStack.length > 60) undoStack.shift();
  redoStack = [];
}
const setTitle = (id, v) => () => { const l = state.lessons[id]; if (l) l.title = v; };
const setCell  = (id, rowId, v) => () => { const l = state.lessons[id]; if (l) l.cells[rowId] = v; };

/** Live-edit a field, but bank ONE undo entry for the whole editing session. */
function bindEditable(node, read, setter, label){
  let before = null;
  node.addEventListener('focus', () => { before = read(); });
  node.addEventListener('blur', () => {
    const after = read();
    if (before !== null && after !== before)
      pushEdit(label, setter(before), setter(after));
    before = null;
  });
}

function undo(){
  if (!undoStack.length) return toast('Nothing to undo');
  const e = undoStack.pop();
  if (e.apply){
    redoStack.push({ label:e.label, apply:e.invert, invert:e.apply });
    e.apply();
  } else if (e.full){
    redoStack.push({ label:e.label, snap: clone(state), full:true });
    state = e.snap;
  } else {
    redoStack.push({ label:'', snap: snapshot() });
    restore(e.snap);
  }
  invalidateSchedule(); save(); render(); schedulePaneRepaint();
  toast('Undid: ' + (e.label || 'last change'));
}
function redo(){
  if (!redoStack.length) return toast('Nothing to redo');
  const e = redoStack.pop();
  if (e.apply){
    undoStack.push({ label:e.label, apply:e.invert, invert:e.apply });
    e.apply();
  } else if (e.full){
    undoStack.push({ label:e.label, snap: clone(state), full:true });
    state = e.snap;
  } else {
    undoStack.push({ label:'', snap: snapshot() });
    restore(e.snap);
  }
  invalidateSchedule(); save(); render(); schedulePaneRepaint();
  toast('Redone');
}

let toastTimer;
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('on'), 2400);
}

/* ═══════════════════════════════════════════════════════════════════
   SCHEDULE ENGINE
   ───────────────────────────────────────────────────────────────────
   Lessons have NO date. Each course owns an ordered array of lesson
   ids. We generate the dates a course meets, then lesson[i] lands on
   meetingDates[i]. Insert = splice; everything after re-projects onto
   later dates for free.

   A course meets on a date when ALL of these hold:
     · it's a weekday inside the school year
     · it isn't a school-wide holiday
     · it's inside the course's own start/end range
     · the weekday is one the course meets
     · the course hasn't marked that specific date "No Class"
   ═══════════════════════════════════════════════════════════════════ */

let _schoolDays = null, _schoolKey = '';

function holidayOn(date){
  return state.holidays.find(h => date >= h.date && date <= (h.endDate || h.date)) || null;
}

/** Every school-wide teaching day in the year. */
function schoolDays(){
  const key = state.yearStart + '|' + state.yearEnd + '|' + JSON.stringify(state.holidays);
  if (_schoolDays && _schoolKey === key) return _schoolDays;
  /* Every calendar day, holidays aside. Which of them a class actually meets
     is decided by that class's own weekday list, so this must not pre-filter
     weekends — a Saturday class would lose every one of its meetings. */
  const out = [];
  for (let d = state.yearStart; d <= state.yearEnd; d = addDays(d,1)){
    if (holidayOn(d)) continue;
    out.push(d);
  }
  _schoolDays = out; _schoolKey = key;
  return out;
}
const invalidateSchedule = () => { _schoolDays = null; };

const isCancelled = (course, date) => course.cancelled.some(x => x.date === date);

/** The dates this course meets, in order. */
function meetingDates(course){
  return schoolDays().filter(d =>
    d >= course.startDate && d <= course.endDate &&
    course.weekdays.includes(dow(d)) &&
    !isCancelled(course, d));
}
function meetingIndexByDate(course){
  const m = new Map();
  meetingDates(course).forEach((d,i) => m.set(d, i));
  return m;
}
function lessonOn(course, date){
  const idx = meetingIndexByDate(course).get(date);
  if (idx === undefined) return null;
  const id = course.lessons[idx];
  return id ? state.lessons[id] : null;
}
/** Lessons pushed past the end of the course's schedule. Never deleted. */
const overflowCount = course => Math.max(0, course.lessons.length - meetingDates(course).length);

function ensureLesson(course, idx){
  while (course.lessons.length <= idx){
    const id = uid();
    state.lessons[id] = { id, title:'', tag:'none', status:null, cells:{} };
    course.lessons.push(id);
  }
  return state.lessons[course.lessons[idx]];
}
const blankLesson = () => {
  const id = uid();
  state.lessons[id] = { id, title:'', tag:'none', status:null, cells:{} };
  return id;
};

/* ═══════════════════════════════════════════════════════════════════
   STRUCTURAL OPERATIONS — all of them array ops on course.lessons
   ═══════════════════════════════════════════════════════════════════ */

const insertDay = (c, i) =>
  commit('Day inserted · rest shifted', () => c.lessons.splice(i, 0, blankLesson()));

const removeDay = (c, i) =>
  commit('Day removed · gap closed', () => c.lessons.splice(i, 1));

const clearDay = (c, i) =>
  commit('Day cleared', () => {
    const l = state.lessons[c.lessons[i]];
    if (l){ l.title = ''; l.tag = 'none'; l.status = null; l.cells = {}; }
  });

const duplicateDay = (c, i) =>
  commit('Day duplicated', () => {
    const src = state.lessons[c.lessons[i]], id = uid();
    state.lessons[id] = { id, title:src.title, tag:src.tag, status:src.status || null, cells:clone(src.cells) };
    c.lessons.splice(i+1, 0, id);
  });

const swapDays = (c, a, b) =>
  commit('Days swapped', () => {
    const t = c.lessons[a]; c.lessons[a] = c.lessons[b]; c.lessons[b] = t;
  });

/** Extract at `from`, close the gap, re-insert at `to`. One atomic move. */
const moveDay = (c, from, to) =>
  commit('Day moved · rest shifted', () => {
    const [id] = c.lessons.splice(from, 1);
    c.lessons.splice(from < to ? to - 1 : to, 0, id);
  });

/** "No Class": drop this meeting for ONE course and ripple it forward. */
const cancelMeeting = (c, date) =>
  commit(`No Class ${fmtMed(date)} · ${c.name} shifted`, () => {
    if (!isCancelled(c, date)) c.cancelled.push({ date, reason:'No Class' });
  });

const restoreMeeting = (c, date) =>
  commit(`${fmtMed(date)} restored · ${c.name} shifted back`, () => {
    c.cancelled = c.cancelled.filter(x => x.date !== date);
  });

/* ═══════════════════════════════════════════════════════════════════
   UI STATE
   ═══════════════════════════════════════════════════════════════════ */

state = load();
ui = { view:'week', courseId: state.courses[0] ? state.courses[0].id : ALL, anchor:'' };
ui.anchor = todayAnchor();

function clampToYear(d){
  if (d < state.yearStart) return state.yearStart;
  if (d > state.yearEnd)   return state.yearEnd;
  return d;
}
const isAll = () => ui.courseId === ALL;
function course(){
  return state.courses.find(c => c.id === ui.courseId) || state.courses[0] || null;
}

/* ═══════════════════════════════════════════════════════════════════
   RENDER
   ═══════════════════════════════════════════════════════════════════ */

const $ = id => document.getElementById(id);
const el = (tag, cls, txt) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (txt !== undefined) n.textContent = txt;
  return n;
};
const VIEWS = [['day','Day'],['week','Week'],['month','Month']];

function render(){
  /* Never rebuild the stage mid-gesture — it would destroy the column the
     pointer is captured on and the drag would die silently. */
  if (drag && drag.active) return;
  renderViews();
  renderTabs();
  renderPeriod();
  const stage = $('stage');
  stage.innerHTML = '';
  if (!state.courses.length) return renderFirstRun(stage);
  if (isAll()){
    ({ day:renderAllDay, week:renderAllWeek, month:renderAllMonth })[ui.view](stage);
  } else {
    ({ day:renderDay, week:renderWeek, month:renderMonth })[ui.view](stage);
  }
  paintSelection();
}

function renderFirstRun(stage){
  const box = el('div','empty-state');
  box.appendChild(el('b','','No classes yet'));
  box.appendChild(el('div','','Add each class you teach — its name, the days it meets, and the rows you plan against.'));
  const cta = el('button','cta','+ Add a class');
  cta.onclick = () => { openPanel(['classes']); setTimeout(addCourse, 60); };
  box.appendChild(cta);
  const alt = el('div','alt');
  alt.appendChild(document.createTextNode('Already have a backup file? '));
  const imp = el('button','','Open it');
  imp.onclick = () => $('filepick').click();
  alt.appendChild(imp);
  box.appendChild(alt);
  stage.appendChild(box);
}

function renderViews(){
  const box = $('views'); box.innerHTML = '';
  const hints = showHints();
  document.body.classList.toggle('hints', hints);
  VIEWS.forEach(([k,label], i) => {
    const b = el('button', ui.view === k ? 'on' : '', label);
    b.title = `${label} view (${i + 1})`;
    if (hints) b.appendChild(el('kbd','hint', String(i + 1)));
    b.onclick = () => { ui.view = k; render(); };
    box.appendChild(b);
  });
}

function renderTabs(){
  const box = $('tabs'); box.innerHTML = '';
  /* A single-class user has nothing to switch between — the row is pure cost. */
  box.style.display = state.courses.length <= 1 ? 'none' : '';
  if (state.courses.length){
    const t = el('button','tab allcls' + (isAll() ? ' on' : ''));
    t.style.setProperty('--c','var(--muted)');
    const dots = el('span','dots');
    state.courses.slice(0,4).forEach(c => {
      const i = document.createElement('i');
      i.style.background = c.color;
      dots.appendChild(i);
    });
    t.appendChild(dots);
    /* The label was the widest thing in the row and the dots already say it. */
    t.title = 'All Classes';
    t.setAttribute('aria-label','All Classes');
    t.onclick = () => { ui.courseId = ALL; render(); };
    box.appendChild(t);
  }
  state.courses.forEach((c, ci) => {
    const t = el('button', 'tab' + (c.id === ui.courseId ? ' on' : ''));
    t.style.setProperty('--c', c.color);
    t.appendChild(el('span','dot'));
    const name = el('span','nm', c.name);
    name.title = 'Double-click to rename · drag to reorder';
    t.appendChild(name);
    t.onclick = () => { if (!name.isContentEditable){ ui.courseId = c.id; render(); } };
    t.ondblclick = e => { e.preventDefault(); renameTab(name, c); };

    /* Same shape as the row-label and editor-row reorders. The distinct mime
       is what keeps the three drop targets from accepting each other. */
    t.draggable = true;
    t.ondragstart = e => {
      /* draggable fights contenteditable — a rename in progress wins. */
      if (name.isContentEditable) return e.preventDefault();
      e.dataTransfer.setData('text/tab', String(ci));
      e.dataTransfer.effectAllowed = 'move';
      t.classList.add('dragging');
    };
    t.ondragend   = () => t.classList.remove('dragging');
    t.ondragover  = e => {
      if (!e.dataTransfer.types.includes('text/tab')) return;
      e.preventDefault(); t.classList.add('over');
    };
    t.ondragleave = () => t.classList.remove('over');
    t.ondrop = e => {
      e.preventDefault(); t.classList.remove('over');
      const from = Number(e.dataTransfer.getData('text/tab'));
      if (from === ci || Number.isNaN(from)) return;
      commit('Classes reordered', () => {
        const [m] = state.courses.splice(from, 1);
        state.courses.splice(ci, 0, m);
      });
    };
    box.appendChild(t);
  });
}

/**
 * Rename a class in place on its tab. Clicks inside the field have to be
 * stopped from reaching the tab, because the tab's own handler re-renders
 * and would destroy the element being typed into.
 */
function renameTab(span, c){
  if (span.isContentEditable) return;
  const before = c.name;
  span.contentEditable = 'true';
  span.spellcheck = false;

  const swallow = e => { if (span.isContentEditable) e.stopPropagation(); };
  span.onmousedown = swallow;
  span.onclick = swallow;
  span.ondblclick = swallow;

  span.focus();
  const r = document.createRange();
  r.selectNodeContents(span);
  const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);

  const finish = keep => {
    if (!span.isContentEditable) return;
    span.contentEditable = 'false';
    const v = span.textContent.replace(/\s+/g,' ').trim();
    if (keep && v && v !== before) commit('Class renamed', () => { c.name = v; });
    else { span.textContent = before; render(); }
  };
  span.onblur = () => finish(true);
  span.onkeydown = e => {
    e.stopPropagation();                       // ⌘Z in here means undo the typing
    if (e.key === 'Enter'){ e.preventDefault(); finish(true); }
    if (e.key === 'Escape'){ e.preventDefault(); span.textContent = before; finish(false); }
  };
}

/** The anchor the Today button would set. Clamped into the school year, and
    snapped onto a weekday in day view — where a Saturday anchor renders an
    empty state rather than a lesson. */
function todayAnchor(){
  let d = clampToYear(iso(new Date()));
  /* On a Saturday you're not still planning the week you just taught. Roll to
     the next day that's actually on screen — unless weekends are shown, in
     which case Saturday IS on screen and nothing should move. */
  for (let i = 0; i < 7 && !isVisibleDay(d); i++) d = clampToYear(addDays(d, 1));
  return d;
}

/** The button is noise when pressing it wouldn't move anything. Asking that
    directly — rather than "is today inside the year" — is what makes it hide
    over the summer, and on a weekend in day view. */
function todayOnScreen(){
  const t = todayAnchor();
  if (ui.view === 'day') return ui.anchor === t;
  if (ui.view === 'month'){
    const a = parse(ui.anchor), d = parse(t);
    return a.getFullYear() === d.getFullYear() && a.getMonth() === d.getMonth();
  }
  return weekStart(ui.anchor) === weekStart(t);
}

function renderPeriod(){
  const p = $('period'); p.innerHTML = '';
  const c = isAll() ? null : course();
  let lead = '', long = '', short = '';

  if (ui.view === 'day'){
    lead  = weekLabel(ui.anchor, c);
    long  = fmtDayLong(ui.anchor);
    short = fmtDay(ui.anchor);
  } else if (ui.view === 'month'){
    const d = parse(ui.anchor);
    lead  = termLong(termOn(ui.anchor, c));
    long  = `${MON[d.getMonth()]} ${d.getFullYear()}`;
    short = `${MON[d.getMonth()].slice(0,3)} ${d.getFullYear()}`;
  } else {
    const dates = weekDates(ui.anchor);
    lead  = weekLabel(dates[0], c);
    long  = fmtRangeLong(dates[0], dates[dates.length-1]);
    short = fmtRange(dates[0], dates[dates.length-1]);
  }
  /* weekLabel is empty before the first term start and when the year isn't
     divided — the date simply becomes the lead, which reads fine. */
  if (lead) p.appendChild(el('b','lead', lead));
  /* Both forms are rendered and CSS picks one, so narrowing the window needs
     no resize listener and no re-render. */
  p.appendChild(el('span','dt long', long));
  p.appendChild(el('span','dt short', short));
  p.appendChild(el('span','cv','▾'));
  p.setAttribute('aria-label', (lead ? lead + ', ' : '') + long + ' — jump to a date');

  /* Last in the cluster, so appearing and vanishing moves nothing. It used to
     sit before the date and take ~72px of gap with it. */
  const t = $('today');
  t.textContent = 'Today';
  t.title = 'Jump to today (T)';
  if (showHints()) t.appendChild(el('kbd','hint','T'));
  t.style.display = todayOnScreen() ? 'none' : '';
  paintStorageBadge();

  const ob = $('overflow'); ob.innerHTML = '';
  if (c){
    const n = overflowCount(c);
    if (n > 0){
      const pill = el('div','overflowpill', `${n} lesson${n>1?'s':''} past the end`);
      pill.title = 'Kept, not deleted. Extend the class end date or remove days to pull them back in.';
      ob.appendChild(pill);
    }
  }
}

/* Monday-based, so index i off weekStart lands on WEEK_ORDER[i]. */
const weekDates = anchor => {
  const s = weekStart(anchor);
  return visibleDows().map((_,i) => addDays(s,i));
};

/* ─────────────────────────── WEEK (one class) ─────────────────────────── */

function renderWeek(stage){
  const c = course();
  const dates = weekDates(ui.anchor);
  const idxByDate = meetingIndexByDate(c);
  /* One index per render pass — meetingDates isn't memoised, and deriving
     due dates per cell would rebuild it dozens of times. */
  const hwAll = hwOn(c) ? meetingDates(c) : null;
  const dueIdx = hwAll ? buildDueIndex(c, hwAll) : new Map();

  const grid = el('div','weekgrid');
  grid.style.setProperty('--rowh','66px');
  grid.style.setProperty('--headh','86px');
  grid.style.gridTemplateColumns = `180px repeat(${dates.length}, minmax(190px,1fr))`;
  /* header row, one row per component, then a row for the + Row button. Every
     column in a week shows the same rows, so a week row lands on all of them. */
  const weekRows = weekRowsOn(c, dates[0]);
  const nRows = c.rows.length + weekRows.length;
  grid.style.gridTemplateRows = `auto repeat(${nRows}, auto) auto`;

  /* Row labels */
  const labels = el('div','rowlabels');
  labels.appendChild(el('div','rl-spacer'));
  c.rows.forEach((r,ri) => labels.appendChild(rowLabel(c, r, ri)));
  weekRows.forEach(r => labels.appendChild(weekRowLabel(c, r)));
  const add = el('button','addrowmini','+ Row');
  add.title = 'Add a row';
  add.onclick = e => openAddRowMenu(e, c, dates);
  labels.appendChild(add);
  grid.appendChild(labels);

  /* Day columns */
  dates.forEach(date => {
    const hol = holidayOn(date);
    if (hol) return grid.appendChild(offColumn(hol.reason, fmtShort(date), date, c, dueIdx));

    if (isCancelled(c, date)){
      const col = offColumn('No Class', fmtShort(date), date, c, dueIdx);
      const b = el('button','','Restore');
      b.onclick = () => restoreMeeting(c, date);
      col.firstChild.appendChild(b);
      return grid.appendChild(col);
    }
    const idx = idxByDate.get(date);
    if (idx === undefined)
      return grid.appendChild(offColumn('No Class', fmtShort(date), date, c, dueIdx));

    grid.appendChild(dayColumn(c, date, idx, hwAll, dueIdx));
  });

  stage.appendChild(grid);
}

/* ─────────────────────────── Editable cells ───────────────────────────
   Pasting from Word or Google Docs carries inline styles, font tags and
   class names that wreck the grid's typography and bloat the file. Keep the
   handful of tags the toolbar can actually produce; unwrap everything else.
   ─────────────────────────────────────────────────────────────────────── */

const PASTE_KEEP = new Set(['B','STRONG','I','EM','U','UL','OL','LI','BR','P','DIV']);
/* Everything else is stripped, but a checklist's shape lives in these two —
   the class marks the list, the attribute holds the tick. */
const PASTE_KEEP_ATTR = { UL:['class'], LI:['data-c','data-due'],
                          DIV:['data-due'], P:['data-due'] };
const PASTE_DROP = new Set(['SCRIPT','STYLE','HEAD','TITLE','META','LINK']);

function cleanPaste(html){
  const box = document.createElement('div');
  box.innerHTML = html;                       // innerHTML never runs scripts
  box.querySelectorAll([...PASTE_DROP].join(',')).forEach(n => n.remove());
  /* Static list, walked in document order — unwrapped children stay in it
     and still get visited, so nested junk is stripped too. */
  box.querySelectorAll('*').forEach(n => {
    if (!PASTE_KEEP.has(n.tagName)) return n.replaceWith(...n.childNodes);
    const keep = PASTE_KEEP_ATTR[n.tagName] || [];
    [...n.attributes].forEach(a => {
      if (!keep.includes(a.name)) return n.removeAttribute(a.name);
      if (a.name === 'class' && a.value !== 'cl' && a.value !== 'hw') n.removeAttribute('class');
      if (a.name === 'data-c' && a.value !== '1') n.removeAttribute('data-c');
      if (a.name === 'data-due' && !isPinned(a.value) && !isRelative(a.value) && !isDays(a.value))
        n.removeAttribute('data-due');
    });
  });
  return box.innerHTML;
}
const escapeHtml = s => s.replace(/[&<>]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[ch]));

/** Everything a rich-text cell needs: content, live save, undo, clean paste. */
/** Label for a pill: the resolved date, or why there isn't one. */
function dueLabel(due, assignIdx, dates){
  if (!due) return 'Due…';
  const r = resolveDue(due, assignIdx, dates);
  if (!r) return 'Due…';
  if (!r.date) return 'past end';
  return (r.kind === 'date' ? '\u{1F4CC} ' : '') + fmtMed(r.date);
}

/** Refresh every pill's rendered label. Display only — data-due is the truth. */
function paintDuePills(cell, assignIdx, dates){
  /* A bare text node can't carry an attribute, and innerHTML wouldn't
     serialise one set on the cell itself — so give every line a real block.
     Never while the cell has focus: rewrapping would move the caret. */
  const focused = document.activeElement === cell || cell.contains(document.activeElement);
  if (!focused && !cell.querySelector('li,div,p') && cell.textContent.trim()){
    const d = document.createElement('div');
    while (cell.firstChild) d.appendChild(cell.firstChild);
    cell.appendChild(d);
  }
  const blocks = [...cell.querySelectorAll('li,div,p')].filter(n => !n.querySelector('li,div,p'));
  blocks.forEach(n => {
    const txt = (n.textContent || '').trim();
    if (!txt){ n.removeAttribute('data-dueon'); n.classList.remove('hwline'); return; }
    n.classList.add('hwline');
    n.setAttribute('data-dueon', dueLabel(n.getAttribute('data-due'), assignIdx, dates));
  });
}

/**
 * The Homework Assigned cell. An ordinary editable cell, plus a pill per line
 * drawn with ::after — clicking the pill zone opens the picker, the same
 * hit-testing the checklist tick already uses.
 */
function makeAssignedCell(c, lesson, rowId, idx, dates){
  const cell = makeCell(lesson, rowId, 'cell hwassigned');
  const repaint = () => paintDuePills(cell, idx, dates);
  repaint();
  const onInput = cell.oninput;
  cell.oninput = () => { onInput(); repaint(); };
  cell.addEventListener('click', e => {
    const line = e.target.closest('.hwline');
    if (!line || !cell.contains(line)) return;
    /* The pill is a ::after, so measure what was actually drawn — a fixed
       zone swallowed half of every line in a narrow column. */
    const pw = parseFloat(getComputedStyle(line, '::after').width) || 60;
    if (e.clientX < line.getBoundingClientRect().right - pw - 8) return;
    e.preventDefault();
    openDueMenu(e, c, lesson, rowId, line, idx, dates);
  });
  return cell;
}

/**
 * The Homework Due cell. What arrives from elsewhere is rendered read-only
 * above the teacher's own notes, so it lives outside the contenteditable —
 * makeCell serializes innerHTML wholesale, and anything inside would become
 * real text on the next keystroke.
 */
function makeDueCell(lesson, rowId, date, dueIdx){
  const wrap = el('div','duecell');
  const inbound = dueIdx.get(date) || [];
  if (inbound.length){
    const box = el('div','inbound');
    inbound.forEach(a => {
      const line = el('div','inline');
      line.appendChild(el('span','txt', a.text));
      const from = el('span','src', a.from ? 'from ' + fmtMed(a.from) : '');
      if (a.pinned) from.textContent = 'due today' + (a.from ? ' · from ' + fmtMed(a.from) : '');
      line.appendChild(from);
      box.appendChild(line);
    });
    wrap.appendChild(box);
  }
  /* Both classes: `cell` so keyboard navigation finds it, `own` so the
     duecell styling can strip the box back off. */
  wrap.appendChild(makeCell(lesson, rowId, 'cell own'));
  return wrap;
}

/** Relative or absolute, in one menu. */
/** Which block a line is within its cell — the only handle that survives a
    render(). commit() calls render(), which replaces the whole stage, so a
    captured node is detached by the time a second click writes through it;
    the old menu wrote stale HTML back and could silently clobber an edit. */
function lineIndexIn(cell, line){
  const blocks = [...cell.querySelectorAll('li,div,p')].filter(n => !n.querySelector('li,div,p'));
  return blocks.indexOf(line);
}

function openDueMenu(e, c, lesson, rowId, line, idx, dates){
  const m = $('menu'); m.innerHTML = '';
  m.classList.add('narrow');
  const cell = line.closest('.cell');
  /* paintDuePills can wrap bare text in a div on the live node without that
     ever reaching lesson.cells, which would put the two out of step. Sync
     first so the block index means the same thing on both sides. */
  lesson.cells[rowId] = cell.innerHTML;
  const lineIdx = lineIndexIn(cell, line);

  /* Address the line by position, not by node reference. */
  const set = v => commit(v === null ? 'Due date cleared' : 'Due date set', () => {
    const box = document.createElement('div');
    box.innerHTML = lesson.cells[rowId] || '';
    const blocks = [...box.querySelectorAll('li,div,p')].filter(n => !n.querySelector('li,div,p'));
    const t = blocks[lineIdx];
    if (!t) return;
    if (v === null) t.removeAttribute('data-due');
    else t.setAttribute('data-due', v);
    lesson.cells[rowId] = box.innerHTML;
  });

  const cur = line.getAttribute('data-due');
  let unit = isDays(cur) ? 'days' : 'classes';
  let n = isRelative(cur) ? Number(cur.slice(1)) : isDays(cur) ? Number(cur.slice(1)) : 1;
  const encode = () => (unit === 'days' ? 'd' : '+') + n;

  /* One commit per burst of stepping, not one per click: 1→5 should be a
     single ⌘Z. The steps only move a local number, so commit's before-snapshot
     is still the state as it was when the menu opened. */
  let pending = 0;
  const flush = () => { if (pending){ clearTimeout(pending); pending = 0; } set(encode()); };
  const schedule = () => { clearTimeout(pending); pending = setTimeout(flush, 450); };

  m.appendChild(el('div','sec','Due'));

  const step = el('div','duestep');
  const minus = el('button','stepbtn','−');
  const val   = el('div','stepval');
  const plus  = el('button','stepbtn','+');
  const sw    = el('div','unitsw');
  const bClass = el('button','', 'classes');
  const bDays  = el('button','', 'days');
  sw.appendChild(bClass); sw.appendChild(bDays);
  step.appendChild(minus); step.appendChild(val); step.appendChild(plus); step.appendChild(sw);
  m.appendChild(step);

  const when = el('div','duewhen');
  m.appendChild(when);

  function paint(){
    val.textContent = n;
    minus.disabled = n <= 1;
    bClass.classList.toggle('on', unit === 'classes');
    bDays.classList.toggle('on', unit === 'days');
    const r = resolveDue(encode(), idx, dates);
    when.textContent = r && r.date ? fmtLong(r.date)
      : unit === 'days' ? 'past the end of the year' : 'past the end of the class';
  }
  const bump = d => { n = Math.max(1, Math.min(60, n + d)); paint(); schedule(); };
  minus.onclick = () => bump(-1);
  plus.onclick  = () => bump(1);
  bClass.onclick = () => { unit = 'classes'; paint(); schedule(); };
  bDays.onclick  = () => { unit = 'days';    paint(); schedule(); };
  paint();

  m.appendChild(document.createElement('hr'));
  const pick = menuItem(m, 'Pick a date…', () => { clearTimeout(pending); pending = 0;
                                                   pickDueDate(line, dates[idx], set); });
  pick.classList.add('withico');
  pick.insertBefore(el('span','mico','\u{1F4C5}'), pick.firstChild);
  const clear = menuItem(m, 'No due date', () => { clearTimeout(pending); pending = 0; set(null); });
  clear.classList.add('withico');
  clear.insertBefore(el('span','mico','\u2715'), clear.firstChild);

  placeMenu(e);
}

/* A date input can't live in the menu — it closes on any outside mousedown,
   and a menu item closes before its action runs. showPicker() sidesteps both. */
function pickDueDate(line, from, set){
  const inp = document.createElement('input');
  inp.type = 'date';
  inp.value = isPinned(line.getAttribute('data-due')) ? line.getAttribute('data-due') : (from || '');
  inp.style.cssText = 'position:fixed;left:-9999px;opacity:0';
  document.body.appendChild(inp);
  const kill = () => inp.remove();
  inp.onchange = () => { if (inp.value) set(inp.value); kill(); };
  inp.onblur = () => setTimeout(kill, 300);
  setTimeout(kill, 60000);          /* dismissing the picker fires neither */
  if (inp.showPicker) { try { inp.showPicker(); return; } catch(err){} }
  /* No showPicker: put it on screen and let them use it directly. */
  inp.style.cssText = 'position:fixed;z-index:300;left:50%;top:40%;transform:translate(-50%,-50%)';
  inp.focus();
}

function makeCell(lesson, rowId, cls){
  const cell = el('div', cls || 'cell');
  cell.contentEditable = 'true';
  cell.innerHTML = lesson.cells[rowId] || '';
  cell.dataset.row = rowId;
  cell.oninput = () => { lesson.cells[rowId] = cell.innerHTML; save(); };
  cell.onfocus = () => showFmt(cell);
  cell.onblur  = () => hideFmt();
  cell.addEventListener('paste', e => {
    e.preventDefault();
    const cd = e.clipboardData;
    const html = cd.getData('text/html');
    document.execCommand('insertHTML', false,
      html ? cleanPaste(html) : escapeHtml(cd.getData('text/plain')).replace(/\n/g,'<br>'));
  });
  bindEditable(cell, () => cell.innerHTML, v => setCell(lesson.id, rowId, v), 'Cell edited');
  return cell;
}

/** The lesson-concept input, with the same one-entry-per-session undo. */
function makeTitle(lesson){
  const title = el('div','title');
  title.contentEditable = 'true';
  title.spellcheck = false;
  title.dataset.ph = 'Lesson concept…';
  title.textContent = lesson.title || '';
  title.oninput = () => { lesson.title = title.textContent; save(); };
  /* One line of meaning, however many lines of screen — Enter leaves rather
     than starting a paragraph. */
  title.onkeydown = e => { if (e.key === 'Enter'){ e.preventDefault(); title.blur(); } };
  bindEditable(title, () => title.textContent, v => setTitle(lesson.id, v), 'Concept edited');
  return title;
}

/**
 * A day with no class. Striped everywhere — except the Homework Due row,
 * which stays live when something is actually due that day. The column still
 * reads as "no class"; the one thing you'd still need remains readable, and
 * it's what gives a pinned off-day deadline somewhere to appear.
 */
function offColumn(title, sub, date, c, dueIdx){
  const col = el('div','daycol offday' + (date && date === iso(new Date()) ? ' istoday' : ''));
  const rows = c ? rowsFor(c, date) : [];
  const inbound = (c && dueIdx && date) ? (dueIdx.get(date) || []) : [];

  if (!c || !inbound.length){
    /* -2, not -1: the last row belongs to the "+ Row" button. */
    col.style.gridRow = '1 / -2';
    const box = el('div','offcol');
    box.appendChild(el('b','', title));
    box.appendChild(el('span','', sub));
    col.appendChild(box);
    return col;
  }

  /* Participate in the subgrid so the live row lines up with its neighbours. */
  col.classList.remove('offday');
  col.classList.add('offsplit');
  col.style.gridRow = `1 / span ${rows.length + 1}`;

  const head = el('div','dayhead offhead');
  const top = el('div','top');
  top.appendChild(el('span','dow', DOW3[dow(date)]));
  top.appendChild(el('span','date', sub));
  head.appendChild(top);
  head.appendChild(el('div','offname', title));
  col.appendChild(head);

  rows.forEach(r => {
    if (rowRole(r) !== 'due'){ col.appendChild(el('div','cell offcell')); return; }
    const wrap = el('div','cell duecell');
    const box = el('div','inbound');
    inbound.forEach(a => {
      const line = el('div','inline');
      line.appendChild(el('span','txt', a.text));
      line.appendChild(el('span','src', a.from ? 'from ' + fmtMed(a.from) : ''));
      box.appendChild(line);
    });
    wrap.appendChild(box);
    col.appendChild(wrap);
  });
  return col;
}

function rowLabel(c, r, ri){
  const rl = el('div','rowlabel');
  rl.draggable = true;
  rl.appendChild(el('span','grip','⋮⋮'));
  const txt = el('span','txt', r.label);
  txt.contentEditable = 'true';
  txt.style.outline = 'none';
  txt.onblur = () => {
    const v = txt.textContent.trim();
    if (v && v !== r.label) commit('Row renamed', () => { r.label = v; });
    else txt.textContent = r.label;
  };
  txt.onkeydown = e => { if (e.key === 'Enter'){ e.preventDefault(); txt.blur(); } };
  rl.appendChild(txt);
  const x = el('button','x','×');
  x.title = 'Delete row';
  x.onclick = e => {
    e.stopPropagation();
    commit('Row deleted', () => c.rows.splice(ri,1));
  };
  rl.appendChild(x);

  rl.ondragstart = e => {
    e.dataTransfer.setData('text/row', String(ri));
    e.dataTransfer.effectAllowed = 'move';
    rl.classList.add('dragging');
  };
  rl.ondragend   = () => rl.classList.remove('dragging');
  rl.ondragover  = e => {
    if (!e.dataTransfer.types.includes('text/row')) return;
    e.preventDefault(); rl.classList.add('over');
  };
  rl.ondragleave = () => rl.classList.remove('over');
  rl.ondrop = e => {
    e.preventDefault(); rl.classList.remove('over');
    const from = Number(e.dataTransfer.getData('text/row'));
    if (from === ri) return;
    commit('Reordered rows', () => {
      const [m] = c.rows.splice(from,1);
      c.rows.splice(ri,0,m);
    });
  };
  return rl;
}

/** A week row's label. Marked so it doesn't read as part of the class. */
function weekRowLabel(c, r){
  const rl = el('div','rowlabel weekrow');
  rl.appendChild(el('span','grip','◷'));
  rl.title = `Just this week (${fmtMed(r.from)} – ${fmtMed(r.to)})`;
  rl.appendChild(el('span','txt', r.label));
  const x = el('button','x','×');
  x.title = 'Remove this week row';
  x.onclick = () => commit('Week row removed',
    () => { c.weekRows = (c.weekRows || []).filter(w => w.id !== r.id); });
  rl.appendChild(x);
  return rl;
}

function openAddRowMenu(e, c, dates){
  const m = $('menu'); m.innerHTML = '';
  m.appendChild(el('div','sec','Add a row'));
  menuItem(m, 'To this class', () =>
    commit('Row added', () => c.rows.push({ id:uid(), label:'New row' })),
    '', 'Every week, from now on');
  menuItem(m, 'Just this week', () =>
    commit('Week row added', () => {
      c.weekRows = (c.weekRows || []).concat(
        { id:uid(), label:'This week', from:dates[0], to:dates[dates.length-1] });
    }), '', fmtMed(dates[0]) + ' – ' + fmtMed(dates[dates.length-1]));
  placeMenu(e);
}

function dayColumn(c, date, idx, hwDates, dueIdx){
  const lesson = ensureLesson(c, idx);
  const col = el('div','daycol' + (date === iso(new Date()) ? ' istoday' : ''));
  /* header + one row per component; the + Row row belongs to the labels only */
  col.style.gridRow = `1 / span ${rowsFor(c, date).length + 1}`;
  col.dataset.idx  = String(idx);
  col.dataset.date = date;

  const head = el('div','dayhead');
  const top = el('div','top');
  top.appendChild(el('span','dow', DOW3[dow(date)]));
  top.appendChild(el('span','date', fmtShort(date)));
  if (date === iso(new Date())) top.appendChild(el('span','now','Today'));
  head.appendChild(top);

  head.appendChild(makeTitle(lesson));

  const tagrow = el('div','tagrow');
  const pill = el('button','tagpill' + (lesson.tag === 'none' ? ' none' : ''),
                  lesson.tag === 'none' ? '' : TAGS[lesson.tag].label);
  if (lesson.tag === 'none'){ pill.title = 'Add a tag'; pill.setAttribute('aria-label','Add a tag'); }
  pill.style.setProperty('--t', TAGS[lesson.tag].color);
  pill.onclick = e => { e.stopPropagation(); openTagMenu(e, c, idx, date); };
  /* Status first: "is this ready" is the question being scanned for. */
  tagrow.appendChild(statusPill(c, idx, lesson, false, date));
  tagrow.appendChild(pill);
  head.appendChild(tagrow);

  const grip = el('button','grip','⋮⋮');
  grip.title = 'Drag to move this day';
  head.appendChild(grip);

  const more = el('button','more','⋯');
  more.onclick = e => { e.stopPropagation(); openDayMenu(e, c, idx, date); };
  head.appendChild(more);
  head.oncontextmenu = e => { e.preventDefault(); openDayMenu(e, c, idx, date); };

  col.appendChild(head);

  rowsFor(c, date).forEach(r => {
    const role = hwDates && rowRole(r);
    const cell = role === 'assigned' ? makeAssignedCell(c, lesson, r.id, idx, hwDates)
               : role === 'due'      ? makeDueCell(lesson, r.id, date, dueIdx)
               : makeCell(lesson, r.id);
    cell.oncontextmenu = e => { e.preventDefault(); openCellMenu(e, c, idx, r); };
    col.appendChild(cell);
  });

  /* Drag starts from the grip, or from empty space in the header. One
     listener on the header covers both — the grip is inside it, so binding
     the grip separately would fire beginDrag twice for the same press.
     Shift is reserved for range selection, so it must not start a drag. */
  head.addEventListener('pointerdown', e => {
    if (e.shiftKey) return;
    if (e.target.closest('input, .title, .more, .tagpill, .statuspill')) return;
    beginDrag(e, c, col);
  });
  head.addEventListener('click', e => {
    if (!e.shiftKey || e.target.closest('input, .title, .more, .tagpill, .statuspill')) return;
    e.preventDefault();
    extendSelection(c, idx);
  });

  return col;
}

/* ═══════════════════════════════════════════════════════════════════
   DAY DRAG — pointer events, geometry-based targeting.

   The old version used HTML5 drag-and-drop. Every day column holds
   several contenteditable cells, and dragover/dragleave fire per
   ELEMENT, so crossing from the header into a cell fired dragleave and
   wiped the drop indicator mid-aim. relatedTarget is routinely null
   during a native drag, so the guard against that failed open. Result:
   a flickering target that only sometimes accepted the drop.

   Here nothing is hit-tested. We measure the columns on every move and
   decide purely from the cursor's x position, so the cells underneath
   are irrelevant and the indicator cannot flicker.

     · within 22px of a boundary between days  → INSERT there
     · anywhere else inside a day              → SWAP with that day
   ═══════════════════════════════════════════════════════════════════ */

const GUTTER = 24;        // half-width of an insert zone, px — fixed, not a %
const THRESHOLD = 5;      // px of movement before a drag actually starts
const EDGE = 64;          // autoscroll trigger distance from the stage edge
const HYST = 8;           // px you must overshoot a boundary to change your mind

let drag = null;

function beginDrag(e, c, col){
  if (e.button !== 0 || drag) return;
  e.preventDefault();
  drag = {
    course: c,
    fromIdx: Number(col.dataset.idx),
    col,
    x0: e.clientX, y0: e.clientY,
    px: e.clientX, py: e.clientY,
    active: false, target: null, geo: null, raf: 0,
    pointerId: e.pointerId,
  };
  window.addEventListener('pointermove', onDragMove);
  window.addEventListener('pointerup', onDragEnd);
  window.addEventListener('pointercancel', cancelDrag);
  window.addEventListener('blur', cancelDrag);
}

/* Moves only record the cursor. All measuring and painting happens in the
   frame loop, so the indicator keeps updating while the pointer is parked
   at a screen edge and the view scrolls underneath it. */
function onDragMove(e){
  if (!drag) return;
  drag.px = e.clientX; drag.py = e.clientY;
  if (!drag.active &&
      Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0) >= THRESHOLD) activateDrag();
}

function activateDrag(){
  drag.active = true;
  document.body.classList.add('dragging');
  drag.col.classList.add('drag-src');

  const head = drag.col.querySelector('.dayhead');
  const r = head.getBoundingClientRect();
  const ghost = $('dragGhost');
  ghost.innerHTML = '';
  const cl = head.cloneNode(true);
  cl.style.width = r.width + 'px';
  cl.style.height = r.height + 'px';
  cl.style.margin = '0';
  ghost.appendChild(cl);
  ghost.style.width = r.width + 'px';
  ghost.style.display = 'block';
  ghost.dataset.dx = String(drag.x0 - r.left);   // grab it where it was grabbed,
  ghost.dataset.dy = String(drag.y0 - r.top);    // so it doesn't jump under the hand
  $('dragCaret').classList.remove('slide');      // first placement shouldn't animate
  drag.raf = requestAnimationFrame(dragFrame);
}

function dragFrame(){
  if (!drag || !drag.active) return;
  autoScroll(drag.px);
  drag.geo = columnGeometry();
  drag.target = resolveTarget(drag.px, drag.target, drag.geo);
  paintDrag(drag.px, drag.py, drag.geo);
  drag.raf = requestAnimationFrame(dragFrame);
}

/** Measure every droppable day column. Holiday and no-class columns carry no
    data-idx, so they're invisible here and can never be a swap target. */
function columnGeometry(){
  return [...document.querySelectorAll('.daycol[data-idx]')].map(n => {
    const r = n.getBoundingClientRect();
    return { idx:Number(n.dataset.idx), date:n.dataset.date, node:n,
             left:r.left, right:r.right, top:r.top, bottom:r.bottom };
  }).sort((a,b) => a.left - b.left);
}

/**
 * Decide what a drop at this x means, purely from geometry — nothing is
 * hit-tested, so the contenteditable cells underneath are irrelevant.
 *
 *   { kind:'insert', at, cx }  — sequence index to insert before
 *   { kind:'swap', idx, node } — sequence index to exchange with
 *   noop:true                  — resolves to no change; commits nothing
 *
 * Each result carries the x range [lo,hi] it owns. A decision keeps its
 * territory plus HYST px, so the target doesn't flip back and forth while
 * you're hovering near a boundary trying to release.
 */
function resolveTarget(x, prev, cols){
  if (!cols.length) return null;
  if (prev && prev.lo !== undefined && x >= prev.lo - HYST && x <= prev.hi + HYST) return prev;

  // Boundaries: before the first column, between each pair, after the last.
  const bounds = [{ x: cols[0].left, at: cols[0].idx }];
  for (let i = 1; i < cols.length; i++)
    bounds.push({ x:(cols[i-1].right + cols[i].left)/2, at: cols[i].idx });
  bounds.push({ x: cols[cols.length-1].right, at: cols[cols.length-1].idx + 1 });

  let best = null;
  bounds.forEach(b => {
    const d = Math.abs(x - b.x);
    if (d <= GUTTER && (!best || d < best.d)) best = b;
  });
  if (best) return {
    kind:'insert', at:best.at, cx:best.x,
    lo:best.x - GUTTER, hi:best.x + GUTTER,
    noop: best.at === drag.fromIdx || best.at === drag.fromIdx + 1,
  };

  const hit = cols.find(c => x >= c.left && x <= c.right);
  if (!hit) return null;
  return {
    kind:'swap', idx:hit.idx, date:hit.date, node:hit.node,
    lo:hit.left + GUTTER, hi:hit.right - GUTTER,
    noop: hit.idx === drag.fromIdx,
  };
}

function paintDrag(x, y, cols){
  const ghost = $('dragGhost'), caret = $('dragCaret'), label = $('dragLabel');
  ghost.style.left = (x - Number(ghost.dataset.dx)) + 'px';
  ghost.style.top  = (y - Number(ghost.dataset.dy)) + 'px';

  const t = drag.target;
  const lit = t && t.kind === 'swap' && !t.noop ? t.node : null;
  document.querySelectorAll('.swap-target').forEach(n => {
    if (n !== lit) n.classList.remove('swap-target');
  });
  if (lit) lit.classList.add('swap-target');

  let text = 'Release to cancel', sub = '';
  if (t && t.kind === 'insert'){
    const top = Math.min(...cols.map(c => c.top));
    const bot = Math.max(...cols.map(c => c.bottom));
    caret.style.display = 'block';
    caret.style.left = (t.cx - 1.5) + 'px';
    caret.style.top = top + 'px';
    caret.style.height = (bot - top) + 'px';
    caret.style.opacity = t.noop ? '.28' : '1';
    requestAnimationFrame(() => caret.classList.add('slide'));
    text = t.noop ? 'Back where it started' : 'Insert here';
    sub  = t.noop ? '' : 'rest shifts forward one meeting';
  } else {
    caret.style.display = 'none';
    caret.classList.remove('slide');
    if (t && t.kind === 'swap')
      text = t.noop ? 'Back where it started'
                    : 'Swap with ' + DOW3[dow(t.date)] + ' ' + fmtShort(t.date);
  }

  label.innerHTML = '';
  label.appendChild(el('div','', text));
  if (sub) label.appendChild(el('div','sub', sub));
  label.classList.toggle('dim', !t || t.noop);
  label.style.display = 'block';
  const lw = label.offsetWidth;
  label.style.left = Math.min(Math.max(8, x + 16), innerWidth - lw - 8) + 'px';
  label.style.top  = Math.min(y + 22, innerHeight - label.offsetHeight - 8) + 'px';
}

function autoScroll(x){
  const stage = $('stage'), r = stage.getBoundingClientRect();
  if (x < r.left + EDGE)       stage.scrollLeft -= Math.min(26, Math.max(3, (r.left + EDGE - x) / 2.5));
  else if (x > r.right - EDGE) stage.scrollLeft += Math.min(26, Math.max(3, (x - (r.right - EDGE)) / 2.5));
}

function onDragEnd(){
  if (!drag) return;
  const { active, target, course:c, fromIdx } = drag;
  teardownDrag();
  if (!active || !target || target.noop) return;
  if (target.kind === 'insert') moveDay(c, fromIdx, target.at);
  else if (target.kind === 'swap') swapDays(c, fromIdx, target.idx);
}

function cancelDrag(){
  if (!drag) return;
  const wasActive = drag.active;
  teardownDrag();
  if (wasActive) toast('Move cancelled');
}

function teardownDrag(){
  if (drag && drag.raf) cancelAnimationFrame(drag.raf);
  window.removeEventListener('pointermove', onDragMove);
  window.removeEventListener('pointerup', onDragEnd);
  window.removeEventListener('pointercancel', cancelDrag);
  window.removeEventListener('blur', cancelDrag);
  document.body.classList.remove('dragging');
  if (drag && drag.col) drag.col.classList.remove('drag-src');
  document.querySelectorAll('.swap-target').forEach(n => n.classList.remove('swap-target'));
  $('dragGhost').style.display = 'none';
  $('dragCaret').style.display = 'none';
  $('dragCaret').classList.remove('slide');
  $('dragLabel').style.display = 'none';
  drag = null;
}

/* ─────────────────────────── DAY (one class) ─────────────────────────── */

function renderDay(stage){
  const c = course(), date = ui.anchor;
  const wrap = el('div','dayview');
  const hol = holidayOn(date);

  const bail = (title, sub, extra) => {
    const card = el('div','card'), es = el('div','empty-state');
    es.appendChild(el('b','', title));
    es.appendChild(el('div','', sub));
    if (extra) es.appendChild(extra);
    card.appendChild(es); wrap.appendChild(card); stage.appendChild(wrap);
  };

  if (hol) return bail(hol.reason, 'No school');
  if (isCancelled(c, date)){
    const b = el('button','cta','Restore');
    b.onclick = () => restoreMeeting(c, date);
    return bail('No Class', 'Lessons shifted forward', b);
  }
  if (date < c.startDate) return bail('Not started', `Begins ${fmtMed(c.startDate)}`);
  if (date > c.endDate)   return bail('Finished', `Ended ${fmtMed(c.endDate)}`);

  const idx = meetingIndexByDate(c).get(date);
  if (idx === undefined)
    return bail('No Class', `Meets ${c.weekdays.map(w => DOW3[w]).join(' ')}`);

  const lesson = ensureLesson(c, idx);
  const card = el('div','card');
  const hd = el('div','hd');
  hd.appendChild(el('h2','', fmtLong(date)));
  hd.appendChild(el('span','note','lesson #' + (idx+1)));
  hd.appendChild(el('div','spacer'));
  const pill = el('button','tagpill' + (lesson.tag === 'none' ? ' none' : ''),
                  lesson.tag === 'none' ? '' : TAGS[lesson.tag].label);
  if (lesson.tag === 'none'){ pill.title = 'Add a tag'; pill.setAttribute('aria-label','Add a tag'); }
  pill.style.setProperty('--t', TAGS[lesson.tag].color);
  pill.onclick = e => openTagMenu(e, c, idx, date);
  hd.appendChild(statusPill(c, idx, lesson, true, date));
  hd.appendChild(pill);
  card.appendChild(hd);

  card.appendChild(makeTitle(lesson));
  wrap.appendChild(card);

  const hwDates = hwOn(c) ? meetingDates(c) : null;
  const dueIdx = hwDates ? buildDueIndex(c, hwDates) : new Map();
  rowsFor(c, date).forEach(r => {
    const box = el('div','card');
    box.appendChild(el('div','lbl', r.label));
    const role = hwDates && rowRole(r);
    box.appendChild(role === 'assigned' ? makeAssignedCell(c, lesson, r.id, idx, hwDates)
                  : role === 'due'      ? makeDueCell(lesson, r.id, date, dueIdx)
                  : makeCell(lesson, r.id));
    wrap.appendChild(box);
  });
  stage.appendChild(wrap);
}

/* ─────────────────────────── MONTH (one class) ─────────────────────────── */

function monthCells(anchor){
  const d = parse(anchor);
  const first = new Date(d.getFullYear(), d.getMonth(), 1);
  const last  = new Date(d.getFullYear(), d.getMonth()+1, 0);
  const dows = visibleDows();
  const days = [];
  for (let dd = new Date(first); dd <= last; dd.setDate(dd.getDate()+1)){
    const s = iso(dd);
    if (dows.includes(dow(s))) days.push(s);
  }
  /* Blank cells before the 1st, so the columns line up with the headings. */
  const lead = days.length ? dows.indexOf(dow(days[0])) : 0;
  return { lead, days, cols: dows.length };
}

function renderMonth(stage){
  const c = course();
  const { lead, days, cols } = monthCells(ui.anchor);
  const idxByDate = meetingIndexByDate(c);
  const today = iso(new Date());

  const grid = el('div','month');
  grid.style.gridTemplateColumns = `repeat(${cols},1fr)`;
  visibleDows().forEach(w => grid.appendChild(
    el('div','dow' + (w === 0 || w === 6 ? ' wknd' : ''), DOW3[w])));
  for (let i = 0; i < lead; i++) grid.appendChild(el('div','mcell off'));

  days.forEach(date => {
    const cell = el('div','mcell' + (date === today ? ' today' : '')
                                  + (isWeekend(date) ? ' wknd' : ''));
    const hol = holidayOn(date);
    if (hol){
      cell.classList.add('hol');
      cell.appendChild(el('div','n', String(parse(date).getDate())));
      cell.appendChild(el('div','hn', hol.reason));
      return grid.appendChild(cell);
    }
    const idx = idxByDate.get(date);
    if (idx === undefined){
      cell.classList.add('off');
      cell.appendChild(el('div','n', String(parse(date).getDate())));
      if (isCancelled(c, date)) cell.appendChild(el('div','hn','No Class'));
      return grid.appendChild(cell);
    }
    const lesson = state.lessons[c.lessons[idx]];
    if (lesson && lesson.tag !== 'none'){
      const bar = el('div','bar');
      bar.style.setProperty('--t', TAGS[lesson.tag].color);
      cell.appendChild(bar);
    }
    cell.appendChild(el('div','n', String(parse(date).getDate())));
    cell.appendChild(el('div','t', lesson && lesson.title ? lesson.title : ''));
    if (lesson && lesson.status && STATUS[lesson.status]){
      const sr = el('div','srow');
      const dot = el('i','sdot');
      dot.style.setProperty('--s', STATUS[lesson.status].color);
      sr.appendChild(dot);
      sr.appendChild(el('span','', STATUS[lesson.status].short));
      cell.appendChild(sr);
    }
    cell.dataset.idx = String(idx);
    cell.onclick = e => {
      /* Month view is where a semester gets blocked out, so range-select
         belongs here as much as in the week grid. */
      if (e.shiftKey){ e.preventDefault(); return extendSelection(c, idx); }
      ui.anchor = date; ui.view = 'day'; render();
    };
    grid.appendChild(cell);
  });
  stage.appendChild(grid);
}

/* ─────────────────────────── ALL CLASSES ───────────────────────────
   Week: rows = classes, columns = weekdays, concept + tag.
   Month: chips only — built for spotting assessment collisions.
   Day: what every class is doing on one date.
   ─────────────────────────────────────────────────────────────────── */

/** A badge for a class: the number in its name ("Grade 7" → 7), else initials. */
function shortLabel(name){
  const m = String(name).match(/\d+/);
  if (m) return m[0];
  const letters = String(name).replace(/[^A-Za-z]/g,'');
  return (letters.slice(0,2) || '?').toUpperCase();
}

/* The class tab bar above already maps colour to name, so the legend only
   has to explain the marks. */
function classLegend(){
  const box = el('div','legend');
  box.appendChild(el('div','k',
    'Square = tag · round = status · ruled line = nothing planned · ⚠ = two or more assessments'));
  return box;
}

/** How many classes have a test or quiz on this date. */
function collisionsOn(date){
  return state.courses.filter(c => {
    const l = lessonOn(c, date);
    return l && ASSESSMENT.has(l.tag);
  }).length;
}

function renderAllMonth(stage){
  const { lead, days, cols } = monthCells(ui.anchor);
  const today = iso(new Date());
  stage.appendChild(classLegend());

  const grid = el('div','month');
  grid.style.gridTemplateColumns = `repeat(${cols},1fr)`;
  visibleDows().forEach(w => grid.appendChild(
    el('div','dow' + (w === 0 || w === 6 ? ' wknd' : ''), DOW3[w])));
  for (let i = 0; i < lead; i++) grid.appendChild(el('div','mcell off multi'));

  days.forEach(date => {
    const cell = el('div','mcell multi' + (date === today ? ' today' : '')
                                        + (isWeekend(date) ? ' wknd' : ''));
    const hol = holidayOn(date);
    if (hol){
      cell.classList.add('hol');
      cell.appendChild(el('div','n', String(parse(date).getDate())));
      cell.appendChild(el('div','hn', hol.reason));
      return grid.appendChild(cell);
    }

    const hits = collisionsOn(date);
    if (hits >= 2) cell.classList.add('collide');

    const nrow = el('div','nrow');
    nrow.appendChild(el('div','n', String(parse(date).getDate())));
    if (hits >= 2){
      const w = el('div','warn');
      w.textContent = '⚠ ' + hits;
      w.title = hits + ' classes have a test or quiz on this day';
      nrow.appendChild(w);
    }
    cell.appendChild(nrow);

    state.courses.forEach(c => {
      const row = el('div','mrow');
      const badge = el('div','mc', shortLabel(c.name));
      badge.style.setProperty('--c', c.color);
      row.appendChild(badge);

      const dot = el('div','md no');
      row.appendChild(dot);

      if (date < c.startDate || date > c.endDate){
        row.classList.add('void');
        row.appendChild(el('div','mt blank'));
        row.title = `${c.name} · not running`;
      } else if (isCancelled(c, date)){
        row.appendChild(el('div','mt nc','No Class'));
        row.title = `${c.name} · No Class`;
      } else {
        const l = lessonOn(c, date);
        if (!l){
          row.classList.add('absent');
          row.appendChild(el('div','mt blank'));
          row.title = `${c.name} · No Class`;
        } else {
          if (l.tag !== 'none'){
            dot.classList.remove('no');
            dot.style.setProperty('--t', TAGS[l.tag].color);
            row.style.setProperty('--w',
              `color-mix(in srgb, ${TAGS[l.tag].color} 12%, transparent)`);
          }
          const stKey = effectiveStatus(l, date);
          if (stKey){
            const sd = el('i','sdot');
            sd.style.setProperty('--s', STATUS[stKey].color);
            sd.title = STATUS[stKey].label;
            row.appendChild(sd);
          }
          row.appendChild(l.title ? el('div','mt', l.title) : el('div','mt blank'));
          row.title = `${c.name} · ${l.title || 'Not planned'}` +
                      (l.tag !== 'none' ? ` · ${TAGS[l.tag].label}` : '');
          row.classList.add('live');
          row.onclick = ev => {
            ev.stopPropagation();
            ui.courseId = c.id; ui.anchor = date; ui.view = 'day'; render();
          };
        }
      }
      cell.appendChild(row);
    });
    grid.appendChild(cell);
  });
  stage.appendChild(grid);
}

function renderAllWeek(stage){
  const dates = weekDates(ui.anchor);
  const grid = el('div','ovgrid');
  grid.style.gridTemplateColumns = `150px repeat(${dates.length}, minmax(140px,1fr))`;

  grid.appendChild(el('div',''));
  dates.forEach(date => {
    const h = el('div','ovhead' + (date === iso(new Date()) ? ' today' : ''));
    h.appendChild(document.createTextNode(DOW3[dow(date)]));
    const hol = holidayOn(date);
    h.appendChild(el('small','', hol ? hol.reason : fmtShort(date)));
    grid.appendChild(h);
  });

  state.courses.forEach(c => {
    const label = el('div','ovclass');
    label.style.setProperty('--c', c.color);
    label.appendChild(el('span','', c.name));
    label.onclick = () => { ui.courseId = c.id; ui.view = 'week'; render(); };
    grid.appendChild(label);

    const idxByDate = meetingIndexByDate(c);
    dates.forEach(date => {
      const hol = holidayOn(date);
      const idx = idxByDate.get(date);
      const isToday = date === iso(new Date());
      if (hol || idx === undefined){
        const cell = el('div','ovcell empty' + (isToday ? ' ovcol-today' : ''));
        cell.appendChild(el('div','t', hol ? '—' : 'No Class'));
        return grid.appendChild(cell);
      }
      const lesson = state.lessons[c.lessons[idx]];
      const cell = el('div','ovcell' + (isToday ? ' ovcol-today' : ''));
      const marks = el('div','');
      marks.style.cssText = 'display:flex;align-items:center;gap:6px';
      if (lesson && lesson.tag !== 'none'){
        const p = el('span','tagpill', TAGS[lesson.tag].label);
        p.style.setProperty('--t', TAGS[lesson.tag].color);
        marks.appendChild(p);
      }
      if (lesson && lesson.status && STATUS[lesson.status]){
        const dot = el('i','sdot');
        dot.style.setProperty('--s', STATUS[lesson.status].color);
        dot.title = STATUS[lesson.status].label;
        marks.appendChild(dot);
      }
      if (marks.childNodes.length) cell.appendChild(marks);
      /* An unplanned meeting is a ruled blank, not the word "Untitled". */
      cell.appendChild(lesson && lesson.title
        ? el('div','t', lesson.title) : el('div','t blank'));
      cell.onclick = () => { ui.courseId = c.id; ui.anchor = date; ui.view = 'day'; render(); };
      grid.appendChild(cell);
    });
  });
  stage.appendChild(grid);
}

function renderAllDay(stage){
  const date = ui.anchor;
  const wrap = el('div','dayview');
  const hol = holidayOn(date);
  if (hol){
    const card = el('div','card'), es = el('div','empty-state');
    es.appendChild(el('b','', hol.reason));
    es.appendChild(el('div','','No school'));
    card.appendChild(es); wrap.appendChild(card); stage.appendChild(wrap); return;
  }
  state.courses.forEach(c => {
    const card = el('div','card cls');
    card.style.setProperty('--c', c.color);
    const hd = el('div','hd');
    hd.appendChild(el('h2','', c.name));
    hd.appendChild(el('div','spacer'));
    const l = lessonOn(c, date);
    if (l && l.tag !== 'none'){
      const p = el('span','tagpill', TAGS[l.tag].label);
      p.style.setProperty('--t', TAGS[l.tag].color);
      hd.appendChild(p);
    }
    card.appendChild(hd);
    if (!l){
      card.appendChild(el('div','note',
        date < c.startDate ? 'Not started'
        : date > c.endDate ? 'Finished'
        : 'No Class'));
    } else {
      card.appendChild(el('div','title', l.title || ''));
      c.rows.forEach(r => {
        const html = l.cells[r.id];
        if (!html || !html.replace(/<[^>]*>/g,'').trim()) return;
        card.appendChild(el('div','lbl', r.label));
        const body = el('div','');
        body.innerHTML = html;
        body.style.fontSize = '13px';
        card.appendChild(body);
      });
      card.onclick = () => { ui.courseId = c.id; ui.view = 'day'; render(); };
      card.style.cursor = 'pointer';
    }
    wrap.appendChild(card);
  });
  stage.appendChild(wrap);
}
