/** At the cursor, or hung under an anchor element when there's one. */
function placeMenu(e, anchor, align){
  const m = $('menu');
  m.classList.add('on');
  const r = m.getBoundingClientRect();
  let x, y;
  if (anchor){
    const a = anchor.getBoundingClientRect();
    x = align === 'left' ? a.left : a.right - r.width;
    y = a.bottom + 6;
  } else {
    x = e.clientX ?? 0; y = e.clientY ?? 0;
  }
  if (x + r.width  > innerWidth  - 8) x = innerWidth  - r.width  - 8;
  if (y + r.height > innerHeight - 8) y = innerHeight - r.height - 8;
  m.style.left = Math.max(8, x) + 'px'; m.style.top = Math.max(8, y) + 'px';
}

/* ── Jump to a date ──────────────────────────────────────────────────────
   Clicking the date label opens a month. In week view a whole week lights up
   and clicking picks a WEEK, because that is what ui.anchor actually selects
   there. Choosing a date never changes ui.view — same rule as gotoHit. */

let pickerMonth = null;

function openDatePicker(){
  const m = $('menu'); m.innerHTML = '';
  m.classList.add('cal');
  pickerMonth = ui.anchor;
  paintDatePicker();
  placeMenu(null, $('period'), 'left');
}

function paintDatePicker(){
  const m = $('menu'); m.innerHTML = '';
  const d = parse(pickerMonth);
  const y = d.getFullYear(), mo = d.getMonth();

  const hd = el('div','calhd');
  const back = el('button','calnav','‹');
  back.title = 'Previous month';
  back.onclick = () => { pickerMonth = iso(new Date(y, mo - 1, 1)); paintDatePicker(); };
  const fwd = el('button','calnav','›');
  fwd.title = 'Next month';
  fwd.onclick = () => { pickerMonth = iso(new Date(y, mo + 1, 1)); paintDatePicker(); };
  hd.appendChild(back);
  hd.appendChild(el('b','', `${MON[mo]} ${y}`));
  hd.appendChild(fwd);
  m.appendChild(hd);

  const dows = visibleDows();
  const grid = el('div','calgrid');
  grid.style.gridTemplateColumns = `repeat(${dows.length},1fr)`;
  dows.forEach(w => grid.appendChild(el('em','', DOW3[w].slice(0,1))));

  const first = new Date(y, mo, 1), last = new Date(y, mo + 1, 0);
  const days = [];
  for (let dd = new Date(first); dd <= last; dd.setDate(dd.getDate() + 1)){
    const iso_ = iso(dd);
    if (dows.includes(dow(iso_))) days.push(iso_);
  }
  for (let i = 0; i < (days.length ? dows.indexOf(dow(days[0])) : 0); i++)
    grid.appendChild(el('span','pad'));

  const today = iso(new Date());
  const selWeek = ui.view === 'week' ? weekStart(ui.anchor) : null;
  days.forEach(date => {
    const cell = el('button','calday', String(parse(date).getDate()));
    const hol = holidayOn(date);
    if (hol){ cell.classList.add('hol'); cell.title = hol.reason || 'No school'; }
    if (date < state.yearStart || date > state.yearEnd) cell.classList.add('out');
    if (date === today) cell.classList.add('today');
    if (ui.view === 'week' ? weekStart(date) === selWeek : date === ui.anchor)
      cell.classList.add('sel');
    cell.dataset.d = date;
    cell.dataset.w = weekStart(date);
    cell.onclick = () => { closeMenu(); ui.anchor = date; daySel = null; render(); };
    grid.appendChild(cell);
  });

  /* Week view picks a week, so the whole week should light up as one. */
  if (ui.view === 'week'){
    grid.onmouseover = e => {
      const c = e.target.closest('.calday'); if (!c) return;
      const w = c.dataset.w;
      grid.querySelectorAll('.calday').forEach(x => x.classList.toggle('wkhov', x.dataset.w === w));
    };
    grid.onmouseleave = () => grid.querySelectorAll('.wkhov')
      .forEach(x => x.classList.remove('wkhov'));
  }
  m.appendChild(grid);

  const ft = el('div','calft');
  const t = el('button','callink','Today');
  t.onclick = () => { closeMenu(); ui.anchor = todayAnchor(); daySel = null; render(); };
  ft.appendChild(t);
  const lead = ui.view === 'month'
    ? termLong(termOn(pickerMonth, isAll() ? null : course()))
    : weekLabel(pickerMonth, isAll() ? null : course());
  if (lead) ft.appendChild(el('span','calwk', lead));
  m.appendChild(ft);
}

/** Short enough to read at a glance. Names only — the sub-labels explained
    things you learn once and then never read again. */
function openMoreMenu(e){

  menuItem(m, 'Help & shortcuts', () => openPanel('help'));
  m.appendChild(document.createElement('hr'));
  menuItem(m, 'Export to Excel…', () => openPanel('export'));
  menuItem(m, 'Export for AI…', () => openPanel('ai'));
  m.appendChild(document.createElement('hr'));

  menuItem(m, 'Open a backup…', () => $('filepick').click());

}
const closeMenu = () => $('menu').classList.remove('on','narrow','cal','preview');

function menuItem(m, label, fn, cls, sub){
  const b = el('button', cls || '');
  if (sub){
    const col = el('div','col');
    col.appendChild(el('span','', label));
    col.appendChild(el('small','', sub));
    b.appendChild(col);
  } else b.textContent = label;
  b.onclick = () => { closeMenu(); fn(); };
  m.appendChild(b);
  return b;
}

function openDayMenu(e, c, idx, date){
  const m = $('menu'); m.innerHTML = '';
  m.appendChild(el('div','sec', `${DOW3[dow(date)]} ${fmtShort(date)} · lesson ${idx+1}`));
  menuItem(m, 'Insert day before', () => insertDay(c, idx));
  menuItem(m, 'Insert day after',  () => insertDay(c, idx+1));
  m.appendChild(document.createElement('hr'));
  /* The same moves as dragging, without the gesture — always available. */
  if (idx > 0)
    menuItem(m, 'Swap with previous day', () => swapDays(c, idx-1, idx));
  if (idx < c.lessons.length - 1)
    menuItem(m, 'Swap with next day',     () => swapDays(c, idx, idx+1));
  m.appendChild(document.createElement('hr'));
  menuItem(m, 'Duplicate day', () => duplicateDay(c, idx));
  m.appendChild(document.createElement('hr'));
  menuItem(m, 'Clear day', () => clearDay(c, idx), '', 'Keeps the meeting, wipes the plan');
  menuItem(m, 'Remove day', () => removeDay(c, idx), 'danger', 'Everything after slides back');
  m.appendChild(document.createElement('hr'));
  ncMenuItem(m, c, date);
  if (daysClip && daysClip.days.length){
    const n = daysClip.days.length;
    m.appendChild(document.createElement('hr'));
    m.appendChild(el('div','sec', `${n} day${n===1?'':'s'} copied from ${daysClip.from}`));
    menuItem(m, `Insert ${n} day${n===1?'':'s'} here`, () => pasteDays(c, idx, 'insert'),
             '', 'Everything after shifts forward');
    menuItem(m, `Replace ${n} day${n===1?'':'s'} from here`, () => pasteDays(c, idx, 'replace'),
             '', 'Overwrites what\u2019s there; nothing moves');
  }
  if (state.courses.length > 1){
    m.appendChild(document.createElement('hr'));
    m.appendChild(el('div','sec','Copy this day to'));
    state.courses.filter(x => x.id !== c.id).forEach(other =>
      menuItem(m, other.name, () => copyDayTo(c, idx, other, date)));
  }
  placeMenu(e);
}

/** The status control: a dot plus a word, or a hollow dot when unset. */
function statusPill(c, idx, lesson, useLongLabel, date){
  const key = effectiveStatus(lesson, date);
  const st = key ? STATUS[key] : null;
  /* An inferred Unplanned is stated more quietly than one you chose. */
  const inferred = st && !(lesson && lesson.status);
  const b = el('button','statuspill ' + (st ? 'set' : 'unset') + (inferred ? ' soft' : ''));
  b.style.setProperty('--s', st ? st.color : 'transparent');
  b.appendChild(el('i',''));
  if (st) b.appendChild(document.createTextNode(useLongLabel ? st.label : st.short));
  b.title = st ? (inferred ? st.label + ' — nothing set yet' : 'Status: ' + st.label)
               : 'Set a status';
  b.onclick = e => { e.stopPropagation(); openStatusMenu(e, c, idx); };
  return b;
}

function openStatusMenu(e, c, idx){
  const m = $('menu'); m.innerHTML = '';
  m.appendChild(el('div','sec','Is this lesson ready?'));
  const pick = (k, label, color) => {
    const b = el('button','');
    const sw = el('span','sw' + (k ? '' : ' none'));
    sw.style.setProperty('--t', color || 'transparent');
    sw.style.borderRadius = '50%';
    b.appendChild(sw);
    b.appendChild(document.createTextNode(label));
    b.onclick = () => {
      closeMenu();
      commit(k ? `Marked ${STATUS[k].label}` : 'Status cleared',
             () => { ensureLesson(c, idx).status = k; });
    };
    m.appendChild(b);
  };
  Object.entries(STATUS).forEach(([k,s]) => pick(k, s.label, s.color));
  m.appendChild(document.createElement('hr'));
  pick(null, 'No status', null);
  placeMenu(e);
}

/** Same shape as every tag row, but striped rather than coloured. */
function ncMenuItem(m, c, date){
  const b = menuItem(m, 'Mark “No Class”', () => cancelMeeting(c, date), '',
                     `${c.name} skips this date`);
  b.insertBefore(el('span','sw nc'), b.firstChild);
  return b;
}

function openTagMenu(e, c, idx, date){
  const m = $('menu'); m.innerHTML = '';

  Object.entries(TAGS).forEach(([k,t]) => {
    const b = el('button','');
    const sw = el('span','sw' + (k === 'none' ? ' none' : ''));

let fmtTarget = null, fmtHideTimer;
function showFmt(cell){
  clearTimeout(fmtHideTimer);
  fmtTarget = cell;
  const f = $('fmt');
  f.classList.add('on');
  const r = cell.getBoundingClientRect();
  let top = r.top - 36;
  if (top < 8) top = r.bottom + 6;
  f.style.top = top + 'px';
  f.style.left = Math.min(r.left, innerWidth - 150) + 'px';
}
function hideFmt(){
  fmtHideTimer = setTimeout(() => { $('fmt').classList.remove('on'); fmtTarget = null; }, 140);
}
/** The <ul>/<ol> the caret is sitting in, if any. */
function listAtCaret(root){
  let n = getSelection().anchorNode;
  while (n && n !== root){
    if (n.nodeType === 1 && (n.tagName === 'UL' || n.tagName === 'OL')) return n;
    n = n.parentNode;
  }
  return null;
}

/* execCommand has no checklist, so one is made out of a normal bulleted list
   and then marked. Toggling back off just drops the marker, which keeps the
   text and the list intact. */
function cmdChecklist(){
  const list = listAtCaret(fmtTarget);
  if (list && list.tagName === 'UL'){
    list.classList.toggle('cl');
    if (!list.classList.contains('cl'))
      list.querySelectorAll('li').forEach(li => li.removeAttribute('data-c'));
    return;
  }
  if (list && list.tagName === 'OL') document.execCommand('insertOrderedList');  // unwrap first
  document.execCommand('insertUnorderedList');
  const made = listAtCaret(fmtTarget);
  if (made && made.tagName === 'UL') made.classList.add('cl');
}

$('fmt').addEventListener('mousedown', e => {
  e.preventDefault();                              // keep focus in the cell
  const cmd = e.target.closest('button')?.dataset.cmd;
  if (!cmd || !fmtTarget) return;
  if (cmd === 'checklist') cmdChecklist();
  else document.execCommand(cmd, false, null);
  fmtTarget.dispatchEvent(new Event('input'));
});

/* Ticking a box. The box is a ::before pseudo-element so it can't be clicked
   directly — instead catch clicks on the li that land left of the text, and
   leave everything further right to normal text editing. */
document.addEventListener('click', e => {
  const li = e.target.closest && e.target.closest('ul.cl > li');
  if (!li) return;
  const box = li.getBoundingClientRect();
  if (e.clientX > box.left + 21) return;           // clicked the text, not the box
  const cell = li.closest('.cell');
  if (!cell) return;
  e.preventDefault();
  li.setAttribute('data-c', li.getAttribute('data-c') === '1' ? '0' : '1');
  cell.dispatchEvent(new Event('input'));
});

/* Where we are in settings. [] is the root list; each extra segment goes one
   level deeper. Back is always "drop the last segment", so the trail can
   never disagree with what's on screen — which a free-form stack could. */
let panelPath = [];
const courseById = id => state.courses.find(c => c.id === id) || null;

/* Every pane the panel can show. The settings root is composed by hand in
   renderSettingsRoot rather than generated from this table — these entries
   exist so a path segment can be resolved to a title and a renderer.
   `summary()` is read only where a pane appears as a nav row (holidays,
   saving); `standalone:true` marks a verb reached from the ⋯ menu, which gets
   no Back arrow because it has no parent. */
const PANES = {
  classes: {
    title: sub => sub[0] ? ((courseById(sub[0]) || {}).name || 'Class') : 'Classes',
    render: renderClassesPane,
  },
  holidays: {
    title: 'Holidays',
    summary: () => state.holidays.length
      ? `${state.holidays.length} break${state.holidays.length === 1 ? '' : 's'}` : 'None',
    render: renderHolidaysPane,
  },
  saving: { title: 'Saving', summary: () => savingSummary(), render: renderStoragePane },
  help:   { title:'Help & shortcuts', standalone:true, render: renderHelp },
  export: { title:'Export to Excel',  standalone:true, render: renderExportPanel },
  ai:     { title:'Export for AI',    standalone:true, render: renderAiPanel },
  rollover: { title:'Start a new school year',
              summary: () => yearLabel(state.yearStart, state.yearEnd),
              render: renderRolloverPane },
};

const panelIsOpen = () => $('panel').classList.contains('on');

function openPanel(path){
  panelPath = path == null ? [] : Array.isArray(path) ? path.slice() : [path];
  $('scrim').classList.add('on');
  $('panel').classList.add('on');
  paintPanel();
}
function panelGoto(...seg){ panelPath = seg; paintPanel(); }
function panelBack(){ panelPath.pop(); paintPanel(); }

function paneTitle(){
  if (!panelPath.length) return 'Settings';
  const pane = PANES[panelPath[0]];
  if (!pane) return 'Settings';
  return typeof pane.title === 'function' ? pane.title(panelPath.slice(1)) : pane.title;
}

function panelHeader(){
  const hd = el('div','panelhd');
  const pane = PANES[panelPath[0]];
  const standalone = pane && pane.standalone && panelPath.length === 1;
  if (panelPath.length && !standalone){
    const b = el('button','backbtn');
    b.appendChild(el('span','chev','‹'));
    /* Going back drops the last segment, so the label is this pane's title
       evaluated one level shallower — not the raw title, which may be a fn. */
    const parent = panelPath.length > 1
      ? (typeof pane.title === 'function' ? pane.title(panelPath.slice(1, -1)) : pane.title)
      : 'Settings';
    b.appendChild(el('span','', parent));
    b.onclick = panelBack;
    hd.appendChild(b);
  }
  hd.appendChild(el('h3','', paneTitle()));
  const close = el('button','iconbtn','Close');
  close.style.marginLeft = 'auto';
  close.onclick = closePanel;
  hd.appendChild(close);
  return hd;
}

/** Header and body. For when the destination changes. */
function paintPanel(){
  const p = $('panel'); p.innerHTML = '';
  p.appendChild(panelHeader());
  const body = el('div','panebody');
  p.appendChild(body);
  paintPaneBody(body);
}

/** Body only, so the header, the scroll position and the focused control all
    survive. This is what a mutation calls. */
function repaintPane(){
  if (!panelIsOpen()) return;
  const body = $('panel').querySelector('.panebody');
  if (!body) return;
  /* Swapping the DOM out from under a drag kills it silently — the same
     reason render() bails mid-gesture. Re-arm rather than drop it: dragend
     lands after this frame on macOS, so the very repaint that matters most
     (the drop's own) is the one that would otherwise be thrown away. */
  if (body.querySelector('.rowedit.dragging')) return retryPaneRepaint();
  paneRetries = 0;
  const keep = captureFocus(body), top = body.scrollTop;
  body.innerHTML = '';
  paintPaneBody(body);
  body.scrollTop = top;
  restoreFocus(body, keep);
  /* The body is rebuilt but the header isn't, so a rename made inside a pane
     would leave its own title stale. Update the text in place rather than
     rebuilding — the header holds Back and Close, and churning them is churn
     for nothing. */
  refreshPanelTitle();
}

function refreshPanelTitle(){
  const hd = $('panel').querySelector('.panelhd');
  if (!hd) return;
  const h = hd.querySelector('h3');
  if (h) h.textContent = paneTitle();
  const back = hd.querySelector('.backbtn span:not(.chev)');
  if (back && panelPath.length > 1){
    const pane = PANES[panelPath[0]];
    back.textContent = typeof pane.title === 'function'
      ? pane.title(panelPath.slice(1, -1)) : pane.title;
  }
}

function paintPaneBody(body){
  if (!panelPath.length) return renderSettingsRoot(body);
  const pane = PANES[panelPath[0]];
  if (!pane){ panelPath = []; return renderSettingsRoot(body); }
  /* Undo can replace state wholesale and orphan a course id in the path. */
  if (panelPath[0] === 'classes' && panelPath[1] && !courseById(panelPath[1]))
    panelPath = ['classes'];
  pane.render(body, panelPath.slice(1));
}

/* Coalesced and deferred by a frame. The defer is load-bearing: an input's
   onchange fires during blur, and tearing the input out of the DOM inside
   its own event is how edits get lost. */
let paneDirty = false;
function schedulePaneRepaint(){
  if (paneDirty || !panelIsOpen()) return;
  paneDirty = true;
  requestAnimationFrame(() => { paneDirty = false; repaintPane(); });
}

/* A repaint that had to stand aside for a drag must come back, not evaporate.
   Losing it is how a reorder ends up committed to state and invisible on
   screen — the mutation is real, the DOM just never hears about it. */
let paneRetries = 0;
function retryPaneRepaint(){
  /* A drag that never fired dragend leaves .dragging behind for good. Waiting
     forever means the pane silently stops updating, so give up and paint. */
  if (++paneRetries > 12){
    paneRetries = 0;
    document.querySelectorAll('.rowedit.dragging').forEach(n => n.classList.remove('dragging'));
  }
  setTimeout(() => { paneDirty = false; schedulePaneRepaint(); }, 60);
}

/* ── keeping focus across a repaint ──────────────────────────────────────
   Opt-in: a control has to carry data-k, keyed by identity rather than
   position so it survives a reorder. */
function captureFocus(root){
  const a = document.activeElement;
  if (!a || !root.contains(a)) return null;
  const k = a.getAttribute && a.getAttribute('data-k');
  if (!k) return null;
  const o = { k };
  if (a.isContentEditable){ o.ce = true; o.at = caretOffset(a); }
  /* selectionStart throws on <input type=date> in Chrome, and this panel is
     mostly date inputs. */
  else try { o.s = a.selectionStart; o.e = a.selectionEnd; } catch(err){}
  return o;
}
function restoreFocus(root, o){
  if (!o) return;
  const n = root.querySelector('[data-k="' + CSS.escape(o.k) + '"]');
  if (!n) return;
  n.focus({ preventScroll:true });
  if (o.ce) return setCaret(n, o.at);
  if (o.s != null && n.setSelectionRange)
    try { n.setSelectionRange(o.s, o.e); } catch(err){}
}
function caretOffset(node){
  const s = getSelection();
  if (!s.rangeCount) return 0;
  const r = s.getRangeAt(0).cloneRange();
  r.selectNodeContents(node);
  r.setEnd(s.getRangeAt(0).endContainer, s.getRangeAt(0).endOffset);
  return r.toString().length;
}
function setCaret(node, at){
  const t = node.firstChild, r = document.createRange();
  if (t && t.nodeType === 3) r.setStart(t, Math.min(at, t.length));
  else { r.selectNodeContents(node); r.collapse(false); }
  r.collapse(true);
  const s = getSelection(); s.removeAllRanges(); s.addRange(r);
}

/* Half-typed entries live here rather than in the DOM, so a repaint fired by

/** Move a row, and clear the drag marker first so the repaint that follows
    isn't waved away by its own guard. */
function dropRow(c, from, to){
  document.querySelectorAll('.rowedit.dragging').forEach(n => n.classList.remove('dragging'));
  if (Number.isNaN(from) || from === to) return;
  commit('Rows reordered', () => {
    const [m] = c.rows.splice(from, 1);
    c.rows.splice(to, 0, m);
  });
}

function renderClassEditor(p, c){
  /* No "Editing X" heading — the panel header carries the name. */

  /* Name */
  const ng = el('div','grp');
  ng.appendChild(el('label','','Name'));
  const name = document.createElement('input');
  name.type = 'text'; name.value = c.name;
  name.onchange = () => commit('Class renamed', () => { c.name = name.value.trim() || c.name; });
  ng.appendChild(name);
  p.appendChild(ng);

  /* Color */
  const cg = el('div','grp');
  cg.appendChild(el('label','','Colour'));
  const sw = el('div','swatches');
  PALETTE.forEach(col => {
    const b = el('button','swatch' + (col === c.color ? ' on' : ''));
    b.style.setProperty('--c', col);
    b.onclick = () => { commit('Colour changed', () => { c.color = col; }); };
    sw.appendChild(b);
  });
  cg.appendChild(sw);
  p.appendChild(cg);

  /* Meeting days */
  const dg = el('div','grp');
  dg.appendChild(el('label','','Meets on'));
  const drow = el('div','dayrow');
  WEEK_ORDER.forEach(w => {
    const chip = el('div','daychip' + (c.weekdays.includes(w) ? ' on' : '')
                                    + (w === 0 || w === 6 ? ' wknd' : ''));
    chip.textContent = DOW3[w];
    chip.style.setProperty('--c', c.color);
    chip.onclick = () => {
      commit(`${c.name} meeting days changed`, () => {
        c.weekdays = c.weekdays.includes(w)
          ? c.weekdays.filter(x => x !== w)
          : [...c.weekdays, w].sort((a,b) => a-b);
      });
    };
    drow.appendChild(chip);
  });
  dg.appendChild(drow);
  dg.appendChild(el('div','note','Same every week. For a one-off, mark that day “No Class”.'));
  p.appendChild(dg);

  /* Date range */
  const rg = el('div','grp');
  rg.appendChild(el('label','','Runs from'));
  [['startDate','First day'],['endDate','Last day']].forEach(([k,lab]) => {
    const row = el('div','addrow');
    const l = el('span','note', lab);
    l.style.minWidth = '64px'; l.style.alignSelf = 'center';
    const inp = document.createElement('input');
    inp.type = 'date'; inp.value = c[k];
    inp.onchange = () => commit(`${c.name} dates changed`, () => { c[k] = inp.value; });
    row.appendChild(l); row.appendChild(inp);
    rg.appendChild(row);
  });
  const over = overflowCount(c);
  if (over > 0) rg.appendChild(el('div','note',
    `${over} lesson${over>1?'s':''} sit past the last day — kept, not deleted. Extend the end date or remove days to bring them back.`));
  p.appendChild(rg);

  /* Terms — only if this class runs on a different rhythm to the school. */
  const tg = el('div','grp');
  tg.appendChild(el('label','','Terms'));
  termEditor(tg,
    () => c.terms,
    v => { commit(`${c.name} terms changed`, () => { c.terms = v; }); },
    state.terms);
  p.appendChild(tg);

  /* Homework tracking */
  const hg2 = el('div','grp');
  hg2.appendChild(el('label','','Homework tracking'));
  const hrow = el('div','dayrow');
  [[true,'On'],[false,'Off']].forEach(([v,lab]) => {
    const chip = el('div','daychip' + (hwOn(c) === v ? ' on' : ''), lab);
    chip.style.setProperty('--c','var(--accent)');
    chip.onclick = () => commit(v ? 'Homework tracking on' : 'Homework tracking off', () => {
      c.homework = v;
      /* Turning it on restores whichever row is missing, at its proper end.
         Turning it off leaves every row and every word alone. */
      if (v){
        if (!findRow(c,'due'))      c.rows.unshift({ id:uid(), label:'Homework Due' });
        if (!findRow(c,'assigned')) c.rows.push({ id:uid(), label:'Homework Assigned' });
      }
    });
    hrow.appendChild(chip);
  });
  hg2.appendChild(hrow);
  hg2.appendChild(el('div','note', hwOn(c)
    ? 'Each line in Homework Assigned carries a due date, and shows up in Homework Due on the day it lands.'
    : 'Homework Due and Homework Assigned behave as ordinary rows. Turning this on restores either if it is missing.'));
  p.appendChild(hg2);

  /* Rows */
  const rowsG = el('div','grp');
  rowsG.appendChild(el('label','','Rows'));
  c.rows.forEach((r, ri) => {
    const item = el('div','rowedit');
    item.draggable = true;
    item.appendChild(el('span','grip','⋮⋮'));
    const txt = el('span','txt', r.label);
    txt.contentEditable = 'true';
    txt.onblur = () => {
      const v = txt.textContent.trim();
      if (v && v !== r.label) commit('Row renamed', () => { r.label = v; });
      else txt.textContent = r.label;
    };
    txt.onkeydown = e => { if (e.key === 'Enter'){ e.preventDefault(); txt.blur(); } };
    item.appendChild(txt);
    const role = rowRole(r);
    if (role && hwOn(c)){
      const b = el('span','rolebadge', role === 'due' ? 'receives' : 'assigns');
      b.title = role === 'due'
        ? 'Homework assigned elsewhere appears here on the day it is due'
        : 'Each line here carries a due date';
      item.appendChild(b);
    }
    const x = el('button','x','×');
    x.onclick = () => {
      if (role && hwOn(c) &&
          !confirm(`Delete "${r.label}"?\n\nHomework linking stops working for this class. ` +
                   `The dates already set are kept, and re-adding the row brings it back.`)) return;
      commit('Row deleted', () => c.rows.splice(ri,1));
    };
    item.appendChild(x);

    item.ondragstart = e => {
      if (txt.isContentEditable && document.activeElement === txt) return e.preventDefault();
      e.dataTransfer.setData('text/erow', String(ri));
      e.dataTransfer.effectAllowed = 'move';   /* without this macOS shows a copy badge */
      item.classList.add('dragging');
    };
    item.ondragend   = () => item.classList.remove('dragging');
    item.ondragover  = e => {
      if (!e.dataTransfer.types.includes('text/erow')) return;
      e.preventDefault(); item.classList.add('over');
    };
    item.ondragleave = () => item.classList.remove('over');
    item.ondrop = e => {
      e.preventDefault(); item.classList.remove('over');
      dropRow(c, Number(e.dataTransfer.getData('text/erow')), ri);
    };
    rowsG.appendChild(item);
  });
  const addRow = el('div','addrow');
  const rin = document.createElement('input');
  rin.type = 'text'; rin.placeholder = 'New row name';
  rin.dataset.k = 'row-new';
  rin.value = rowDraft;
  rin.oninput = () => { rowDraft = rin.value; };
  const rbtn = el('button','','Add');
  const doAdd = () => {
    const v = rin.value.trim(); if (!v) return;
    rowDraft = '';
    commit('Row added', () => c.rows.push({ id:uid(), label:v }));
  };
  rbtn.onclick = doAdd;
  rin.onkeydown = e => { if (e.key === 'Enter') doAdd(); };
  addRow.appendChild(rin); addRow.appendChild(rbtn);
  /* .grp has an 8px gap, so without this the strips between rows swallow a
     drop and nothing happens. */
  rowsG.ondragover = e => {
    if (e.dataTransfer.types.includes('text/erow')) e.preventDefault();
  };
  rowsG.ondrop = e => {
    if (!e.dataTransfer.types.includes('text/erow')) return;
    e.preventDefault();
    const from = Number(e.dataTransfer.getData('text/erow'));
    dropRow(c, from, c.rows.length - 1);
  };
  rowsG.appendChild(addRow);
  p.appendChild(rowsG);

  /* No-Class days */
  if (c.cancelled.length){
    const ncg = el('div','grp');
    ncg.appendChild(el('label','','No Class days'));
    c.cancelled.slice().sort((a,b) => a.date < b.date ? -1 : 1).forEach(x => {
      const item = el('div','holitem');
      item.appendChild(el('span','d', fmtMed(x.date)));
      item.appendChild(el('span','r', x.reason || 'No Class'));
      const b = el('button','x','×');
      b.title = 'Restore';
      b.onclick = () => { restoreMeeting(c, x.date); };
      item.appendChild(b);
      ncg.appendChild(item);
    });
    p.appendChild(ncg);
  }

  /* Delete */
  const del = el('div','grp');
  const db = el('button','iconbtn','Delete ' + c.name);
  db.onclick = () => {
    if (!confirm(`Delete ${c.name} and all of its lessons? This can be undone with Cmd+Z.`)) return;
    commit(`${c.name} deleted`, () => {
      /* Drop the lessons too — otherwise they sit in state.lessons forever,
         unreachable and growing the file. Undo restores them with the snapshot. */
      c.lessons.forEach(id => delete state.lessons[id]);
      state.courses = state.courses.filter(x => x.id !== c.id);
      if (ui.courseId === c.id) ui.courseId = state.courses[0] ? state.courses[0].id : ALL;
    });
    panelPath = ['classes'];
    paintPanel();
  };
  del.appendChild(db);
  p.appendChild(del);
}

/** Term picker, shared by the school default and a class's override.
    `get` returns the current config or null; `set` persists a new one. */
function termEditor(box, get, set, inherited){
  const t = get(), canInherit = !!inherited;
  const chips = el('div','dayrow');
  const modes = canInherit ? [['inherit','Same as school']] : [];
  Object.entries(TERM_MODES).forEach(([k,m]) => modes.push([k, m.label]));

  modes.forEach(([k,label]) => {
    const on = k === 'inherit' ? !t : (!!t && t.mode === k);

/* ═══════════════════════════════════════════════════════════════════
   A NEW SCHOOL YEAR
   ───────────────────────────────────────────────────────────────────
   Cheap, because lessons hold no dates: the ordered list is the asset and
   it is entirely year-agnostic. Rebuild the dates, keep the plans.

   The outgoing year is kept in the same file, read-only, so search can
   still reach it — that is what makes last year's units reusable rather
   than merely archived.
   ═══════════════════════════════════════════════════════════════════ */

const ARCHIVE_CAP = 3;

function yearLabel(a, b){
  const y1 = parse(a).getFullYear(), y2 = parse(b).getFullYear();
  return y1 === y2 ? String(y1) : `${y1}\u2013${String(y2).slice(2)}`;
}

const archives = () => state.archives || (state.archives = []);

function rolloverYear(newStart, newEnd, keepIds){
  const dropped = [];
  const label = yearLabel(newStart, newEnd);
  /* `full`: this is the one operation that changes the archive, so its undo
     entry has to carry the archive too or undoing would leave the year
     reverted and the copy of it still sitting there. */
  commit(`New school year \u00b7 ${label}`, () => {
    archives().unshift({
      id: uid(), label: yearLabel(state.yearStart, state.yearEnd),
      yearStart: state.yearStart, yearEnd: state.yearEnd,
      terms: clone(state.terms), holidays: clone(state.holidays),
      courses: clone(state.courses), lessons: clone(state.lessons),
    });
    while (state.archives.length > ARCHIVE_CAP) dropped.push(state.archives.pop().label);

    /* Classes left behind take their lessons with them — otherwise the flat
       map keeps growing with plans nothing points at. The archived copy still
       has them. */
    const keep = new Set(keepIds);
    state.courses.forEach(c => {
      if (!keep.has(c.id)) c.lessons.forEach(id => { delete state.lessons[id]; });
    });
    state.courses = state.courses.filter(c => keep.has(c.id));

    state.yearStart = newStart;
    state.yearEnd = newEnd;
    state.terms = {
      mode: (state.terms && state.terms.mode) || 'semester',
      starts: spreadTerms(newStart, newEnd,
                          (state.terms && state.terms.starts.length) || 2),
    };
    /* Next year's breaks are genuinely different dates — carrying them would
       silently shift every class onto days off that no longer exist. */
    state.holidays = [];

    state.courses.forEach(c => {
      c.startDate = newStart; c.endDate = newEnd;
      /* Both are pinned to last year's dates: harmless arithmetically, but
         they'd pile up in the class editor as a heap of stale entries. */
      c.cancelled = []; c.weekRows = [];
      if (c.terms) c.terms = { mode:c.terms.mode,
        starts: spreadTerms(newStart, newEnd, c.terms.starts.length) };
      c.lessons.forEach(id => {
        const l = state.lessons[id]; if (!l) return;
        l.status = null;
        Object.keys(l.cells).forEach(k => { l.cells[k] = scrubForReuse(l.cells[k]); });
      });
    });
    ui.courseId = state.courses[0] ? state.courses[0].id : ALL;
    /* A year can open on a Saturday. Roll forward to a day that's actually
       displayed, the same way todayAnchor does. */
    let a = newStart;
    for (let i = 0; i < 7 && !isVisibleDay(a); i++) a = addDays(a, 1);
    ui.anchor = a;
  }, true);
  if (dropped.length)
    toast(`${dropped.join(', ')} dropped \u2014 ${ARCHIVE_CAP} years are kept`);
}

function renderHolidaysPane(box){
  const hg = el('div','grp');
  hg.appendChild(el('label','','Holidays'));

  /* How many teaching days a break actually eats — the number that matters,
     since a break spanning two weekends costs far fewer days than it looks. */
  const spanDays = h => dayDiff(h.endDate || h.date, h.date) + 1;
  const teachingDaysIn = h => {
    let n = 0;
    for (let d = h.date; d <= (h.endDate || h.date); d = addDays(d,1))
      if (visibleDows().includes(dow(d))) n++;
    return n;
  };

  state.holidays.slice().sort((a,b) => a.date < b.date ? -1 : 1).forEach(h => {
    const item = el('div','holitem');
    item.appendChild(el('span','d', fmtMed(h.date) + (h.endDate ? ' – ' + fmtMed(h.endDate) : '')));
    item.appendChild(el('span','r', h.reason));
    if (h.endDate && h.endDate !== h.date){
      const n = teachingDaysIn(h);
      const meta = el('span','meta', `${n} day${n === 1 ? '' : 's'}`);
      meta.title = `${spanDays(h)} calendar days · ${n} of them teaching days`;
      item.appendChild(meta);
    }
    const x = el('button','x','×');
    x.title = 'Remove';
    x.onclick = () => {
      commit('Holiday removed · all classes shifted back', () => {
        state.holidays = state.holidays.filter(q => q.id !== h.id);
      });
    };
    item.appendChild(x);
    hg.appendChild(item);
  });

  /* From / To, because a break is usually a range — entering Christmas one
     day at a time was the tedious path this replaces. */
  const drow = el('div','addrow');
  const hd = document.createElement('input'); hd.type = 'date'; hd.title = 'First day';
  const he = document.createElement('input'); he.type = 'date'; he.title = 'Last day (optional)';
  hd.dataset.k = 'hol-from'; he.dataset.k = 'hol-to';
  hd.value = holidayDraft.date; he.value = holidayDraft.endDate;
  hd.oninput = () => { holidayDraft.date = hd.value; };
  he.oninput = () => { holidayDraft.endDate = he.value; };
  const dash = el('span','note','–');
  dash.style.alignSelf = 'center';
  drow.appendChild(hd); drow.appendChild(dash); drow.appendChild(he);
  hg.appendChild(drow);

  const arow = el('div','addrow');
  const hr = document.createElement('input'); hr.type = 'text'; hr.placeholder = 'Reason';
  hr.dataset.k = 'hol-reason';
  hr.value = holidayDraft.reason;
  hr.oninput = () => { holidayDraft.reason = hr.value; };
  const hb = el('button','','Add');
  const add = () => {
    if (!hd.value) return toast('Pick a first day');
    if (he.value && he.value < hd.value) return toast('That range runs backwards');
    const one = !he.value || he.value === hd.value;
    const h = { id:uid(), date:hd.value, reason:hr.value.trim() || 'No school' };
    if (!one) h.endDate = he.value;
    const n = teachingDaysIn(h);
    commit(one ? 'Holiday added · all classes shifted'
               : `${h.reason} added · ${n} day${n===1?'':'s'} off, all classes shifted`,
           () => { state.holidays.push(h); });
    holidayDraft = { date:'', endDate:'', reason:'' };
  };
  hb.onclick = add;
  hr.onkeydown = e => { if (e.key === 'Enter') add(); };
  arow.appendChild(hr); arow.appendChild(hb);
  hg.appendChild(arow);
  hg.appendChild(el('div','note',
    'Leave the second date empty for a single day. A break covers everything between the two, ' +
    'applies to every class at once, and undoes as one action.'));
  box.appendChild(hg);

/* ═══════════════════════════════════════════════════════════════════
   XLSX WRITER
   ───────────────────────────────────────────────────────────────────
   An .xlsx is a ZIP of XML parts. Storing the parts uncompressed
   (method 0) is legal and Excel accepts it, which means no deflate
   implementation and no vendored library — worth a few hundred KB of
   uncompressed XML to keep this one file dependency-free.
   ═══════════════════════════════════════════════════════════════════ */

const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let i = 0; i < 256; i++){
    let c = i;
    for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[i] = c >>> 0;
  }
  return t;
})();

function crc32(bytes){
  let c = 0xFFFFFFFF;
  for (let i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}

/** files: [{name, text}] → a Blob holding a store-only ZIP archive. */
function zipStore(files, mime){
  const enc = new TextEncoder();
  const now = new Date();
  const time = (now.getHours() << 11) | (now.getMinutes() << 5) | (now.getSeconds() >> 1);
  const date = ((now.getFullYear() - 1980) << 9) | ((now.getMonth() + 1) << 5) | now.getDate();

  const body = [], dir = [];
  let offset = 0;

  files.forEach(f => {
    const name = enc.encode(f.name), data = enc.encode(f.text), crc = crc32(data);

    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true);
    lh.setUint16(4, 20, true);
    lh.setUint16(6, 0x0800, true);          // UTF-8 names
    lh.setUint16(8, 0, true);               // stored
    lh.setUint16(10, time, true);
    lh.setUint16(12, date, true);
    lh.setUint32(14, crc, true);
    lh.setUint32(18, data.length, true);
    lh.setUint32(22, data.length, true);
    lh.setUint16(26, name.length, true);
    body.push(new Uint8Array(lh.buffer), name, data);

    const cd = new DataView(new ArrayBuffer(46));
    cd.setUint32(0, 0x02014b50, true);
    cd.setUint16(4, 20, true);
    cd.setUint16(6, 20, true);
    cd.setUint16(8, 0x0800, true);
    cd.setUint16(10, 0, true);
    cd.setUint16(12, time, true);
    cd.setUint16(14, date, true);
    cd.setUint32(16, crc, true);
    cd.setUint32(20, data.length, true);
    cd.setUint32(24, data.length, true);
    cd.setUint16(28, name.length, true);
    cd.setUint32(42, offset, true);
    dir.push(new Uint8Array(cd.buffer), name);

    offset += 30 + name.length + data.length;
  });

  const dirSize = dir.reduce((n,a) => n + a.length, 0);
  const eocd = new DataView(new ArrayBuffer(22));
  eocd.setUint32(0, 0x06054b50, true);
  eocd.setUint16(8, files.length, true);
  eocd.setUint16(10, files.length, true);
  eocd.setUint32(12, dirSize, true);
  eocd.setUint32(16, offset, true);

  return new Blob([...body, ...dir, new Uint8Array(eocd.buffer)], { type: mime });
}

/* ── XML + cell helpers ─────────────────────────────────────────── */

/* Control characters are illegal in XML and make Excel reject the whole
   file, so they're dropped — tab and newline survive. */
const xmlEsc = s => String(s)
  .replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g,'')
  .replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[ch]));

function colName(n){                        // 1 → A, 27 → AA
  let s = '';
  while (n > 0){ const r = (n - 1) % 26; s = String.fromCharCode(65 + r) + s; n = (n - 1 - r) / 26; }
  return s;
}

/** A cell's rich HTML as plain text, keeping list structure — a naive tag
    strip runs every bullet together into one line. */
function htmlToText(html){
  if (!html) return '';
  const box = document.createElement('div');
  box.innerHTML = html;
  const out = [];
  const walk = node => {
    node.childNodes.forEach(n => {
      if (n.nodeType === 3) return out.push(n.nodeValue);
      if (n.nodeType !== 1) return;
      const tag = n.tagName;
      if (tag === 'BR') return out.push('\n');
      if (tag === 'UL' || tag === 'OL'){
        /* A checklist keeps its ticks in plain text, so a printed or
           spreadsheet copy still shows what's been gathered. */
        const check = tag === 'UL' && n.classList.contains('cl');
        let i = 1;
        n.childNodes.forEach(li => {
          if (li.nodeType !== 1 || li.tagName !== 'LI') return;
          out.push('\n' + (check ? (li.getAttribute('data-c') === '1' ? '[x] ' : '[ ] ')
                                 : tag === 'OL' ? (i++) + '. ' : '• '));
          walk(li);
        });
        return out.push('\n');
      }
      if (tag === 'P' || tag === 'DIV'){ out.push('\n'); walk(n); return out.push('\n'); }
      walk(n);
    });
  };
  walk(box);
  return out.join('')
    .replace(/[ \t]+/g,' ').replace(/ *\n */g,'\n')
    .replace(/\n{3,}/g,'\n\n').trim();
}

/* ── the workbook ───────────────────────────────────────────────── */

const TAG_KEYS = Object.keys(TAGS).filter(k => k !== 'none');
const XF = { plain:0, title:1, dayhead:2, rowlabel:3, body:4, concept:5 };
const xfForTag = k => 6 + TAG_KEYS.indexOf(k);      // tag row, white on colour
const XF_OFF = 6 + TAG_KEYS.length;                 // a day the class doesn't meet

function stylesXml(){
  const fills = ['<fill><patternFill patternType="none"/></fill>',
                 '<fill><patternFill patternType="gray125"/></fill>',
                 '<fill><patternFill patternType="solid"><fgColor rgb="FFF2F2F2"/>' +
                   '<bgColor indexed="64"/></patternFill></fill>']
    .concat(TAG_KEYS.map(k =>
      `<fill><patternFill patternType="solid"><fgColor rgb="FF${TAGS[k].color.slice(1).toUpperCase()}"/>` +
      `<bgColor indexed="64"/></patternFill></fill>`));

  const box = '<border><left style="thin"><color rgb="FFD9D9D9"/></left>' +
              '<right style="thin"><color rgb="FFD9D9D9"/></right>' +
              '<top style="thin"><color rgb="FFD9D9D9"/></top>' +
              '<bottom style="thin"><color rgb="FFD9D9D9"/></bottom></border>';

  const xfs = [
    '<xf xfId="0" fontId="0" fillId="0" borderId="0"/>',
    '<xf xfId="0" fontId="2" fillId="0" borderId="0" applyFont="1"/>',
    '<xf xfId="0" fontId="1" fillId="2" borderId="1" applyFont="1" applyFill="1" applyBorder="1"' +
      ' applyAlignment="1"><alignment horizontal="center" vertical="center"/></xf>',
    '<xf xfId="0" fontId="1" fillId="2" borderId="1" applyFont="1" applyFill="1" applyBorder="1"' +
      ' applyAlignment="1"><alignment horizontal="left" vertical="top" wrapText="1"/></xf>',
    '<xf xfId="0" fontId="0" fillId="0" borderId="1" applyBorder="1" applyAlignment="1">' +
      '<alignment horizontal="left" vertical="top" wrapText="1"/></xf>',
    '<xf xfId="0" fontId="1" fillId="0" borderId="1" applyFont="1" applyBorder="1" applyAlignment="1">' +
      '<alignment horizontal="left" vertical="top" wrapText="1"/></xf>',
  ].concat(TAG_KEYS.map((k,i) =>
    `<xf xfId="0" fontId="3" fillId="${3+i}" borderId="1" applyFont="1" applyFill="1"` +
    ' applyBorder="1" applyAlignment="1"><alignment horizontal="center" vertical="center"/></xf>'))
   .concat([
    '<xf xfId="0" fontId="4" fillId="2" borderId="1" applyFont="1" applyFill="1"' +
      ' applyBorder="1" applyAlignment="1">' +
      '<alignment horizontal="center" vertical="center" wrapText="1"/></xf>',
   ]);

  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">
<fonts count="5">
<font><sz val="11"/><name val="Calibri"/></font>
<font><b/><sz val="11"/><name val="Calibri"/></font>
<font><b/><sz val="14"/><name val="Calibri"/></font>
<font><b/><sz val="11"/><color rgb="FFFFFFFF"/><name val="Calibri"/></font>
<font><i/><sz val="10"/><color rgb="FF8C8C8C"/><name val="Calibri"/></font>
</fonts>
<fills count="${fills.length}">${fills.join('')}</fills>
<borders count="2"><border><left/><right/><top/><bottom/><diagonal/></border>${box}</borders>
<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>
<cellXfs count="${xfs.length}">${xfs.join('')}</cellXfs>
</styleSheet>`;
}

const cellXml = (ref, style, text) =>
  text === '' || text === undefined || text === null
    ? `<c r="${ref}" s="${style}"/>`
    : `<c r="${ref}" s="${style}" t="inlineStr"><is><t xml:space="preserve">${xmlEsc(text)}</t></is></c>`;

/**
 * The columns a sheet gets. By default only the days the class actually
 * meets — a plan shows what you teach. With `includeOff` every weekday in
 * the range appears, so a principal can see why a gap is there.
 */
function exportDays(c, from, to, includeOff){
  const idxByDate = meetingIndexByDate(c);
  const out = [];
  for (let d = from; d <= to; d = addDays(d, 1)){
    if (!isVisibleDay(d)) continue;
    const idx = idxByDate.get(d);
    if (idx !== undefined){ out.push({ date:d, idx }); continue; }
    if (!includeOff) continue;
    const hol = holidayOn(d);
    out.push({ date:d, idx:null,
      note: hol ? hol.reason
          : (d < c.startDate || d > c.endDate) ? 'Not running'
          : 'No Class' });
  }
  return out;
}

/** One sheet per class: days across, that class's own rows down the side. */
function sheetXml(c, days){
  const lessons = days.map(d => d.idx === null ? null : state.lessons[c.lessons[d.idx]] || null);
  const tagged  = lessons.some(l => l && l.tag && l.tag !== 'none');
  const width   = days.length + 1;
  const rows    = [];
  let r = 1;

  const push = (cells, height) => {
    rows.push(`<row r="${r}"${height ? ` ht="${height}" customHeight="1"` : ''}>${cells.join('')}</row>`);
    r++;
  };
  const ref = i => `${colName(i+2)}${r}`;

  push([cellXml('A1', XF.title, `${c.name.toUpperCase()} · ` +
    (days.length ? fmtRange(days[0].date, days[days.length-1].date) : 'no meetings'))], 22);

  push([cellXml(`A${r}`, XF.dayhead, '')].concat(
    days.map((d,i) => cellXml(ref(i), XF.dayhead, `${DOW3[dow(d.date)]} ${fmtShort(d.date)}`))), 20);

  push([cellXml(`A${r}`, XF.rowlabel, 'Concept')].concat(
    days.map((d,i) => d.idx === null
      ? cellXml(ref(i), XF_OFF, d.note)
      : cellXml(ref(i), XF.concept, (lessons[i] && lessons[i].title) || ''))), 20);

  if (lessons.some(l => l && l.status && STATUS[l.status]))
    push([cellXml(`A${r}`, XF.rowlabel, 'Status')].concat(
      days.map((d,i) => {
        if (d.idx === null) return cellXml(ref(i), XF_OFF, '');
        const st = lessons[i] && lessons[i].status;
        return cellXml(ref(i), XF.body, st && STATUS[st] ? STATUS[st].label : '');
      })), 18);

  if (tagged)
    push([cellXml(`A${r}`, XF.rowlabel, 'Tag')].concat(
      days.map((d,i) => {
        if (d.idx === null) return cellXml(ref(i), XF_OFF, '');
        const t = lessons[i] && lessons[i].tag;
        return t && t !== 'none'
          ? cellXml(ref(i), xfForTag(t), TAGS[t].label.toUpperCase())
          : cellXml(ref(i), XF.body, '');
      })), 18);

  const hwDates = hwOn(c) ? meetingDates(c) : null;
  const dueRow = hwDates && findRow(c,'due');
  const dueIdx = hwDates ? buildDueIndex(c, hwDates) : new Map();
  const exportRows = c.rows.concat(
    (c.weekRows || []).filter(r => days.some(d => d.date >= r.from && d.date <= r.to)));
  exportRows.forEach(row => {
    const texts = lessons.map((l,i) => {
      const own = l ? htmlToText(l.cells[row.id]) : '';
      if (!dueRow || row.id !== dueRow.id) return own;
      /* What arrives from other days is derived, so the export has to ask for
         it rather than read it out of the cell. */
      const inbound = (dueIdx.get(days[i].date) || []).map(a => a.text);
      return inbound.concat(own ? [own] : []).join('\n');
    });
    const lines = texts.reduce((n,t) => Math.max(n, t ? t.split('\n').length : 1), 1);
    push([cellXml(`A${r}`, XF.rowlabel, row.label)].concat(
      days.map((d,i) => cellXml(ref(i), d.idx === null ? XF_OFF : XF.body, texts[i]))),
      Math.max(20, Math.min(150, lines * 14 + 6)));
  });

  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">
<dimension ref="A1:${colName(width)}${r-1}"/>
<sheetViews><sheetView workbookViewId="0">
<pane xSplit="1" ySplit="2" topLeftCell="B3" activePane="bottomRight" state="frozen"/>
</sheetView></sheetViews>
<sheetFormatPr defaultRowHeight="15"/>
<cols><col min="1" max="1" width="20" customWidth="1"/>
<col min="2" max="${Math.max(2,width)}" width="30" customWidth="1"/></cols>
<sheetData>${rows.join('')}</sheetData>
<mergeCells count="1"><mergeCell ref="A1:${colName(width)}1"/></mergeCells>
<pageMargins left="0.4" right="0.4" top="0.5" bottom="0.5" header="0.3" footer="0.3"/>
<pageSetup orientation="landscape" fitToWidth="1"/>
</worksheet>`;
}

function buildXlsx(courses, from, to, includeOff){
  const used = new Set();
  const sheetName = name => {
    /* Excel: 31 chars, no []:*?/\ , and no duplicates. */
    let s = String(name).replace(/[\[\]:*?\/\\]/g,'').trim().slice(0,31) || 'Sheet';
    const base = s.slice(0,28); let i = 2;
    while (used.has(s.toLowerCase())) s = `${base} ${i++}`;
    used.add(s.toLowerCase());
    return s;
  };

  const sheets = courses.map((c,i) => ({
    course: c,
    name: sheetName(c.name),
    days: exportDays(c, from, to, includeOff),
    file: `xl/worksheets/sheet${i+1}.xml`,
    rid: `rId${i+1}`,
  }));

  const files = [
    { name:'[Content_Types].xml', text:
`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
<Default Extension="xml" ContentType="application/xml"/>
<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>
<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>
${sheets.map(s => `<Override PartName="/${s.file}" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('\n')}
</Types>` },

    { name:'_rels/.rels', text:
`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>
</Relationships>` },

    { name:'xl/workbook.xml', text:
`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">
<sheets>${sheets.map((s,i) => `<sheet name="${xmlEsc(s.name)}" sheetId="${i+1}" r:id="${s.rid}"/>`).join('')}</sheets>
</workbook>` },

    { name:'xl/_rels/workbook.xml.rels', text:
`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
${sheets.map(s => `<Relationship Id="${s.rid}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/${s.file.split('/').pop()}"/>`).join('\n')}
<Relationship Id="rIdStyles" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>
</Relationships>` },

    { name:'xl/styles.xml', text: stylesXml() },
  ];

  sheets.forEach(s => files.push({ name:s.file, text: sheetXml(s.course, s.days) }));

  return zipStore(files,
    'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
}

/** The span the current view is showing — the sensible default to export. */
function currentRange(){
  if (ui.view === 'day')   return [ui.anchor, ui.anchor];
  if (ui.view === 'month'){
    const { days } = monthCells(ui.anchor);
    return days.length ? [days[0], days[days.length-1]] : [ui.anchor, ui.anchor];
  }
  const d = weekDates(ui.anchor);
  return [d[0], d[d.length-1]];
}
