<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lesson Planner</title>
<meta name="theme-color" content="#2563eb">
<meta name="apple-mobile-web-app-title" content="Lesson Planner">
<!-- Inline SVG favicon: keeps the app a single portable file. Reads as a
     planner grid at 16px rather than turning into mush. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232563eb'/%3E%3Crect x='13' y='15' width='38' height='36' rx='5' fill='%23ffffff'/%3E%3Crect x='13' y='15' width='38' height='9' rx='5' fill='%231d4ed8'/%3E%3Crect x='13' y='20' width='38' height='4' fill='%231d4ed8'/%3E%3Crect x='19' y='30' width='10' height='6' rx='2' fill='%232563eb'/%3E%3Crect x='34' y='30' width='10' height='6' rx='2' fill='%23bfdbfe'/%3E%3Crect x='19' y='40' width='10' height='6' rx='2' fill='%23bfdbfe'/%3E%3Crect x='34' y='40' width='10' height='6' rx='2' fill='%23f97316'/%3E%3C/svg%3E">
<style>
/* ─────────────────────────── Theme ─────────────────────────── */
:root{
  --bg:#faf9f7; --surface:#fff; --surface-2:#f4f2ef; --border:#e5e1db;
  --border-strong:#d3cec6; --text:#1f1d1a; --muted:#6b665e; --faint:#9c968c;
  --accent:#2563eb; --warn:#d97706; --ok:#059669;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 4px 12px rgba(0,0,0,.05);
  --radius:10px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#1a1917; --surface:#232120; --surface-2:#2b2927; --border:#35322e;
    --border-strong:#454039; --text:#f0ede8; --muted:#9a938a; --faint:#6f6960;
    --warn:#f59e0b; --ok:#34d399;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.35);
  }
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--text); font-family:var(--font);
  font-size:14px; line-height:1.45; -webkit-font-smoothing:antialiased;
  display:flex; flex-direction:column; overflow:hidden;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input{font:inherit;color:inherit}
body.dragging{cursor:grabbing!important; user-select:none}
body.dragging *{cursor:grabbing!important}

/* ─────────────────────────── Top bar ─────────────────────────── */
/* 1fr auto 1fr, not two flex spacers. Spacers only centre when what flanks
   them is the same width, which it never was — the switcher sat ~74px left of
   centre and slid further on every ⌘K. The auto column is centred by the grid
   itself, whatever the sides do. In flow, so the existing narrow-window rules
   still apply; absolute positioning would overlap instead of degrading. */
.topbar{
  display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:16px;
  padding:9px 18px;
  background:var(--surface); border-bottom:1px solid var(--border); flex:0 0 auto;
}
.tbleft{display:flex; align-items:center; gap:9px; min-width:0}
.tbright{justify-self:end; display:flex; align-items:center; gap:7px; min-width:0}
.spacer{flex:1}

.navgrp{display:flex; align-items:center; gap:3px; flex:0 0 auto}

.segmented{justify-self:center; display:flex; background:var(--surface-2);
  border-radius:8px; padding:3px; gap:2px}
.segmented button{
  padding:5px 15px; border-radius:6px; font-size:13px; color:var(--muted); font-weight:500;
}
.segmented button:hover{color:var(--text)}
.segmented button.on{background:var(--surface); color:var(--text); box-shadow:var(--shadow); font-weight:600}

.ico{
  width:32px; height:32px; border-radius:8px; display:grid; place-items:center;
  color:var(--muted);
}
.ico:hover{background:var(--surface-2); color:var(--text)}
.ico svg{width:17px; height:17px; fill:none; stroke:currentColor;
  stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round}

.iconbtn{
  padding:6px 11px; border-radius:7px; border:1px solid var(--border);
  color:var(--muted); font-size:12.5px; font-weight:500; white-space:nowrap;
}
.iconbtn:hover{background:var(--surface-2); color:var(--text)}

/* ─────────────────────────── Class tabs ─────────────────────────── */
.tabs{
  display:flex; align-items:center; gap:2px; padding:0 18px;
  background:var(--surface); border-bottom:1px solid var(--border); flex:0 0 auto;
  overflow-x:auto; scrollbar-width:none;
}
.tabs::-webkit-scrollbar{display:none}
.tab.dragging{opacity:.4}
.tab.over{background:color-mix(in srgb,var(--accent) 12%,transparent)}
.tab{
  position:relative; padding:9px 15px 10px; font-size:13.5px; font-weight:550;
  color:var(--muted); display:flex; align-items:center; gap:7px; white-space:nowrap;
}
.tab:hover{color:var(--text)}
.tab .dot{width:8px;height:8px;border-radius:50%;background:var(--c);flex:0 0 auto}
.tab .dots{display:flex; gap:2px; flex:0 0 auto}
.tab .dots i{width:5px;height:5px;border-radius:50%;display:block}
.tab.on{color:var(--text)}
.tab.on::after{
  content:''; position:absolute; left:8px; right:8px; bottom:-1px; height:2px;
  background:var(--c); border-radius:2px 2px 0 0;
}
.tab.allcls{margin-right:10px; padding-right:20px; border-right:1px solid var(--border)}
.tab .nm[contenteditable="true"]{
  min-width:2ch; padding:1px 5px; margin:-1px -5px; border-radius:5px;
  background:var(--bg); box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 35%,transparent);
  cursor:text;
}

/* ─────────────────────────── Date + nav ─────────────────────────── */
.navbtn{
  width:27px;height:27px;border-radius:7px;border:1px solid var(--border);
  display:grid;place-items:center;color:var(--muted);font-size:14px;
}
.navbtn:hover{background:var(--surface); color:var(--text)}
/* The week number leads and shares the date's size — it used to be an 8px
   uppercase badge trailing behind, which is not something you can read at a
   glance. Both live in one button, so the whole label opens the calendar. */
.period{
  display:flex; align-items:baseline; gap:8px; padding:3px 8px; border-radius:7px;
  white-space:nowrap; color:var(--text); background:none; border:none; min-width:0;
}
.period:hover{background:var(--surface-2)}
.period .lead{font-size:14.5px; font-weight:700; letter-spacing:-.01em; flex:0 0 auto}
.period .dt{font-size:14.5px; font-weight:500; color:var(--muted); overflow:hidden;
  text-overflow:ellipsis}
.period .cv{font-size:9px; color:var(--faint); align-self:center; flex:0 0 auto}
.period .short{display:none}
/* The left cell now carries a week label AND a full-month date — at its worst
   "Week 19 · S2  December 28, 2026 – January 1, 2027". Shed the label first,
   then fall back to the short forms, well before anything can collide. */
@media (max-width:1220px){ .period .lead{display:none} }
@media (max-width:1000px){
  .period .long{display:none}
  .period .short{display:inline}
}
.overflowpill{
  font-size:12px; font-weight:560; color:var(--warn); border:1px solid var(--warn);
  padding:3px 9px; border-radius:20px; background:color-mix(in srgb,var(--warn) 10%,transparent);
}
/* One pill for every saving state, so there aren't two competing systems in
   the same slot. Colour carries the level; the text carries the meaning. */
.savepill{
  display:inline-flex; align-items:center; gap:7px; margin-right:8px;
  padding:3px 10px; border:1px solid var(--border); border-radius:20px;
  font-size:12px; font-weight:560; color:var(--muted); white-space:nowrap; max-width:250px;
}
.savepill:hover{background:var(--surface-2); color:var(--text)}
.savepill.dotonly{padding:0; width:22px; height:22px; justify-content:center;
  border-color:transparent; margin-right:2px}
.savepill.dotonly:hover{border-color:var(--border)}
.savepill .dot{width:7px; height:7px; border-radius:50%; background:currentColor; flex:0 0 auto}
.savepill .sub{color:var(--faint); font-weight:500; min-width:0; overflow:hidden; text-overflow:ellipsis}
.savepill .sub::before{content:'· '}
.savepill.ok .dot{background:var(--ok)}
.savepill.busy .dot{background:var(--accent); animation:savepulse 1.1s ease-in-out infinite}
.savepill.dirty{color:var(--text)}
.savepill.dirty .dot{background:var(--accent)}
.savepill.warn{
  color:var(--warn); border-color:var(--warn);
  background:color-mix(in srgb,var(--warn) 10%,transparent);
}
.savepill.warn:hover{background:color-mix(in srgb,var(--warn) 20%,transparent)}
@keyframes savepulse{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){ .savepill.busy .dot{animation:none} }

.banner{
  display:flex; flex-direction:column; gap:8px; padding:14px;
  border:1px solid var(--accent); border-radius:11px;
  background:color-mix(in srgb,var(--accent) 8%,transparent);
}
.banner b{font-size:13.5px}

/* ─────────────────────────── Scroll area ─────────────────────────── */
.stage{flex:1; overflow:auto; padding:18px}

/* ─────────────────────────── Week grid ─────────────────────────── */
/* The week is ONE grid, and every column is a subgrid of it. That's what
   keeps a row level across all five days while letting it grow: the row's
   height is decided once, by whichever cell in it has the most in it.
   Each day still gets its own box — the drag code measures those. */
.weekgrid{
  display:grid; column-gap:10px; row-gap:8px;
  align-items:stretch; min-width:min-content;
}
.rowlabels{
  display:grid; grid-template-rows:subgrid; grid-row:1/-1;
  position:sticky; left:0; z-index:3;
}
.rowlabels .rl-spacer{min-height:var(--headh)}
.rowlabel{
  display:flex; align-items:flex-start; gap:6px; padding:8px 9px; min-height:var(--rowh);
  background:var(--surface); border:1px solid var(--border); border-radius:8px;
  font-size:12px; font-weight:600; color:var(--muted); text-transform:uppercase;
  letter-spacing:.05em; cursor:grab; user-select:none;
}
.rowlabel:hover{border-color:var(--border-strong); color:var(--text)}
.rowlabel.dragging{opacity:.4}
.rowlabel.over{border-color:var(--accent); box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 22%,transparent)}
.rowlabel .grip{color:var(--faint); font-size:13px; letter-spacing:-2px}
/* A row that exists for one week only — dashed, so it reads as temporary. */
.rowlabel.weekrow{border-style:dashed; cursor:default}
.rowlabel.weekrow .grip{letter-spacing:0; font-size:11px}
/* A row name wraps onto as many lines as it needs. "Differentiati…" told
   you nothing; the grid can afford the height now that rows stretch. */
.rowlabel .txt{flex:1; min-width:0; white-space:normal; overflow-wrap:break-word;
  line-height:1.3; letter-spacing:.03em}
.rowlabel .x{opacity:0; color:var(--faint); font-size:15px; padding:0 2px}
.rowlabel:hover .x{opacity:1}
.rowlabel .x:hover{color:#dc2626}
.addrowmini{
  justify-self:start; align-self:start; margin-top:2px; padding:4px 9px; border-radius:6px;
  font-size:11.5px; font-weight:600; color:var(--faint); letter-spacing:.03em;
}
.addrowmini:hover{background:var(--surface-2); color:var(--text)}

.daycol{position:relative; display:grid; grid-template-rows:subgrid}
/* A holiday or No Class column has one box, so it just fills the height. */
.daycol.offday{display:block}
.daycol.offday .offcol{height:100%}

/* ── Homework ─────────────────────────────────────────────────────── */
.hwline{position:relative; padding-right:96px}
.hwline::after{
  content:attr(data-dueon); position:absolute; right:0; top:1px;
  font-size:10px; font-weight:700; letter-spacing:.03em; white-space:nowrap;
  color:var(--muted); background:var(--surface-2); border:1px solid var(--border);
  border-radius:20px; padding:1px 7px; cursor:pointer; max-width:92px;
  overflow:hidden; text-overflow:ellipsis;
}
.hwline:hover::after{border-color:var(--accent); color:var(--accent)}
.hwline:not([data-due])::after{opacity:.45}

/* The wrapper carries the box; only the lower half is a real .cell, so that
   keyboard navigation lands on the part you can actually type in. */
.duecell{
  display:flex; flex-direction:column; gap:4px; padding:0;
  min-height:var(--rowh); background:var(--surface); border:1px solid var(--border);
  border-radius:8px; font-size:13px;
}
.duecell:hover{border-color:var(--border-strong)}
.duecell .inbound{
  display:flex; flex-direction:column; gap:3px; padding:6px 9px 5px;
  border-bottom:1px dashed var(--border-strong);
  background:color-mix(in srgb,var(--accent) 6%,transparent);
  border-radius:8px 8px 0 0;
}
.duecell .inline{display:flex; align-items:baseline; gap:6px; font-size:12.5px}
.duecell .inline .txt{flex:1; min-width:0; overflow-wrap:anywhere}
.duecell .inline .src{color:var(--faint); font-size:10.5px; white-space:nowrap}
.duecell .own{
  border:none; background:transparent; min-height:26px; flex:1;
  padding:5px 9px 7px; border-radius:0 0 8px 8px;
}
.duecell .own:hover{border:none}
.duecell .own:focus{box-shadow:none; border:none}
.duecell:focus-within{border-color:var(--accent);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 14%,transparent)}

/* A no-class column that still has to show one live row. */
.daycol.offsplit{display:grid; grid-template-rows:subgrid}
.offsplit .offcell,.offsplit .offhead{
  background:repeating-linear-gradient(45deg,var(--surface-2),var(--surface-2) 8px,
    transparent 8px,transparent 16px);
  border:1px dashed var(--border-strong); border-radius:8px;
}
.offsplit .offhead{border-radius:var(--radius)}
.offsplit .offname{font-size:12px; font-weight:650; color:var(--muted); margin-top:4px}

.offcol{height:100%}
.daycol.drag-src{opacity:.35}
.daycol.swap-target .dayhead,.daycol.swap-target .cell{
  border-color:var(--accent);
  box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 20%,transparent);
}

.dayhead{
  min-height:var(--headh); background:var(--surface); border:1px solid var(--border);
  border-radius:var(--radius); padding:8px 10px; display:flex; flex-direction:column;
  gap:5px; position:relative;
}
.dayhead:hover{border-color:var(--border-strong)}
.dayhead .top{display:flex; align-items:baseline; gap:7px}
.dayhead .dow{font-weight:680; font-size:13px; letter-spacing:-.01em}
.dayhead .date{color:var(--faint); font-size:11.5px}
.dayhead .grip{
  position:absolute; top:5px; right:26px; opacity:.38; color:var(--faint);
  padding:3px 4px; border-radius:5px; font-size:12px; line-height:1; cursor:grab;
  letter-spacing:-2px; touch-action:none;
}
.dayhead:hover .grip{opacity:1}
.dayhead .grip:hover{background:var(--surface-2); color:var(--text)}
.dayhead .more{
  position:absolute; top:5px; right:6px; opacity:0; color:var(--faint);
  padding:2px 5px; border-radius:5px; font-size:14px; line-height:1;
}
.dayhead:hover .more{opacity:1}
.dayhead .more:hover{background:var(--surface-2); color:var(--text)}
.title{
  width:100%; border:none; background:transparent; padding:1px 0; font-size:13.5px;
  font-weight:600; letter-spacing:-.01em; outline:none; line-height:1.3;
  overflow-wrap:break-word;
}
/* An <input> can only ever truncate, so the concept is a contenteditable
   div with its own placeholder. */
.title:empty::before{content:attr(data-ph); color:var(--faint); font-weight:500}
.tagrow{display:flex; align-items:center; gap:5px}
.tagpill{
  font-size:10.5px; font-weight:700; letter-spacing:.05em; text-transform:uppercase;
  padding:2px 7px; border-radius:20px; color:#fff; background:var(--t);
  display:inline-flex; align-items:center; height:19px;
}
/* An untagged pill used to gain a 1px dashed border on top of identical
   padding, which made it 2px taller than a tagged one in the same row. One
   declared height settles it in both directions — with no text there is no
   line box to size it either. */
.tagpill.none{
  background:transparent; color:var(--faint); border:1px dashed var(--border-strong);
  padding:1px 6px; min-width:22px;
}
.tagpill.none:hover{border-color:var(--muted)}

/* Status sits beside the tag but reads differently on purpose — outlined, not
   filled — so "what this lesson is" and "whether it's ready" don't compete. */
.statuspill{
  display:inline-flex; align-items:center; gap:5px; font-size:10.5px; font-weight:700;
  letter-spacing:.04em; text-transform:uppercase; padding:2px 8px 2px 6px;
  border-radius:20px; border:1px solid var(--border-strong); color:var(--faint);
}
.statuspill i{width:7px; height:7px; border-radius:50%; background:var(--s); display:block; flex:0 0 auto}
.statuspill.set{border-color:color-mix(in srgb,var(--s) 50%,transparent); color:var(--s)}
.statuspill.unset i{background:transparent; border:1.5px solid var(--border-strong)}
/* Inferred rather than chosen — present, but not shouting. */
.statuspill.soft{border-style:dashed; opacity:.85}
.statuspill:hover{border-color:var(--border-strong); color:var(--text)}
.statuspill.set:hover{color:var(--s)}
.sdot{width:7px; height:7px; border-radius:50%; background:var(--s); flex:0 0 auto}
.mcell .srow{display:flex; align-items:center; gap:5px; margin-top:auto;
  font-size:10px; font-weight:650; color:var(--faint); letter-spacing:.03em}

.cell{
  min-height:var(--rowh); background:var(--surface); border:1px solid var(--border);
  border-radius:8px; padding:7px 9px; outline:none; font-size:13px;
  overflow-wrap:anywhere;                  /* a pasted URL can't blow the column out */
}
.cell:hover{border-color:var(--border-strong)}
.cell:focus{border-color:var(--accent); box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 14%,transparent)}
.cell ul,.cell ol{margin:2px 0; padding-left:19px}
.cell p{margin:0 0 3px}

/* ── Checklists ─────────────────────────────────────────────────────
   A <ul class="cl"> of <li data-c="0|1">. Using a real list means Enter,
   Backspace and indentation keep working for free, and the ticked state is
   an attribute — so it survives being stored as HTML and read back, which a
   live <input type="checkbox"> would not. The box is drawn with ::before,
   and clicking it is caught on the cell. */
.cell ul.cl,.dayview ul.cl{list-style:none; padding-left:2px; margin:2px 0}
ul.cl li{position:relative; padding-left:21px; cursor:text}
ul.cl li::before{
  content:''; position:absolute; left:1px; top:.28em; width:13px; height:13px;
  border:1.5px solid var(--border-strong); border-radius:3.5px;
  background:var(--surface); cursor:pointer; box-sizing:border-box;
}
ul.cl li:hover::before{border-color:var(--accent)}
ul.cl li[data-c="1"]::before{background:var(--accent); border-color:var(--accent)}
ul.cl li[data-c="1"]::after{
  content:''; position:absolute; left:5.1px; top:.44em; width:4px; height:7.5px;
  border:solid #fff; border-width:0 2px 2px 0; transform:rotate(43deg);
  pointer-events:none;
}
ul.cl li[data-c="1"]{color:var(--faint); text-decoration:line-through;
  text-decoration-color:var(--border-strong)}

.offcol{
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  text-align:center; padding:14px 10px; gap:6px;
  background:repeating-linear-gradient(45deg,var(--surface-2),var(--surface-2) 8px,transparent 8px,transparent 16px);
  border:1px dashed var(--border-strong); border-radius:var(--radius); color:var(--muted);
}
.offcol b{font-size:12.5px; color:var(--text)}
.offcol span{font-size:11px; color:var(--faint)}
.offcol button{
  font-size:11.5px; font-weight:600; color:var(--accent); padding:3px 8px;
  border-radius:6px; border:1px solid var(--border-strong); background:var(--surface);
}
.offcol button:hover{background:var(--surface-2)}

/* ─────────────────────────── Drag overlay ─────────────────────────── */
#dragCaret{
  position:fixed; width:3px; background:var(--accent); border-radius:2px;
  pointer-events:none; z-index:200; display:none;
}
/* Added a frame after the caret first appears, so it slides between seams
   instead of popping — the motion is what tells the eye it moved. */
#dragCaret.slide{transition:left .09s ease-out, opacity .09s}
#dragCaret::before,#dragCaret::after{
  content:''; position:absolute; left:50%; transform:translateX(-50%);
  border-left:5px solid transparent; border-right:5px solid transparent;
}
#dragCaret::before{top:-1px; border-top:6px solid var(--accent)}
#dragCaret::after{bottom:-1px; border-bottom:6px solid var(--accent)}
#dragGhost{
  position:fixed; pointer-events:none; z-index:201; opacity:.85; display:none;
  transform:rotate(-1.2deg); box-shadow:0 8px 24px rgba(0,0,0,.22);
  border-radius:var(--radius); overflow:hidden;
}
#dragLabel{
  position:fixed; pointer-events:none; z-index:202; display:none;
  background:var(--text); color:var(--bg); font-size:12px; font-weight:620;
  padding:6px 11px; border-radius:7px; white-space:nowrap; box-shadow:var(--shadow);
  line-height:1.35;
}
#dragLabel .sub{font-weight:480; font-size:11px; opacity:.72}
#dragLabel.dim{opacity:.6}

/* ─────────────────────────── Day view ─────────────────────────── */
.dayview{max-width:820px; margin:0 auto; display:flex; flex-direction:column; gap:12px}
.dayview .card{background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:16px 18px}
.dayview .hd{display:flex; align-items:baseline; gap:10px; margin-bottom:12px}
.dayview .hd h2{margin:0; font-size:19px; letter-spacing:-.02em}
.dayview .lbl{
  font-size:11px; font-weight:700; color:var(--muted); text-transform:uppercase;
  letter-spacing:.07em; margin-bottom:5px;
}
.dayview .cell{height:auto; min-height:74px}
.dayview .title{font-size:17px}
.dayview .card.cls{border-left:3px solid var(--c)}

/* ─────────────────────────── Month view ─────────────────────────── */
/* Columns are set inline — five days normally, seven once weekends are on. */
.month{display:grid; gap:7px; min-width:640px}
.month .dow{
  text-align:center; font-size:11px; font-weight:700; color:var(--muted);
  text-transform:uppercase; letter-spacing:.07em; padding-bottom:2px;
}
.month .dow.wknd{color:var(--faint)}
.mcell.wknd{background:var(--surface-2)}
.mcell.wknd.off{background:transparent}
.mcell{
  min-height:88px; background:var(--surface); border:1px solid var(--border);
  border-radius:9px; padding:7px 9px; display:flex; flex-direction:column; gap:4px;
  cursor:pointer; overflow:hidden;
}
.mcell:hover{border-color:var(--border-strong)}
.mcell.off{background:transparent; border-style:dashed; cursor:default}
.mcell.hol{background:var(--surface-2); border-style:dashed; cursor:default}
.mcell .n{font-size:11.5px; font-weight:650; color:var(--faint)}

/* ── Today ──────────────────────────────────────────────────────────
   Enough to find at a glance while scanning, quiet enough not to read as
   an alert. Month: the date number becomes a filled chip. Week: a coloured
   rule across the top of the column with the word alongside the date. */
.mcell.today{border-color:var(--accent)}
.mcell.today .n{
  color:#fff; background:var(--accent); border-radius:20px;
  padding:1px 7px; margin:-1px -3px; align-self:flex-start;
}
.daycol.istoday .dayhead{
  border-color:var(--accent);
  box-shadow:inset 0 2px 0 var(--accent);
}
.dayhead .now{
  font-size:9.5px; font-weight:800; letter-spacing:.09em; text-transform:uppercase;
  color:var(--accent); margin-left:auto;
}
.ovhead.today{color:var(--accent)}
.ovhead.today small{color:var(--accent); opacity:.75}
.ovcol-today{box-shadow:inset 0 2px 0 var(--accent)}
.mcell .t{font-size:12.5px; font-weight:560; line-height:1.3; overflow:hidden}
.mcell .bar{height:3px; border-radius:2px; background:var(--t); margin:-1px -3px 1px}
.mcell .hn{font-size:11.5px; color:var(--muted); font-style:italic}

/* ── all-classes month ──────────────────────────────────────────────
   One mini-row per class, always in the same order and always the same
   height whether the class meets or not. The fixed vertical position is
   the whole point: you scan down a column and Grade 7 is always third. */
.mcell.multi{min-height:98px; gap:1px; padding:6px 7px}
.mcell .nrow{display:flex; align-items:center; gap:5px; margin-bottom:2px}
.mcell .warn{
  margin-left:auto; font-size:10.5px; font-weight:750; color:var(--warn);
  display:flex; align-items:center; gap:2px;
}
.mcell.collide{border-color:var(--warn); box-shadow:0 0 0 2px color-mix(in srgb,var(--warn) 22%,transparent)}

.mrow{
  display:flex; align-items:center; gap:5px; min-height:19px;
  padding:1px 3px; margin:0 -3px; border-radius:4px; background:var(--w,transparent);
}
.mrow.live{cursor:pointer}
.mrow.live:hover{outline:1.5px solid var(--border-strong); outline-offset:0}
.mrow .mc{
  width:15px; height:14px; border-radius:3.5px; background:var(--c); color:#fff;
  font-size:9.5px; font-weight:800; display:grid; place-items:center; flex:0 0 auto;
}
.mrow.absent .mc{opacity:.3}
.mrow.void .mc{opacity:.14}
.mrow .md{width:7px; height:7px; border-radius:2px; background:var(--t); flex:0 0 auto}
.mrow .md.no{background:transparent}
.mrow .mt{
  flex:1; min-width:0; font-size:11.5px; font-weight:520; line-height:1.25;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
/* An unplanned meeting is a ruled blank, like a line in a ledger — never the
   word "Untitled", which reads as an error twenty times over. */
.mrow .mt.blank{height:1px; background:var(--border-strong); opacity:.5; margin-right:5px}
.mrow .mt.nc{color:var(--faint); font-style:italic; font-size:10.5px; font-weight:500}
.legend{
  display:flex; align-items:center; gap:14px; margin-bottom:12px;
  font-size:12px; color:var(--muted); flex-wrap:wrap;
}
.legend .k{display:flex; align-items:center; gap:6px}
.legend .k i{width:11px;height:11px;border-radius:3px;background:var(--c);display:block}

/* ─────────────────────────── Overview (week) ─────────────────────────── */
.ovgrid{display:grid; gap:8px; min-width:760px}
.ovhead{
  font-size:11px; font-weight:700; color:var(--muted); text-transform:uppercase;
  letter-spacing:.07em; padding:0 2px 2px; text-align:center;
}
.ovhead small{display:block; font-weight:500; color:var(--faint); font-size:11px;
  text-transform:none; letter-spacing:0}
.ovclass{
  display:flex; align-items:center; gap:8px; padding:10px 11px; background:var(--surface);
  border:1px solid var(--border); border-left:3px solid var(--c); border-radius:9px;
  font-weight:620; font-size:13px; position:sticky; left:0; z-index:2; cursor:pointer;
}
.ovcell{
  min-height:62px; background:var(--surface); border:1px solid var(--border);
  border-radius:9px; padding:8px 10px; display:flex; flex-direction:column; gap:5px;
  cursor:pointer;
}
.ovcell:hover{border-color:var(--border-strong)}
.ovcell.empty{background:transparent; border-style:dashed; cursor:default}
.ovcell .t{font-size:12.5px; font-weight:560; line-height:1.32}
.ovcell.empty .t{color:var(--faint); font-style:italic; font-weight:500}
.ovcell .t.blank{height:1px; background:var(--border-strong); opacity:.5; margin-top:7px}

/* ─────────────────────────── Format toolbar ─────────────────────────── */
.fmt{
  position:fixed; display:none; gap:1px; background:var(--surface); padding:3px;
  border:1px solid var(--border-strong); border-radius:8px; box-shadow:var(--shadow); z-index:60;
}
.fmt.on{display:flex}
.fmt button{
  width:29px;height:27px;border-radius:5px;display:grid;place-items:center;
  color:var(--muted); font-size:13px;
}
.fmt button:hover{background:var(--surface-2); color:var(--text)}
.fmt button b{font-size:14px}
.fmt button i{font-size:14px; font-family:Georgia,serif}

/* ─────────────────────────── Menu ─────────────────────────── */
.menu{
  position:fixed; display:none; flex-direction:column; min-width:250px; padding:5px;
  background:var(--surface); border:1px solid var(--border-strong); border-radius:10px;
  box-shadow:var(--shadow); z-index:80;
}
.menu.on{display:flex}
/* The stepper menu is five short rows; 250px would be mostly air. */
.menu.narrow{min-width:196px}

/* ── Jump-to-a-date calendar ── */
.menu.cal{min-width:0; width:232px; padding:7px}
.calhd{display:flex; align-items:center; justify-content:space-between; padding:1px 2px 7px}
.calhd b{font-size:13px}
.calnav{
  width:24px; height:24px; border-radius:6px; display:grid; place-items:center;
  color:var(--muted); font-size:14px; flex:0 0 auto;
}
.calnav:hover{background:var(--surface-2); color:var(--text)}
.calgrid{display:grid; gap:1px; text-align:center}
.calgrid em{
  font-style:normal; font-size:9px; font-weight:700; color:var(--faint);
  padding-bottom:4px; letter-spacing:.04em;
}
.calday{
  font-size:11.5px; padding:4px 0; border-radius:5px; color:var(--text);
  font-variant-numeric:tabular-nums;
}
.calday.out{color:var(--faint); opacity:.5}
.calday.hol{
  background:repeating-linear-gradient(45deg,var(--surface-2),var(--surface-2) 2px,
             transparent 2px,transparent 4px);
  color:var(--faint);
}
.calday.today{font-weight:800; color:var(--accent)}
.calday:hover,.calday.wkhov{background:var(--surface-2)}
.calday.sel{background:color-mix(in srgb,var(--accent) 20%,transparent); font-weight:700}
.calft{
  display:flex; align-items:center; justify-content:space-between; gap:8px;
  margin-top:6px; padding-top:6px; border-top:1px solid var(--border);
}
.callink{font-size:11.5px; font-weight:650; color:var(--accent); padding:2px 5px; border-radius:5px}
.callink:hover{background:var(--surface-2)}
.calwk{font-size:10.5px; color:var(--faint); white-space:nowrap}

/* ── A day from an archived year ── */
.menu.preview{min-width:0; width:330px}
.pvbody{max-height:46vh; overflow:auto; padding:2px 9px 7px}
.pvtitle{font-size:13.5px; font-weight:650; margin-bottom:7px}
.pvrow{
  font-size:9.5px; font-weight:700; letter-spacing:.07em; text-transform:uppercase;
  color:var(--faint); margin-top:8px;
}
.pvtext{font-size:12.5px; color:var(--muted); white-space:pre-wrap; line-height:1.45}
.duestep{display:flex; align-items:center; gap:4px; padding:2px 5px 6px}
.stepbtn{
  width:26px; height:26px; flex:0 0 auto; display:grid; place-items:center;
  border:1px solid var(--border); border-radius:7px; background:var(--surface);
  color:var(--text); font-size:15px; line-height:1; cursor:pointer; padding:0;
}
.stepbtn:hover:not(:disabled){background:var(--surface-2)}
.stepbtn:disabled{opacity:.35; cursor:default}
.stepval{
  min-width:26px; text-align:center; font-size:14px; font-weight:700;
  font-variant-numeric:tabular-nums;
}
.unitsw{display:flex; margin-left:auto; background:var(--surface-2); border-radius:7px; padding:2px}
.unitsw button{
  min-width:0; padding:3px 7px; border:none; background:none; border-radius:5px;
  font-size:10.5px; color:var(--muted); cursor:pointer;
}
.unitsw button.on{background:var(--surface); color:var(--text); font-weight:650}
.duewhen{
  padding:0 9px 7px; font-size:11.5px; color:var(--muted);
  border-bottom:1px solid var(--border); margin-bottom:3px;
}
.menu button.withico{display:flex; align-items:center; gap:8px}
.menu .mico{width:14px; flex:0 0 auto; text-align:center; font-size:11px; opacity:.75}
.menu .sec{
  font-size:10px; font-weight:700; color:var(--faint); text-transform:uppercase;
  letter-spacing:.08em; padding:7px 9px 4px;
}
.menu button{
  text-align:left; padding:7px 9px; border-radius:6px; font-size:13px; display:flex;
  align-items:center; gap:9px;
}
.menu button:hover{background:var(--surface-2)}
.menu button.danger:hover{background:color-mix(in srgb,#dc2626 12%,transparent); color:#dc2626}
.menu button small{display:block; color:var(--faint); font-size:11.5px; font-weight:450}
.menu button .col{display:flex; flex-direction:column; gap:1px}
.menu hr{border:none; border-top:1px solid var(--border); margin:4px 0}
.menu .sw{width:11px;height:11px;border-radius:3px;background:var(--t);flex:0 0 auto}
.menu .sw.none{background:transparent;border:1px dashed var(--border-strong)}
/* The same hatching the calendar uses for a day with no class. */
.menu .sw.nc{
  background:repeating-linear-gradient(45deg,var(--border-strong),var(--border-strong) 2px,
    transparent 2px,transparent 4px);
  border:1px solid var(--border-strong);
}

/* ─────────────────────────── Toast ─────────────────────────── */
.toast{
  position:fixed; bottom:22px; left:50%; transform:translateX(-50%) translateY(14px);
  background:var(--text); color:var(--bg); padding:9px 16px; border-radius:9px;
  font-size:13px; font-weight:520; box-shadow:var(--shadow); z-index:90;
  opacity:0; pointer-events:none; transition:opacity .16s,transform .16s; white-space:nowrap;
}
.toast.on{opacity:1; transform:translateX(-50%) translateY(0)}

/* ─────────────────────────── Panel ─────────────────────────── */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:70;display:none}
.scrim.on{display:block}
.panel{
  position:fixed; top:0; right:0; bottom:0; width:min(460px,94vw); background:var(--surface);
  border-left:1px solid var(--border); z-index:75; padding:20px 20px 0; overflow:hidden;
  display:none; flex-direction:column; gap:14px;
}
.panel.on{display:flex}
/* The header stays put so Back and Close never scroll away; only the body moves. */
.panelhd{display:flex; align-items:center; gap:10px; flex:0 0 auto}
.panebody{
  flex:1; min-height:0; overflow:auto; display:flex; flex-direction:column;
  gap:18px; padding-bottom:20px;
}
.backbtn{
  display:flex; align-items:center; gap:5px; margin-left:-6px; padding:4px 8px;
  border-radius:7px; color:var(--muted); font-size:13px; font-weight:560; white-space:nowrap;
}
.backbtn:hover{background:var(--surface-2); color:var(--text)}
.navlist{display:flex; flex-direction:column; gap:2px}
.navrow{
  display:flex; align-items:center; gap:10px; width:100%; text-align:left;
  padding:11px 10px; border-radius:9px; font-size:14px; font-weight:560;
}
.navrow:hover{background:var(--surface-2)}
.navrow .v{
  margin-left:auto; font-size:12.5px; font-weight:500; color:var(--faint);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:54%;
}
.navrow .chev,.backbtn .chev,.clsitem .chev{color:var(--faint); font-size:15px; flex:0 0 auto}
.clsitem .chev{margin-left:4px}
.panel h3{margin:0; font-size:16px; letter-spacing:-.01em}
.panel h4{margin:0; font-size:13px; letter-spacing:-.01em}
.panel .grp{display:flex; flex-direction:column; gap:8px}
.panel .grp>label{font-size:11px;font-weight:700;color:var(--muted);
  text-transform:uppercase;letter-spacing:.07em}
/* A group inside a section is a sub-heading, not a peer of it. */
.panel .grp .grp>label{font-size:11px;font-weight:600;color:var(--faint);
  text-transform:none;letter-spacing:0}
.panel .grp .grp{gap:6px}
.panel input[type=text],.panel input[type=date],.panel input[type=number]{
  padding:7px 10px; border:1px solid var(--border); border-radius:7px;
  background:var(--bg); outline:none; width:100%;
}
.panel input:focus{border-color:var(--accent)}
.panel .note{font-size:12px; color:var(--muted); line-height:1.5}
.panel hr{border:none;border-top:1px solid var(--border);margin:2px 0;width:100%}

.dayrow{display:flex; gap:6px; flex-wrap:wrap}
.daychip{
  padding:6px 12px; border-radius:7px; border:1px solid var(--border);
  font-size:12.5px; font-weight:600; color:var(--muted); min-width:44px;
}
.daychip.on{background:var(--c); border-color:var(--c); color:#fff}
/* Saturday and Sunday read as the exception they are until they're picked. */
.daychip.wknd{border-style:dashed; color:var(--faint)}
.daychip.wknd.on{border-style:solid; color:#fff}

.clslist{display:flex; flex-direction:column; gap:4px}
.clsitem{
  display:flex; align-items:center; gap:9px; padding:8px 10px; border-radius:8px;
  border:1px solid var(--border); font-size:13.5px; font-weight:560; cursor:pointer;
}
.clsitem:hover{background:var(--surface-2)}
.clsitem.on{border-color:var(--c); background:color-mix(in srgb,var(--c) 8%,transparent)}
.clsitem .dot{width:9px;height:9px;border-radius:50%;background:var(--c);flex:0 0 auto}
.clsitem .meta{margin-left:auto; font-size:11.5px; color:var(--faint); font-weight:500}

.swatches{display:flex; gap:6px; flex-wrap:wrap}
.swatch{width:24px;height:24px;border-radius:6px;background:var(--c);border:2px solid transparent}
.swatch.on{border-color:var(--text)}

.rowedit{display:flex; align-items:center; gap:8px; padding:6px 8px;
  border:1px solid var(--border); border-radius:7px; font-size:13px; cursor:grab}
.rowedit.dragging{opacity:.4}
.rowedit.over{border-color:var(--accent)}
.rowedit .grip{color:var(--faint); letter-spacing:-2px; font-size:12px}
.rowedit .txt{flex:1; outline:none}
.rowedit .x{color:var(--faint); font-size:15px}
.rowedit .rolebadge{
  font-size:9.5px; font-weight:750; letter-spacing:.06em; text-transform:uppercase;
  color:var(--accent); border:1px solid color-mix(in srgb,var(--accent) 45%,transparent);
  border-radius:20px; padding:1px 6px; white-space:nowrap;
}
.rowedit .x:hover{color:#dc2626}

.holitem{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:5px 0}
.holitem .d{color:var(--faint);font-variant-numeric:tabular-nums;white-space:nowrap}
.holitem .r{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.holitem .meta{color:var(--faint); font-size:11.5px; white-space:nowrap}
.holitem .x{color:var(--faint);font-size:15px}
.holitem .x:hover{color:#dc2626}
.addrow{display:flex;gap:6px}
.addrow input{flex:1}
.addrow button{padding:7px 13px;border:1px solid var(--border);border-radius:7px;
  font-size:12.5px;font-weight:600;color:var(--muted); white-space:nowrap}
.addrow button:hover{background:var(--surface-2);color:var(--text)}

.helprow{display:flex; gap:12px; align-items:baseline; padding:5px 0; font-size:13px}
.helprow .g{
  flex:0 0 150px; font-weight:620; font-size:12px; color:var(--text);
}
.helprow .d{color:var(--muted); font-size:12.5px; line-height:1.45}
kbd{
  font:inherit; font-size:11px; font-weight:650; padding:1.5px 5px; border-radius:4px;
  border:1px solid var(--border-strong); background:var(--surface-2); color:var(--text);
}

/* ─────────────────────────── Selection ─────────────────────────── */
.daycol.selected .dayhead{
  border-color:var(--accent);
  box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 22%,transparent);
}
.mcell.selected{
  border-color:var(--accent);
  box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 22%,transparent);
}
#selbar{
  position:fixed; bottom:20px; left:50%; transform:translateX(-50%) translateY(14px);
  display:none; align-items:center; gap:9px; padding:8px 12px; z-index:85;
  background:var(--surface); border:1px solid var(--border-strong);
  border-radius:11px; box-shadow:var(--shadow); opacity:0; transition:opacity .14s,transform .14s;
}
#selbar.on{display:flex; opacity:1; transform:translateX(-50%) translateY(0)}
#selbar .n{font-size:12.5px; font-weight:620; white-space:nowrap; margin-right:2px}
#selbar button{
  padding:4px 9px; border-radius:6px; font-size:11.5px; font-weight:700;
  letter-spacing:.04em; text-transform:uppercase; color:#fff; background:var(--t);
}
#selbar button.ghost{
  background:none; color:var(--muted); border:1px solid var(--border);
  text-transform:none; letter-spacing:0; font-weight:560; font-size:12px;
}
#selbar button.ghost:hover{background:var(--surface-2); color:var(--text)}

/* ─────────────────────────── Search ─────────────────────────── */
.searchbox{
  position:relative; display:flex; align-items:center; gap:7px; height:32px;
  width:260px; padding:0 9px; border-radius:8px; background:var(--surface-2);
  border:1px solid transparent; transition:border-color .12s, background .12s;
}
/* One width. It used to grow 210→300px on focus, which slid everything to its
   left by 45px on every ⌘K — and will shove a grid-centred row once the bar is
   one. Only the surface changes now. */
.searchbox:focus-within{background:var(--surface); border-color:var(--accent)}
.searchbox .si{width:15px; height:15px; fill:none; stroke:var(--faint);
  stroke-width:1.9; stroke-linecap:round; flex:0 0 auto}
.searchbox input{
  flex:1; min-width:0; border:none; background:none; outline:none; font-size:13px;
}
.searchbox input::placeholder{color:var(--faint)}
/* Every badge, including ⌘K's, now rides the same setting. One shortcut
   advertised on its own was the inconsistency, not the badge itself. */
.hint{display:none}
body.hints .searchbox .hint{display:block; flex:0 0 auto; font-size:10px; opacity:.7}
body.hints .searchbox:focus-within .hint{display:none}
body.hints .segmented .hint,body.hints #today .hint{
  display:inline-block; margin-left:5px; font-size:9px; opacity:.6; padding:0 3px;
}
.searchbox .hits{
  position:absolute; top:38px; right:0; width:min(560px,78vw); max-height:62vh;
  overflow:auto; padding:5px; display:none; z-index:78;
  background:var(--surface); border:1px solid var(--border-strong);
  border-radius:11px; box-shadow:var(--shadow);
}
.searchbox .hits.on{display:block}
.searchbox .sfilters{
  display:flex; align-items:center; gap:7px; padding:3px 6px 7px;
  border-bottom:1px solid var(--border); margin-bottom:4px;
}
.searchbox .sfilter{
  font:inherit; font-size:12px; color:var(--muted); padding:2px 6px;
  border:1px solid var(--border); border-radius:20px; background:var(--surface);
  max-width:190px;
}
.searchbox .sfilter.set{border-color:var(--accent); color:var(--accent)}
.searchbox .sfcount{margin-left:auto; font-size:11.5px; color:var(--faint);
  white-space:nowrap; padding-right:4px}
/* Narrow windows: give the grid the room. Below 820px the box collapses to its
   icon and does still expand on focus — at that width the room matters more
   than the row holding still. */
@media (max-width:1040px){
  .searchbox{width:190px}
  .searchbox .hint{display:none}
}
@media (max-width:820px){
  .searchbox{width:34px; padding:0 8px}
  .searchbox input{opacity:0; transition:opacity .12s}
  .searchbox:focus-within{width:220px}
  .searchbox:focus-within input{opacity:1}
}
.searchbox .hit{
  display:flex; align-items:baseline; gap:9px; padding:8px 11px; border-radius:8px;
  cursor:pointer; font-size:13px;
}
.searchbox .hit.on,.searchbox .hit:hover{background:var(--surface-2)}
.searchbox .hit .mc{
  width:17px; height:15px; border-radius:4px; background:var(--c); color:#fff;
  font-size:9.5px; font-weight:800; display:grid; place-items:center; flex:0 0 auto;
}
