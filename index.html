}

function renderClassEditor(p, c){
  const head = el('div','grp');
  head.appendChild(el('h4','', 'Editing ' + c.name));
  p.appendChild(head);

  /* Name */
  const ng = el('div','grp');
  ng.appendChild(el('label','','Name'));
  const name = document.createElement('input');
  name.type = 'text'; name.value = c.name;
  name.onchange = () => commit('Class renamed', () => { c.name = name.value.trim() || c.name; });
  ng.appendChild(name);
  p.appendChild(ng);

  /* Color */
  const cg = el('div','grp');
  cg.appendChild(el('label','','Colour'));
  const sw = el('div','swatches');
  PALETTE.forEach(col => {
    const b = el('button','swatch' + (col === c.color ? ' on' : ''));
    b.style.setProperty('--c', col);
    b.onclick = () => { commit('Colour changed', () => { c.color = col; }); openPanel('classes'); };
    sw.appendChild(b);
  });
  cg.appendChild(sw);
  p.appendChild(cg);

  /* Meeting days */
  const dg = el('div','grp');
  dg.appendChild(el('label','','Meets on'));
  const drow = el('div','dayrow');
  WEEKDAYS.forEach(w => {
    const chip = el('div','daychip' + (c.weekdays.includes(w) ? ' on' : ''));
    chip.textContent = DOW3[w];
    chip.style.setProperty('--c', c.color);
    chip.onclick = () => {
      commit(`${c.name} meeting days changed`, () => {
        c.weekdays = c.weekdays.includes(w)
          ? c.weekdays.filter(x => x !== w)
          : [...c.weekdays, w].sort((a,b) => a-b);
      });
      openPanel('classes');
    };
    drow.appendChild(chip);
  });
  dg.appendChild(drow);
  dg.appendChild(el('div','note','Same every week. For a one-off, mark that day “No Class”.'));
  p.appendChild(dg);

  /* Date range */
  const rg = el('div','grp');
  rg.appendChild(el('label','','Runs from'));
  [['startDate','First day'],['endDate','Last day']].forEach(([k,lab]) => {
    const row = el('div','addrow');
    const l = el('span','note', lab);
    l.style.minWidth = '64px'; l.style.alignSelf = 'center';
    const inp = document.createElement('input');
    inp.type = 'date'; inp.value = c[k];
    inp.onchange = () => commit(`${c.name} dates changed`, () => { c[k] = inp.value; });
    row.appendChild(l); row.appendChild(inp);
    rg.appendChild(row);
  });
  const over = overflowCount(c);
  if (over > 0) rg.appendChild(el('div','note',
    `${over} lesson${over>1?'s':''} sit past the last day — kept, not deleted. Extend the end date or remove days to bring them back.`));
  p.appendChild(rg);

  /* Terms — only if this class runs on a different rhythm to the school. */
  const tg = el('div','grp');
  tg.appendChild(el('label','','Terms'));
  termEditor(tg,
    () => c.terms,
    v => { commit(`${c.name} terms changed`, () => { c.terms = v; }); openPanel('classes'); },
    state.terms);
  p.appendChild(tg);

  /* Rows */
  const rowsG = el('div','grp');
  rowsG.appendChild(el('label','','Rows'));
  c.rows.forEach((r, ri) => {
    const item = el('div','rowedit');
    item.draggable = true;
    item.appendChild(el('span','grip','⋮⋮'));
    const txt = el('span','txt', r.label);
    txt.contentEditable = 'true';
    txt.onblur = () => {
      const v = txt.textContent.trim();
      if (v && v !== r.label) commit('Row renamed', () => { r.label = v; });
      else txt.textContent = r.label;
    };
    txt.onkeydown = e => { if (e.key === 'Enter'){ e.preventDefault(); txt.blur(); } };
    item.appendChild(txt);
    const x = el('button','x','×');
    x.onclick = () => { commit('Row deleted', () => c.rows.splice(ri,1)); openPanel('classes'); };
    item.appendChild(x);

    item.ondragstart = e => { e.dataTransfer.setData('text/erow', String(ri)); item.classList.add('dragging'); };
    item.ondragend   = () => item.classList.remove('dragging');
    item.ondragover  = e => {
      if (!e.dataTransfer.types.includes('text/erow')) return;
      e.preventDefault(); item.classList.add('over');
    };
    item.ondragleave = () => item.classList.remove('over');
    item.ondrop = e => {
      e.preventDefault(); item.classList.remove('over');
      const from = Number(e.dataTransfer.getData('text/erow'));
      if (from === ri) return;
      commit('Rows reordered', () => {
        const [m] = c.rows.splice(from,1);
        c.rows.splice(ri,0,m);
      });
      openPanel('classes');
    };
    rowsG.appendChild(item);
  });
  const addRow = el('div','addrow');
  const rin = document.createElement('input');
  rin.type = 'text'; rin.placeholder = 'New row name';
  const rbtn = el('button','','Add');
  const doAdd = () => {
    const v = rin.value.trim(); if (!v) return;
    commit('Row added', () => c.rows.push({ id:uid(), label:v }));
    openPanel('classes');
  };
  rbtn.onclick = doAdd;
  rin.onkeydown = e => { if (e.key === 'Enter') doAdd(); };
  addRow.appendChild(rin); addRow.appendChild(rbtn);
  rowsG.appendChild(addRow);
  p.appendChild(rowsG);

  /* No-Class days */
  if (c.cancelled.length){
    const ncg = el('div','grp');
    ncg.appendChild(el('label','','No Class days'));
    c.cancelled.slice().sort((a,b) => a.date < b.date ? -1 : 1).forEach(x => {
      const item = el('div','holitem');
      item.appendChild(el('span','d', fmtMed(x.date)));
      item.appendChild(el('span','r', x.reason || 'No Class'));
      const b = el('button','x','×');
      b.title = 'Restore';
      b.onclick = () => { restoreMeeting(c, x.date); openPanel('classes'); };
      item.appendChild(b);
      ncg.appendChild(item);
    });
    p.appendChild(ncg);
  }

  /* Delete */
  const del = el('div','grp');
  const db = el('button','iconbtn','Delete ' + c.name);
  db.onclick = () => {
    if (!confirm(`Delete ${c.name} and all of its lessons? This can be undone with Cmd+Z.`)) return;
    commit(`${c.name} deleted`, () => {
      /* Drop the lessons too — otherwise they sit in state.lessons forever,
         unreachable and growing the file. Undo restores them with the snapshot. */
      c.lessons.forEach(id => delete state.lessons[id]);
      state.courses = state.courses.filter(x => x.id !== c.id);
      if (ui.courseId === c.id) ui.courseId = state.courses[0] ? state.courses[0].id : ALL;
    });
    editingId = null;
    openPanel('classes');
  };
  del.appendChild(db);
  p.appendChild(del);
}

/** Term picker, shared by the school default and a class's override.
    `get` returns the current config or null; `set` persists a new one. */
function termEditor(box, get, set, inherited){
  const t = get(), canInherit = !!inherited;
  const chips = el('div','dayrow');
  const modes = canInherit ? [['inherit','Same as school']] : [];
  Object.entries(TERM_MODES).forEach(([k,m]) => modes.push([k, m.label]));

  modes.forEach(([k,label]) => {
    const on = k === 'inherit' ? !t : (!!t && t.mode === k);
    const chip = el('div','daychip' + (on ? ' on' : ''), label);
    chip.style.setProperty('--c','var(--accent)');
    chip.onclick = () => {
      if (k === 'inherit') return set(null);
      const n = TERM_MODES[k].n || Math.max(2, (t ? t.starts.length : 2));
      set({ mode:k, starts: spreadTerms(state.yearStart, state.yearEnd, n) });
    };
    chips.appendChild(chip);
  });
  box.appendChild(chips);

  const eff = t || inherited;
  if (!eff) return;
  if (!t){
    box.appendChild(el('div','note',
      `Following the school — ${eff.starts.length} term${eff.starts.length>1?'s':''}.`));
    return;
  }

  const abbr = TERM_MODES[eff.mode].abbr || 'T';
  eff.starts.forEach((s, i) => {
    if (i === 0) return;                       // term 1 always opens with the year
    const row = el('div','addrow');
    const l = el('span','note', `${abbr}${i+1} starts`);
    l.style.minWidth = '78px'; l.style.alignSelf = 'center';
    const inp = document.createElement('input');
    inp.type = 'date'; inp.value = s;
    inp.onchange = () => {
      const starts = [...eff.starts];
      starts[i] = inp.value || s;
      set({ mode:eff.mode, starts: starts.sort() });
    };
    row.appendChild(l); row.appendChild(inp);
    if (eff.mode === 'custom'){
      const x = el('button','x','×');
      x.style.color = 'var(--faint)'; x.style.fontSize = '15px';
      x.onclick = () => set({ mode:'custom', starts: eff.starts.filter((_,k) => k !== i) });
      row.appendChild(x);
    }
    box.appendChild(row);
  });

  if (eff.mode === 'custom'){
    const add = el('button','iconbtn','+ Add a term');
    add.onclick = () => set({
      mode:'custom',
      starts:[...eff.starts, weekStart(state.yearEnd)].sort(),
    });
    box.appendChild(add);
  }
  box.appendChild(el('div','note','Week numbers count from the start of the current term.'));
}

/* ═══════════════════════════════════════════════════════════════════
   XLSX WRITER
   ───────────────────────────────────────────────────────────────────
   An .xlsx is a ZIP of XML parts. Storing the parts uncompressed
   (method 0) is legal and Excel accepts it, which means no deflate
   implementation and no vendored library — worth a few hundred KB of
   uncompressed XML to keep this one file dependency-free.
   ═══════════════════════════════════════════════════════════════════ */

const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let i = 0; i < 256; i++){
    let c = i;
    for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[i] = c >>> 0;
  }
  return t;
})();

function crc32(bytes){
  let c = 0xFFFFFFFF;
  for (let i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}

/** files: [{name, text}] → a Blob holding a store-only ZIP archive. */
function zipStore(files, mime){
  const enc = new TextEncoder();
  const now = new Date();
  const time = (now.getHours() << 11) | (now.getMinutes() << 5) | (now.getSeconds() >> 1);
  const date = ((now.getFullYear() - 1980) << 9) | ((now.getMonth() + 1) << 5) | now.getDate();

  const body = [], dir = [];
  let offset = 0;

  files.forEach(f => {
    const name = enc.encode(f.name), data = enc.encode(f.text), crc = crc32(data);

    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true);
    lh.setUint16(4, 20, true);
    lh.setUint16(6, 0x0800, true);          // UTF-8 names
    lh.setUint16(8, 0, true);               // stored
    lh.setUint16(10, time, true);
    lh.setUint16(12, date, true);
    lh.setUint32(14, crc, true);
    lh.setUint32(18, data.length, true);
    lh.setUint32(22, data.length, true);
    lh.setUint16(26, name.length, true);
    body.push(new Uint8Array(lh.buffer), name, data);

    const cd = new DataView(new ArrayBuffer(46));
    cd.setUint32(0, 0x02014b50, true);
    cd.setUint16(4, 20, true);
    cd.setUint16(6, 20, true);
    cd.setUint16(8, 0x0800, true);
    cd.setUint16(10, 0, true);
    cd.setUint16(12, time, true);
    cd.setUint16(14, date, true);
    cd.setUint32(16, crc, true);
    cd.setUint32(20, data.length, true);
    cd.setUint32(24, data.length, true);
    cd.setUint16(28, name.length, true);
    cd.setUint32(42, offset, true);
    dir.push(new Uint8Array(cd.buffer), name);

    offset += 30 + name.length + data.length;
  });

  const dirSize = dir.reduce((n,a) => n + a.length, 0);
  const eocd = new DataView(new ArrayBuffer(22));
  eocd.setUint32(0, 0x06054b50, true);
  eocd.setUint16(8, files.length, true);
  eocd.setUint16(10, files.length, true);
  eocd.setUint32(12, dirSize, true);
  eocd.setUint32(16, offset, true);

  return new Blob([...body, ...dir, new Uint8Array(eocd.buffer)], { type: mime });
}

/* ── XML + cell helpers ─────────────────────────────────────────── */

/* Control characters are illegal in XML and make Excel reject the whole
   file, so they're dropped — tab and newline survive. */
const xmlEsc = s => String(s)
  .replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g,'')
  .replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[ch]));

function colName(n){                        // 1 → A, 27 → AA
  let s = '';
  while (n > 0){ const r = (n - 1) % 26; s = String.fromCharCode(65 + r) + s; n = (n - 1 - r) / 26; }
  return s;
}

/** A cell's rich HTML as plain text, keeping list structure — a naive tag
    strip runs every bullet together into one line. */
function htmlToText(html){
  if (!html) return '';
  const box = document.createElement('div');
  box.innerHTML = html;
  const out = [];
  const walk = node => {
    node.childNodes.forEach(n => {
      if (n.nodeType === 3) return out.push(n.nodeValue);
      if (n.nodeType !== 1) return;
      const tag = n.tagName;
      if (tag === 'BR') return out.push('\n');
      if (tag === 'UL' || tag === 'OL'){
        let i = 1;
        n.childNodes.forEach(li => {
          if (li.nodeType !== 1 || li.tagName !== 'LI') return;
          out.push('\n' + (tag === 'OL' ? (i++) + '. ' : '• '));
          walk(li);
        });
        return out.push('\n');
      }
      if (tag === 'P' || tag === 'DIV'){ out.push('\n'); walk(n); return out.push('\n'); }
      walk(n);
    });
  };
  walk(box);
  return out.join('')
    .replace(/[ \t]+/g,' ').replace(/ *\n */g,'\n')
    .replace(/\n{3,}/g,'\n\n').trim();
}

const cellXml = (ref, style, text) =>
  text === '' || text === undefined || text === null
    ? `<c r="${ref}" s="${style}"/>`
    : `<c r="${ref}" s="${style}" t="inlineStr"><is><t xml:space="preserve">${xmlEsc(text)}</t></is></c>`;

/**
 * The columns a sheet gets. By default only the days the class actually
 * meets — a plan shows what you teach. With `includeOff` every weekday in
 * the range appears, so a principal can see why a gap is there.
 */
function exportDays(c, from, to, includeOff){
  const idxByDate = meetingIndexByDate(c);
  const out = [];
  for (let d = from; d <= to; d = addDays(d, 1)){
    if (!isWeekday(d)) continue;
    const idx = idxByDate.get(d);
    if (idx !== undefined){ out.push({ date:d, idx }); continue; }
    if (!includeOff) continue;
    const hol = holidayOn(d);
    out.push({ date:d, idx:null,
      note: hol ? hol.reason
          : (d < c.startDate || d > c.endDate) ? 'Not running'
          : 'No Class' });
  }
  return out;
}

/** One sheet per class: days across, that class's own rows down the side. */
function sheetXml(c, days){
  const lessons = days.map(d => d.idx === null ? null : state.lessons[c.lessons[d.idx]] || null);
  const tagged  = lessons.some(l => l && l.tag && l.tag !== 'none');
  const width   = days.length + 1;
  const rows    = [];
  let r = 1;

  const push = (cells, height) => {
    rows.push(`<row r="${r}"${height ? ` ht="${height}" customHeight="1"` : ''}>${cells.join('')}</row>`);
    r++;
  };
  const ref = i => `${colName(i+2)}${r}`;

  push([cellXml('A1', XF.title, `${c.name.toUpperCase()} · ` +
    (days.length ? fmtRange(days[0].date, days[days.length-1].date) : 'no meetings'))], 22);

  push([cellXml(`A${r}`, XF.dayhead, '')].concat(
    days.map((d,i) => cellXml(ref(i), XF.dayhead, `${DOW3[dow(d.date)]} ${fmtShort(d.date)}`))), 20);

  push([cellXml(`A${r}`, XF.rowlabel, 'Concept')].concat(
    days.map((d,i) => d.idx === null
      ? cellXml(ref(i), XF_OFF, d.note)
      : cellXml(ref(i), XF.concept, (lessons[i] && lessons[i].title) || ''))), 20);

  if (tagged)
    push([cellXml(`A${r}`, XF.rowlabel, 'Tag')].concat(
      days.map((d,i) => {
        if (d.idx === null) return cellXml(ref(i), XF_OFF, '');
        const t = lessons[i] && lessons[i].tag;
        return t && t !== 'none'
          ? cellXml(ref(i), xfForTag(t), TAGS[t].label.toUpperCase())
          : cellXml(ref(i), XF.body, '');
      })), 18);

  c.rows.forEach(row => {
    const texts = lessons.map(l => l ? htmlToText(l.cells[row.id]) : '');
    const lines = texts.reduce((n,t) => Math.max(n, t ? t.split('\n').length : 1), 1);
    push([cellXml(`A${r}`, XF.rowlabel, row.label)].concat(
      days.map((d,i) => cellXml(ref(i), d.idx === null ? XF_OFF : XF.body, texts[i]))),
      Math.max(20, Math.min(150, lines * 14 + 6)));
  });

  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">
<dimension ref="A1:${colName(width)}${r-1}"/>
<sheetViews><sheetView workbookViewId="0">
<pane xSplit="1" ySplit="2" topLeftCell="B3" activePane="bottomRight" state="frozen"/>
</sheetView></sheetViews>
<sheetFormatPr defaultRowHeight="15"/>
<cols><col min="1" max="1" width="20" customWidth="1"/>
<col min="2" max="${Math.max(2,width)}" width="30" customWidth="1"/></cols>
<sheetData>${rows.join('')}</sheetData>
<mergeCells count="1"><mergeCell ref="A1:${colName(width)}1"/></mergeCells>
<pageMargins left="0.4" right="0.4" top="0.5" bottom="0.5" header="0.3" footer="0.3"/>
<pageSetup orientation="landscape" fitToWidth="1"/>
</worksheet>`;
}

function buildXlsx(courses, from, to, includeOff){
  const used = new Set();
  const sheetName = name => {
    /* Excel: 31 chars, no []:*?/\ , and no duplicates. */
    let s = String(name).replace(/[\[\]:*?\/\\]/g,'').trim().slice(0,31) || 'Sheet';
    const base = s.slice(0,28); let i = 2;
    while (used.has(s.toLowerCase())) s = `${base} ${i++}`;
    used.add(s.toLowerCase());
    return s;
  };

  const sheets = courses.map((c,i) => ({
    course: c,
    name: sheetName(c.name),
    days: exportDays(c, from, to, includeOff),
    file: `xl/worksheets/sheet${i+1}.xml`,
    rid: `rId${i+1}`,
  }));

  const files = [
    { name:'[Content_Types].xml', text:
`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
<Default Extension="xml" ContentType="application/xml"/>
<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>
<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>
${sheets.map(s => `<Override PartName="/${s.file}" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('\n')}
</Types>` },

    { name:'_rels/.rels', text:
`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>
</Relationships>` },

    { name:'xl/workbook.xml', text:
`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">
<sheets>${sheets.map((s,i) => `<sheet name="${xmlEsc(s.name)}" sheetId="${i+1}" r:id="${s.rid}"/>`).join('')}</sheets>
</workbook>` },

    { name:'xl/_rels/workbook.xml.rels', text:
`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
${sheets.map(s => `<Relationship Id="${s.rid}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/${s.file.split('/').pop()}"/>`).join('\n')}
<Relationship Id="rIdStyles" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>
</Relationships>` },

    { name:'xl/styles.xml', text: stylesXml() },
  ];

  sheets.forEach(s => files.push({ name:s.file, text: sheetXml(s.course, s.days) }));

  return zipStore(files,
    'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
}

/** The span the current view is showing — the sensible default to export. */
function currentRange(){
  if (ui.view === 'day')   return [ui.anchor, ui.anchor];
  if (ui.view === 'month'){
    const { days } = monthCells(ui.anchor);
    return days.length ? [days[0], days[days.length-1]] : [ui.anchor, ui.anchor];
  }
  const d = weekDates(ui.anchor);
  return [d[0], d[d.length-1]];
}

   IMPORT / EXPORT

/** Filenames can't carry these on Windows or macOS. */
const safeName = s => String(s).replace(/[\/\\:*?"<>|]+/g,'-').replace(/\s+/g,' ').trim();

/** Shared download plumbing. The revoke is deferred — doing it synchronously
    after click() races the browser on anything larger than a small JSON. */
function download(blob, filename){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 10000);
}

function exportJson(){
  download(new Blob([JSON.stringify(state,null,2)], { type:'application/json' }),
           `lesson-planner-${iso(new Date())}.json`);
  localStorage.setItem(EXPORT_KEY, String(Date.now()));
  paintStorageBadge();
  toast('Exported');
}
function importJson(file){
  const fr = new FileReader();
  fr.onload = () => {
    try {
      const data = JSON.parse(fr.result);
      if (!data.courses || !data.lessons) throw new Error('Not a planner file');
      commit('Imported', () => {
        state = migrate(data);
        ui.courseId = state.courses[0] ? state.courses[0].id : ALL;
      });
    } catch(err){ toast('Could not read that file'); }
  };
  fr.readAsText(file);
}

/* ═══════════════════════════════════════════════════════════════════
   SEARCH
   ═══════════════════════════════════════════════════════════════════ */

let searchHits = [], searchAt = 0;

function snippet(text, needle){
  const at = text.toLowerCase().indexOf(needle);
  if (at < 0) return text.slice(0, 90);
  const s = Math.max(0, at - 30);
  return (s ? '…' : '') + text.slice(s, at + needle.length + 60).trim() + '…';
}

/** Walk course.lessons — never state.lessons, which can hold strays. */
function runSearch(q){
  const needle = q.trim().toLowerCase();
  if (needle.length < 2) return [];
  const out = [];
  state.courses.forEach(c => {
    const dates = meetingDates(c);
    c.lessons.forEach((id, i) => {
      const l = state.lessons[id]; if (!l) return;
      const parts = [];
      if (l.title) parts.push(l.title);
      c.rows.forEach(r => { const t = htmlToText(l.cells[r.id]); if (t) parts.push(t); });
      const blob = parts.join(' · ');
      if (!blob.toLowerCase().includes(needle)) return;
      out.push({ course:c, lesson:l, idx:i, date: dates[i] || null,
                 snip: snippet(blob, needle), needle });
    });
  });
  out.sort((a,b) => (a.date || '9999') < (b.date || '9999') ? -1 : 1);
  return out.slice(0, 80);
}

function renderHits(){
  const box = $('searchHits'); box.innerHTML = '';
  const q = $('searchInput').value.trim();
  if (!q){ box.classList.remove('on'); return; }
  box.classList.add('on');
  if (!searchHits.length){
    box.appendChild(el('div','none', q.length < 2 ? 'Type at least two letters' : 'Nothing found'));
    return;
  }
  searchHits.forEach((h, i) => {
    const row = el('div','hit' + (i === searchAt ? ' on' : ''));
    const badge = el('div','mc', shortLabel(h.course.name));
    badge.style.setProperty('--c', h.course.color);
    row.appendChild(badge);
    row.appendChild(el('div','d', h.date ? fmtMed(h.date) : 'past end'));
    row.appendChild(el('div','t', h.lesson.title || '—'));
    const s = el('div','s');
    /* Highlight the match without letting stored text become markup. */
    const at = h.snip.toLowerCase().indexOf(h.needle);
    if (at < 0) s.textContent = h.snip;
    else {
      s.appendChild(document.createTextNode(h.snip.slice(0, at)));
      s.appendChild(el('mark','', h.snip.slice(at, at + h.needle.length)));
      s.appendChild(document.createTextNode(h.snip.slice(at + h.needle.length)));
    }
    row.appendChild(s);
    row.onmouseenter = () => { searchAt = i; renderHits(); };
    row.onclick = () => gotoHit(h);
    box.appendChild(row);
  });
  const on = box.querySelector('.hit.on');
  if (on) on.scrollIntoView({ block:'nearest' });
}

function gotoHit(h){
  closeSearch();
  $('searchInput').blur();
  if (!h.date) return toast('That lesson sits past the end of the year');
  ui.courseId = h.course.id; ui.anchor = h.date; ui.view = 'day';
  daySel = null; render();
}

function openSearch(){
  const inp = $('searchInput');
  inp.focus(); inp.select();
  if (searchHits.length) $('searchHits').classList.add('on');
}
function closeSearch(){
  $('searchHits').classList.remove('on');
}
const searchIsOpen = () => $('searchHits').classList.contains('on');

/* ═══════════════════════════════════════════════════════════════════
   CLIPBOARD — cells, and whole days across classes
   ═══════════════════════════════════════════════════════════════════ */

let cellClip = null;                     // { label, html }

function openCellMenu(e, c, idx, row){
  const m = $('menu'); m.innerHTML = '';
  const lesson = state.lessons[c.lessons[idx]];
  if (!lesson) return;
  const html = lesson.cells[row.id] || '';
  const filled = !!htmlToText(html);

  m.appendChild(el('div','sec', row.label));
  if (filled){
    menuItem(m, 'Copy', () => { cellClip = { label:row.label, html }; toast('Cell copied'); });
    menuItem(m, 'Cut', () => {
      cellClip = { label:row.label, html };
      commit('Cell cut', () => { lesson.cells[row.id] = ''; });
    });
  }
  if (cellClip)
    menuItem(m, 'Paste', () => commit('Cell pasted', () => { lesson.cells[row.id] = cellClip.html; }),
             '', cellClip.label === row.label ? '' : `from ${cellClip.label}`);
  if (filled)
    menuItem(m, 'Clear', () => commit('Cell cleared', () => { lesson.cells[row.id] = ''; }), 'danger');
  placeMenu(e);
}

/**
 * Copy a whole day into another class on the same date. Rows are per-class
 * with their own ids, so they're matched by LABEL — and anything the target
 * has no row for is reported rather than dropped in silence.
 */
function copyDayTo(from, idx, to, date){
  const tIdx = meetingIndexByDate(to).get(date);
  if (tIdx === undefined) return toast(`${to.name} has no class on ${fmtMed(date)}`);
  const src = state.lessons[from.lessons[idx]];
  if (!src) return;

  const byLabel = new Map(to.rows.map(r => [r.label.trim().toLowerCase(), r.id]));
  const moved = {}, missing = [];
  from.rows.forEach(r => {
    const html = src.cells[r.id];
    if (!html || !htmlToText(html)) return;
    const target = byLabel.get(r.label.trim().toLowerCase());
    if (target) moved[target] = html; else missing.push(r.label);
  });

  const note = missing.length ? ` · no row for ${missing.join(', ')}` : '';
  commit(`Copied to ${to.name}${note}`, () => {
    const dst = ensureLesson(to, tIdx);
    dst.title = src.title; dst.tag = src.tag;
    dst.cells = Object.assign({}, dst.cells, moved);
  });
}

/* ═══════════════════════════════════════════════════════════════════
   DAY SELECTION — shift-click a run, then tag it in one go
   ═══════════════════════════════════════════════════════════════════ */

let daySel = null;               // { courseId, from, to } — sequence indices

function selRange(){
  if (!daySel) return null;
  return [Math.min(daySel.from, daySel.to), Math.max(daySel.from, daySel.to)];
}

function extendSelection(c, idx){
  if (!daySel || daySel.courseId !== c.id) daySel = { courseId:c.id, from:idx, to:idx };
  else daySel.to = idx;
  paintSelection();
}
function clearSelection(){
  if (!daySel) return false;
  daySel = null; paintSelection(); return true;
}

function paintSelection(){
  document.querySelectorAll('.selected').forEach(n => n.classList.remove('selected'));
  const bar = $('selbar');
  const r = selRange();
  if (!r || isAll() || !course() || course().id !== daySel.courseId){
    bar.classList.remove('on'); bar.innerHTML = '';
    return;
  }
  const [a,b] = r;
  document.querySelectorAll('[data-idx]').forEach(n => {
    const i = Number(n.dataset.idx);
    if (i >= a && i <= b) n.classList.add('selected');
  });

  const n = b - a + 1;
  bar.innerHTML = '';
  bar.appendChild(el('span','n', `${n} day${n === 1 ? '' : 's'}`));
  Object.entries(TAGS).forEach(([k,t]) => {
    if (k === 'none') return;
    const btn = el('button','', t.label);
    btn.style.setProperty('--t', t.color);
    btn.onclick = () => tagSelection(k);
    bar.appendChild(btn);
  });
  const clr = el('button','ghost','Clear tag');
  clr.onclick = () => tagSelection('none');
  bar.appendChild(clr);
  const done = el('button','ghost','Done');
  done.onclick = () => clearSelection();
  bar.appendChild(done);
  bar.classList.add('on');
}

function tagSelection(k){
  const r = selRange(); if (!r) return;
  const c = state.courses.find(x => x.id === daySel.courseId); if (!c) return;
  const [a,b] = r, n = b - a + 1;
  commit(k === 'none' ? `Tag cleared on ${n} day${n===1?'':'s'}`
                      : `${n} day${n===1?'':'s'} tagged ${TAGS[k].label}`, () => {
    for (let i = a; i <= b; i++){
      const l = state.lessons[c.lessons[i]];
      if (l) l.tag = k;
    }
  });
  daySel = null;
}

/* ═══════════════════════════════════════════════════════════════════
   EXPORT FOR AI
   ───────────────────────────────────────────────────────────────────
   planner.json is normalised for the app: lessons live in a flat map,
   cells are keyed by row id, dates aren't stored at all. That's the
   right shape for splicing an array and the wrong shape for a language
   model, which would have to join three structures and still wouldn't
   know what day anything falls on.

   So this is a second, derived view: flattened, chronological, real
   names, resolved dates, plain text — and a _readme block up front
   explaining the sequence-first model, because an assistant that
   doesn't know about the ripple will give confidently wrong advice
   about moving a day.
   ═══════════════════════════════════════════════════════════════════ */

const AI_README = {
  what: 'A teacher\'s lesson plans, exported from Lesson Planner to be read by an AI assistant.',
  theKeyIdea:
    'Lessons are an ORDERED LIST, not a set of dates. Each class has a fixed set of weekdays ' +
    'it meets; the app lays that class\'s lesson list onto those dates in order. The "date" on ' +
    'each lesson below is therefore DERIVED, never stored.',
  whatFollowsFromThat: [
    'Inserting a lesson pushes every later lesson forward by one meeting.',
    'Removing one pulls everything after it back by one meeting.',
    'A holiday shortens the meeting list, so each class shifts by one of ITS OWN meetings — not by one calendar day. Classes meeting different weekdays shift by different amounts of calendar time.',
    'Dates are not commitments. If you suggest adding a day of practice before a quiz, say plainly that the quiz moves too.',
  ],
  whenYouSuggestChanges: [
    'Refer to a lesson by class name and its "n" number, not by date. Numbers are stable; dates move.',
    'Spell out the ripple: which lessons shift, and where they land afterwards.',
    'Respect each class\'s own rows. They differ per class and are listed under "rows" for each class.',
    'Keep plan text plain. The app stores light HTML but plain text is what reads back cleanly.',
  ],
  thisFileIsReadOnly:
    'Editing this file does not change the planner — it is a snapshot. Describe the changes you ' +
    'recommend and the teacher will make them in the app.',
};

/** The whole planner as one flat, readable, chronological structure. */
function buildAiJson(from, to){
  const inRange = d => (!from || d >= from) && (!to || d <= to);

  return {
    _readme: AI_README,
    exportedOn: iso(new Date()),
    coveringDates: { from: from || state.yearStart, to: to || state.yearEnd },

    schoolYear: {
      firstDay: state.yearStart,
      lastDay: state.yearEnd,
      terms: (state.terms && state.terms.starts || []).map((s,i) => ({
        name: `${TERM_MODES[state.terms.mode].abbr || 'Term'}${i+1}`,
        starts: s,
      })),
      holidays: state.holidays
        .filter(h => inRange(h.date))
        .map(h => ({ from:h.date, to:h.endDate || h.date, reason:h.reason }))
        .sort((a,b) => a.from < b.from ? -1 : 1),
    },

    classes: state.courses.map(c => {
      const dates = meetingDates(c);
      const lessons = [];
      const overflow = [];

      c.lessons.forEach((id, i) => {
        const l = state.lessons[id];
        if (!l) return;
        const date = dates[i] || null;

        const plan = {};
        c.rows.forEach(r => {
          const text = htmlToText(l.cells[r.id]);
          if (text) plan[r.label] = text;
        });

        const entry = { n: i + 1 };
        if (date){
          entry.date = date;
          entry.weekday = DOW[dow(date)];
          entry.week = weekLabel(date, c);
        }
        entry.concept = l.title || null;
        if (l.tag && l.tag !== 'none') entry.tag = TAGS[l.tag].label;
        if (Object.keys(plan).length) entry.plan = plan;

        if (!date) overflow.push(entry);
        else if (inRange(date)) lessons.push(entry);
      });

      const out = {
        name: c.name,
        meetsOn: c.weekdays.map(w => DOW[w]),
        runs: { from: c.startDate, to: c.endDate },
        rows: c.rows.map(r => r.label),
        lessonCount: c.lessons.length,
        lessons,
      };
      const nc = c.cancelled.filter(x => inRange(x.date));
      if (nc.length)
        out.noClassDays = nc.map(x => x.date).sort();
      if (overflow.length){
        out.pastEndOfYear = overflow;
        out.pastEndOfYearNote =
          'These lessons have been pushed beyond the last day this class meets. They still exist ' +
          'and are not deleted, but they have no date until the class end date is extended or ' +
          'days are removed earlier in the sequence.';
      }
      return out;
    }),
  };
}

let aiPick = null;

function renderAiPanel(p){
  if (!aiPick) aiPick = { from: state.yearStart, to: state.yearEnd };

  const g = el('div','grp');
  g.appendChild(el('div','note',
    'A flattened, readable copy of your plans — real dates, class and row names, plain text, and ' +
    'a short briefing that teaches the assistant how the schedule works before it gives you advice.'));
  p.appendChild(g);

  const rg = el('div','grp');
  rg.appendChild(el('label','','Dates'));
  [['from','First day'],['to','Last day']].forEach(([k,lab]) => {
    const row = el('div','addrow');
    const l = el('span','note', lab);
    l.style.minWidth = '64px'; l.style.alignSelf = 'center';
    const inp = document.createElement('input');
    inp.type = 'date'; inp.value = aiPick[k];
    inp.onchange = () => { aiPick[k] = inp.value; openPanel('ai'); };
    row.appendChild(l); row.appendChild(inp);
    rg.appendChild(row);
  });
  const quick = el('div','dayrow');
  [['This week', ...currentRange()], ['Whole year', state.yearStart, state.yearEnd]]
    .forEach(([lab,a,b]) => {
      const chip = el('div','daychip' + (aiPick.from === a && aiPick.to === b ? ' on' : ''), lab);
      chip.style.setProperty('--c','var(--accent)');
      chip.onclick = () => { aiPick.from = a; aiPick.to = b; openPanel('ai'); };
      quick.appendChild(chip);
    });
  rg.appendChild(quick);
  p.appendChild(rg);

  const text = JSON.stringify(buildAiJson(aiPick.from, aiPick.to), null, 2);
  const kb = Math.round(text.length / 1024);

  const go = el('div','grp');
  const copy = el('button','cta','Copy to clipboard');
  copy.onclick = async () => {
    try {
      await navigator.clipboard.writeText(text);
      toast(`Copied — ${kb} KB, paste it into a chat`);
    } catch(e){
      /* Clipboard permission varies by origin; downloading always works. */
      download(new Blob([text], { type:'application/json' }), 'lesson-plans-for-ai.json');
      toast('Clipboard blocked — downloaded instead');
    }
  };
  go.appendChild(copy);

  const dl = el('button','iconbtn','Download as a file');
  dl.style.marginTop = '8px';
  dl.onclick = () => {
    download(new Blob([text], { type:'application/json' }), 'lesson-plans-for-ai.json');
    toast('Downloaded');
  };
  go.appendChild(dl);
  go.appendChild(el('div','note', `About ${kb} KB. Long ranges get big — a term at a time reads best.`));
  p.appendChild(go);
}

/* ═══════════════════════════════════════════════════════════════════
   FILE STORAGE
   ───────────────────────────────────────────────────────────────────
   localStorage is one "clear browsing data" away from losing a year of
   plans, and it is keyed to where this HTML file sits — move the file
   and the data silently disappears. So the real home is a folder you
   pick, ideally inside OneDrive:

       Lesson Planner Data/
         planner.json
         backups/planner-2026-09-08.json

   A folder rather than a single file, because a lone file handle can't
   write siblings and backups would be impossible.

   localStorage is still written on every change as a mirror, so nothing
   is lost if the folder goes away. Where the API is missing (Safari,
   Firefox) that mirror is the only copy and the panel says so.
   ═══════════════════════════════════════════════════════════════════ */

const CAN_FS = typeof window.showDirectoryPicker === 'function';
const PLANNER_FILE = 'planner.json';
const READABLE_FILE = 'plans-readable.json';
const REV_KEY = 'lessonPlanner.revision';
const BACKUP_KEY = 'lessonPlanner.lastBackup';
const EXPORT_KEY = 'lessonPlanner.lastExport';

/** A stable-enough name for this computer, so a conflict can say who wrote what. */
const MACHINE = (() => {
  let m = localStorage.getItem('lessonPlanner.machine');
  if (!m){
    const os = /Mac/i.test(navigator.platform) ? 'Mac'
             : /Win/i.test(navigator.platform) ? 'PC' : 'Device';
    m = `${os}-${Math.random().toString(36).slice(2,6)}`;
    localStorage.setItem('lessonPlanner.machine', m);
  }
  return m;
})();

/* Directory handles are structured-cloneable, so IndexedDB can hold one
   across restarts. localStorage can't — it's strings only. */
const IDB = { name:'lessonPlanner', store:'handles' };
const idbOpen = () => new Promise((res,rej) => {
  const r = indexedDB.open(IDB.name, 1);
  r.onupgradeneeded = () => r.result.createObjectStore(IDB.store);
  r.onsuccess = () => res(r.result);
  r.onerror = () => rej(r.error);
});
const idbGet = k => idbOpen().then(db => new Promise((res,rej) => {
  const q = db.transaction(IDB.store,'readonly').objectStore(IDB.store).get(k);
  q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error);
}));
const idbSet = (k,v) => idbOpen().then(db => new Promise((res,rej) => {
  const q = db.transaction(IDB.store,'readwrite').objectStore(IDB.store).put(v,k);
  q.onsuccess = () => res(); q.onerror = () => rej(q.error);
}));

let dirHandle = null;       // the connected folder
let pendingHandle = null;   // remembered, but needs a click to re-grant permission
let storageState = 'none';  // none | saved | saving | error | reconnect | denied
let saveTimer = null, savingNow = false, saveAgain = false;

function setStorage(s){ storageState = s; paintStorageBadge(); }

async function writeInto(dir, name, text){
  const fh = await dir.getFileHandle(name, { create:true });
  const w = await fh.createWritable();   // stages to a swap file…
  await w.write(text);
  await w.close();                       // …and swaps atomically here
}

async function flushToFolder(){
  if (!dirHandle) return;
  if (savingNow){ saveAgain = true; return; }
  savingNow = true; setStorage('saving');
  try {
    state.revision = (state.revision || 0) + 1;
    state.lastWrittenBy = MACHINE;
    state.lastWrittenAt = new Date().toISOString();
    const text = JSON.stringify(state, null, 2);
    await writeInto(dirHandle, PLANNER_FILE, text);
    localStorage.setItem(REV_KEY, String(state.revision));
    /* A readable companion, kept current so it's always there to hand to an
       assistant without exporting anything first. Never read back — planner.json
       stays the single source of truth. */
    try { await writeInto(dirHandle, READABLE_FILE, JSON.stringify(buildAiJson(), null, 2)); }
    catch(e){ console.warn('readable copy failed', e); }
    await rollBackup(text);
    setStorage('saved');
  } catch(e){
    console.warn('folder save failed', e);
    setStorage('error');
    toast('Could not save to your folder');
  } finally {
    savingNow = false;
    if (saveAgain){ saveAgain = false; scheduleFolderSave(); }
  }
}

function scheduleFolderSave(){
  if (!dirHandle) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flushToFolder, 900);
}

/** One snapshot per day, most recent 30 kept. */
async function rollBackup(text){
  const today = iso(new Date());
  if (localStorage.getItem(BACKUP_KEY) === today) return;
  const dir = await dirHandle.getDirectoryHandle('backups', { create:true });
  await writeInto(dir, `planner-${today}.json`, text);
  localStorage.setItem(BACKUP_KEY, today);
  const names = [];
  for await (const [name] of dir.entries())
    if (/^planner-\d{4}-\d\d-\d\d\.json$/.test(name)) names.push(name);
  names.sort();
  for (const n of names.slice(0, Math.max(0, names.length - 30)))
    await dir.removeEntry(n).catch(() => {});
}

function adoptLoaded(data){
  state = migrate(data);
  localStorage.setItem(REV_KEY, String(state.revision || 0));
  ui.courseId = state.courses[0] ? state.courses[0].id : ALL;
  ui.anchor = clampToYear(iso(new Date()));
  undoStack = []; redoStack = [];
  invalidateSchedule(); save(); render();
}

/** Read planner.json from the connected folder, or seed it if absent. */
async function loadFromFolder(){
  let data = null;
  try {
    const fh = await dirHandle.getFileHandle(PLANNER_FILE);
    data = JSON.parse(await (await fh.getFile()).text());
  } catch(e){ data = null; }

  if (!data || !data.courses){
    await flushToFolder();                 // empty folder — this becomes its home
    return;
  }

  /* If the file is behind what this machine last wrote, OneDrive probably
     hasn't finished syncing. Never merge — that's how a year of work gets
     quietly mangled. Ask, and let a human decide. */
  const known = Number(localStorage.getItem(REV_KEY) || 0);
  if (known && (data.revision || 0) < known){
    const useFile = confirm(
      'The planner file in your folder looks older than this computer\'s last save.\n\n' +
      `File: revision ${data.revision || 0} (saved by ${data.lastWrittenBy || 'unknown'})\n` +
      `This computer last saved: revision ${known}\n\n` +
      'This usually means OneDrive is still syncing. Wait a moment and reopen if unsure.\n\n' +
      'OK — open the file anyway.\nCancel — keep this computer\'s copy and overwrite the file.');
    if (!useFile){ await flushToFolder(); return; }
  }
  adoptLoaded(data);
  setStorage('saved');
}

async function chooseFolder(){
  if (!CAN_FS) return toast('This browser can’t save to a folder');
  let h;
  try {
    h = await window.showDirectoryPicker({ id:'lessonPlannerData', mode:'readwrite' });
  } catch(e){
    if (e && e.name === 'AbortError') return;             // user closed the dialog
    console.warn('directory picker failed', e);
    setStorage('denied');
    openPanel('classes');
    return toast('This page isn’t allowed to open a folder');
  }
  try {
    dirHandle = h;
    await idbSet('dir', h);
    const existing = await dirHandle.getFileHandle(PLANNER_FILE).then(() => true, () => false);
    if (existing && state.courses.length){
      const useFile = confirm(
        'That folder already has a planner file.\n\n' +
        'OK — open it and replace what\'s on screen.\n' +
        'Cancel — keep what\'s on screen and overwrite the file.');
      if (!useFile){ await flushToFolder(); }
      else { await loadFromFolder(); }
    } else if (existing){
      await loadFromFolder();
    } else {
      await flushToFolder();
    }
    toast('Saving to your folder');
  } catch(e){
    console.warn(e); dirHandle = null; setStorage('error');
    toast('Could not use that folder');
  }
  openPanel('classes');
}

async function forgetFolder(){
  dirHandle = null; pendingHandle = null;
  await idbSet('dir', null).catch(() => {});
  localStorage.removeItem(REV_KEY);
  setStorage('none');
  openPanel('classes');
  toast('Folder disconnected — saving in this browser only');
}

/** Re-grant permission on a handle we remembered. Needs a user gesture. */
async function reconnectFolder(){
  if (!pendingHandle) return;
  try {
    const p = await pendingHandle.requestPermission({ mode:'readwrite' });
    if (p !== 'granted') return toast('Permission declined');
    dirHandle = pendingHandle; pendingHandle = null;
    await loadFromFolder();
    openPanel('classes');
  } catch(e){ console.warn(e); toast('Could not reconnect'); }
}

/** On boot: reattach silently if permission survived, else offer a button. */
async function restoreFolder(){
  if (!CAN_FS) return;
  let h = null;
  try { h = await idbGet('dir'); } catch(e){ return; }
  if (!h) return;
  try {
    const p = await h.queryPermission({ mode:'readwrite' });
    if (p === 'granted'){ dirHandle = h; await loadFromFolder(); }
    else { pendingHandle = h; setStorage('reconnect'); }
  } catch(e){ pendingHandle = h; setStorage('reconnect'); }
}

/* ── the badge in the sub bar ─────────────────────────────────────── */

const daysSince = ts => ts ? Math.floor((Date.now() - Number(ts)) / 86400000) : Infinity;

function paintStorageBadge(){
  const box = $('storage'); if (!box) return;
  box.innerHTML = '';
  if (storageState === 'reconnect'){
    const b = el('button','warnpill','Reconnect folder');
    b.title = 'Your saved folder needs permission again';
    b.onclick = reconnectFolder;
    return box.appendChild(b);
  }
  if (storageState === 'error'){
    const b = el('button','warnpill','Not saving to folder');
    b.onclick = () => openPanel('classes');
    return box.appendChild(b);
  }
  if (dirHandle) return;                       // connected and fine — say nothing

  const stale = daysSince(localStorage.getItem(EXPORT_KEY));
  if (stale >= 7 && state.courses.length){
    const b = el('button','warnpill',
      stale === Infinity ? 'Back up your plans' : `Last backup ${stale} days ago`);
    b.title = 'This browser is the only copy of your plans';
    b.onclick = () => openPanel('classes');
    box.appendChild(b);
  }
}

function renderStoragePanel(p){
  const g = el('div','grp');
  g.appendChild(el('label','','Where your plans live'));

  if (dirHandle){
    const row = el('div','holitem');
    row.appendChild(el('span','r', dirHandle.name + '/' + PLANNER_FILE));
    g.appendChild(row);
    g.appendChild(el('div','note',
      'Saved automatically, with a dated copy in backups/ once a day. Put this folder in OneDrive and both computers stay in step.'));
    const btns = el('div','addrow');
    const ch = el('button','','Change folder'); ch.onclick = chooseFolder;
    const fg = el('button','','Disconnect');    fg.onclick = forgetFolder;
    btns.appendChild(ch); btns.appendChild(fg);
    g.appendChild(btns);
  } else if (!CAN_FS){
    g.appendChild(el('div','note',
      'This browser can only save inside itself — clearing browsing data would erase your plans. Chrome or Edge can save to a real folder instead. Until then, use Export often.'));
  } else {
    g.appendChild(el('div','note',
      'Right now everything is stored inside this browser. Clearing browsing data, or moving this file, loses it. Pick a folder — ideally in OneDrive — and it saves there automatically and syncs between computers.'));
    const b = el('button','cta', pendingHandle ? 'Reconnect folder' : 'Choose a folder…');
    b.style.justifyContent = 'center';
    b.onclick = pendingHandle ? reconnectFolder : chooseFolder;
    g.appendChild(b);
    if (storageState === 'denied')
      g.appendChild(el('div','note',
        'That didn’t work from a file opened directly off disk. Your browser may block folder access here — Export stays the reliable backup.'));
    const stale = daysSince(localStorage.getItem(EXPORT_KEY));
    if (stale >= 7 && state.courses.length)
      g.appendChild(el('div','note',
        stale === Infinity ? 'You haven’t exported a backup yet.'
                           : `Your last export was ${stale} days ago.`));
  }
  p.appendChild(g);
}

/* ═══════════════════════════════════════════════════════════════════
   NAVIGATION + WIRING
   ═══════════════════════════════════════════════════════════════════ */

function step(dir){
  if (ui.view === 'day'){
    let d = ui.anchor;
    for (let i = 0; i < 400; i++){
      d = addDays(d, dir);
      if (d < state.yearStart || d > state.yearEnd) break;
      if (isWeekday(d)){ ui.anchor = d; break; }
    }
  } else if (ui.view === 'month'){
    const d = parse(ui.anchor);
    ui.anchor = iso(new Date(d.getFullYear(), d.getMonth() + dir, 1));
  } else {
    ui.anchor = addDays(weekStart(ui.anchor), dir * 7);
  }
  render();
}

$('prev').onclick = () => step(-1);
$('next').onclick = () => step(1);
$('today').onclick = () => { ui.anchor = todayAnchor(); render(); };
$('btnMore').onclick = openMoreMenu;
$('scrim').onclick = () => { closeSearch(); closePanel(); };
$('filepick').onchange = e => { if (e.target.files[0]) importJson(e.target.files[0]); };

/** Same row, next or previous day — the one move Tab can't make, since Tab
    walks down a day column and then into the next one. */
function moveCellFocus(dir){
  const cur = document.activeElement;
  if (!cur || !cur.classList || !cur.classList.contains('cell')) return false;
  const col = cur.closest('.daycol');
  if (!col) return false;
  const cols = [...document.querySelectorAll('.daycol[data-idx]')];
  const next = cols[cols.indexOf(col) + dir];
  if (!next) return false;
  const target = next.querySelector(`.cell[data-row="${cur.dataset.row}"]`)
              || next.querySelector('.cell');
  if (!target) return false;
  target.focus();
  const sel = getSelection();                 // caret to the end, not the start
  sel.removeAllRanges();
  const r = document.createRange();
  r.selectNodeContents(target); r.collapse(false);
  sel.addRange(r);
  return true;
}

const inEditor = () => {
  const a = document.activeElement;
  return !!a && (a.isContentEditable || a.tagName === 'INPUT' || a.tagName === 'TEXTAREA');
};

document.addEventListener('keydown', e => {
  const mod = e.metaKey || e.ctrlKey;

  /* Search — ⌘K anywhere, or "/" when you're not typing into something. */
  if ((mod && e.key.toLowerCase() === 'k') || (!mod && !inEditor() && e.key === '/')){
    e.preventDefault();
    return searchIsOpen() ? closeSearch() : openSearch();
  }
  if (searchIsOpen()){
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp'){
      e.preventDefault();
      if (!searchHits.length) return;
      searchAt = (searchAt + (e.key === 'ArrowDown' ? 1 : -1) + searchHits.length) % searchHits.length;
      return renderHits();
    }
    if (e.key === 'Enter'){
      e.preventDefault();
      if (searchHits[searchAt]) gotoHit(searchHits[searchAt]);
      return;
    }
    if (e.key === 'Escape'){ e.preventDefault(); return closeSearch(); }
  }

  if (mod && e.key.toLowerCase() === 'z'){
    if (document.activeElement && document.activeElement.isContentEditable) return;
    e.preventDefault();
    e.shiftKey ? redo() : undo();
  }

  /* Alt + ← / → hops sideways between days without leaving the keyboard. */
  if (e.altKey && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')){
    if (moveCellFocus(e.key === 'ArrowRight' ? 1 : -1)) e.preventDefault();
    return;
  }

  if (e.key === 'Escape'){
    if (drag) return cancelDrag();
    if (inEditor()) return document.activeElement.blur();
    if (clearSelection()) return;
    closeMenu(); closePanel();
  }

  if (!mod && !e.altKey && document.activeElement === document.body){
    if (e.key === 'ArrowLeft')  step(-1);
    if (e.key === 'ArrowRight') step(1);
  }
});

$('searchInput').addEventListener('input', () => {
  searchHits = runSearch($('searchInput').value);
  searchAt = 0;
  renderHits();
});

render();
restoreFolder();

/* ── Installable app, but only when hosted ────────────────────────────
   The manifest, icons and service worker live beside this file on the web
   copy. Opened straight off disk none of them exist, so they're attached at
   runtime rather than in <head> — that keeps the emailable single file free
   of references that would 404. */
if (location.protocol === 'https:' || location.protocol === 'http:'){
  const link = (rel, href) => {
    const l = document.createElement('link');
    l.rel = rel; l.href = href;
    document.head.appendChild(l);
  };
  link('manifest', 'manifest.json');
  link('apple-touch-icon', 'apple-touch-icon.png');
  if (navigator.serviceWorker)
    navigator.serviceWorker.register('sw.js').catch(err => console.warn('sw', err));
}
</script>
</body>
