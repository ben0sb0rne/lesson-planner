<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lesson Planner</title>
<meta name="theme-color" content="#2563eb">
<meta name="apple-mobile-web-app-title" content="Lesson Planner">
<!-- Inline SVG favicon: keeps the app a single portable file. Reads as a
     planner grid at 16px rather than turning into mush. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232563eb'/%3E%3Crect x='13' y='15' width='38' height='36' rx='5' fill='%23ffffff'/%3E%3Crect x='13' y='15' width='38' height='9' rx='5' fill='%231d4ed8'/%3E%3Crect x='13' y='20' width='38' height='4' fill='%231d4ed8'/%3E%3Crect x='19' y='30' width='10' height='6' rx='2' fill='%232563eb'/%3E%3Crect x='34' y='30' width='10' height='6' rx='2' fill='%23bfdbfe'/%3E%3Crect x='19' y='40' width='10' height='6' rx='2' fill='%23bfdbfe'/%3E%3Crect x='34' y='40' width='10' height='6' rx='2' fill='%23f97316'/%3E%3C/svg%3E">
<style>
/* ─────────────────────────── Theme ─────────────────────────── */
:root{
  --bg:#faf9f7; --surface:#fff; --surface-2:#f4f2ef; --border:#e5e1db;
  --border-strong:#d3cec6; --text:#1f1d1a; --muted:#6b665e; --faint:#9c968c;
  --accent:#2563eb; --warn:#d97706;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 4px 12px rgba(0,0,0,.05);
  --radius:10px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#1a1917; --surface:#232120; --surface-2:#2b2927; --border:#35322e;
    --border-strong:#454039; --text:#f0ede8; --muted:#9a938a; --faint:#6f6960;
    --warn:#f59e0b;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.35);
  }
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--text); font-family:var(--font);
  font-size:14px; line-height:1.45; -webkit-font-smoothing:antialiased;
  display:flex; flex-direction:column; overflow:hidden;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input{font:inherit;color:inherit}
body.dragging{cursor:grabbing!important; user-select:none}
body.dragging *{cursor:grabbing!important}

/* ─────────────────────────── Top bar ─────────────────────────── */
.topbar{
  display:flex; align-items:center; gap:16px; padding:10px 18px;
  background:var(--surface); border-bottom:1px solid var(--border); flex:0 0 auto;
}
.brand{font-weight:650; letter-spacing:-.01em; font-size:15px; white-space:nowrap}
.brand small{color:var(--faint); font-weight:500; margin-left:7px; font-size:11px;
  text-transform:uppercase; letter-spacing:.08em}
.spacer{flex:1}

.segmented{display:flex; background:var(--surface-2); border-radius:8px; padding:3px; gap:2px}
.segmented button{
  padding:5px 15px; border-radius:6px; font-size:13px; color:var(--muted); font-weight:500;
}
.segmented button:hover{color:var(--text)}
.segmented button.on{background:var(--surface); color:var(--text); box-shadow:var(--shadow); font-weight:600}

.icons{display:flex; gap:2px; align-items:center}
.ico{
  width:32px; height:32px; border-radius:8px; display:grid; place-items:center;
  color:var(--muted);
}
.ico:hover{background:var(--surface-2); color:var(--text)}
.ico svg{width:17px; height:17px; fill:none; stroke:currentColor;
  stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round}

.iconbtn{
  padding:6px 11px; border-radius:7px; border:1px solid var(--border);
  color:var(--muted); font-size:12.5px; font-weight:500; white-space:nowrap;
}
.iconbtn:hover{background:var(--surface-2); color:var(--text)}

/* ─────────────────────────── Class tabs ─────────────────────────── */
.tabs{
  display:flex; align-items:center; gap:2px; padding:0 18px;
  background:var(--surface); border-bottom:1px solid var(--border); flex:0 0 auto;
}
.tab{
  position:relative; padding:9px 15px 10px; font-size:13.5px; font-weight:550;
  color:var(--muted); display:flex; align-items:center; gap:7px; white-space:nowrap;
}
.tab:hover{color:var(--text)}
.tab .dot{width:8px;height:8px;border-radius:50%;background:var(--c);flex:0 0 auto}
.tab .dots{display:flex; gap:2px; flex:0 0 auto}
.tab .dots i{width:5px;height:5px;border-radius:50%;display:block}
.tab.on{color:var(--text)}
.tab.on::after{
  content:''; position:absolute; left:8px; right:8px; bottom:-1px; height:2px;
  background:var(--c); border-radius:2px 2px 0 0;
}
.tab.sep{margin-left:10px; padding-left:20px; border-left:1px solid var(--border)}

/* ─────────────────────────── Sub bar ─────────────────────────── */
.subbar{
  display:flex; align-items:center; gap:10px; padding:9px 18px;
  border-bottom:1px solid var(--border); flex:0 0 auto; background:var(--bg);
}
.navbtn{
  width:27px;height:27px;border-radius:7px;border:1px solid var(--border);
  display:grid;place-items:center;color:var(--muted);font-size:14px;
}
.navbtn:hover{background:var(--surface); color:var(--text)}
.period{display:flex; align-items:baseline; gap:9px; font-weight:620; font-size:14.5px;
  letter-spacing:-.01em; white-space:nowrap}
.period .wk{
  font-size:11px; font-weight:650; color:var(--faint); letter-spacing:.05em;
  text-transform:uppercase; border:1px solid var(--border); border-radius:20px;
  padding:1px 8px; white-space:nowrap;
}
.overflowpill,.warnpill{
  font-size:12px; font-weight:560; color:var(--warn); border:1px solid var(--warn);
  padding:3px 9px; border-radius:20px; background:color-mix(in srgb,var(--warn) 10%,transparent);
}
.warnpill{margin-right:8px}
.warnpill:hover{background:color-mix(in srgb,var(--warn) 20%,transparent)}

/* ─────────────────────────── Scroll area ─────────────────────────── */
.stage{flex:1; overflow:auto; padding:18px}

/* ─────────────────────────── Week grid ─────────────────────────── */
.weekgrid{display:grid; gap:10px; align-items:start; min-width:min-content}
.rowlabels{display:flex; flex-direction:column; gap:8px; position:sticky; left:0; z-index:3}
.rowlabels .rl-spacer{height:var(--headh)}
.rowlabel{
  display:flex; align-items:center; gap:6px; padding:8px 9px; height:var(--rowh);
  background:var(--surface); border:1px solid var(--border); border-radius:8px;
  font-size:12px; font-weight:600; color:var(--muted); text-transform:uppercase;
  letter-spacing:.05em; cursor:grab; user-select:none;
}
.rowlabel:hover{border-color:var(--border-strong); color:var(--text)}
.rowlabel.dragging{opacity:.4}
.rowlabel.over{border-color:var(--accent); box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 22%,transparent)}
.rowlabel .grip{color:var(--faint); font-size:13px; letter-spacing:-2px}
.rowlabel .txt{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.rowlabel .x{opacity:0; color:var(--faint); font-size:15px; padding:0 2px}
.rowlabel:hover .x{opacity:1}
.rowlabel .x:hover{color:#dc2626}
.addrowmini{
  align-self:flex-start; margin-top:2px; padding:4px 9px; border-radius:6px;
  font-size:11.5px; font-weight:600; color:var(--faint); letter-spacing:.03em;
}
.addrowmini:hover{background:var(--surface-2); color:var(--text)}

.daycol{position:relative; display:flex; flex-direction:column; gap:8px}
.daycol.drag-src{opacity:.35}
.daycol.swap-target .dayhead,.daycol.swap-target .cell{
  border-color:var(--accent);
  box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 20%,transparent);
}

.dayhead{
  height:var(--headh); background:var(--surface); border:1px solid var(--border);
  border-radius:var(--radius); padding:8px 10px; display:flex; flex-direction:column;
  gap:5px; position:relative;
}
.dayhead:hover{border-color:var(--border-strong)}
.dayhead .top{display:flex; align-items:baseline; gap:7px}
.dayhead .dow{font-weight:680; font-size:13px; letter-spacing:-.01em}
.dayhead .date{color:var(--faint); font-size:11.5px}
.dayhead .grip{
  position:absolute; top:5px; right:26px; opacity:.38; color:var(--faint);
  padding:3px 4px; border-radius:5px; font-size:12px; line-height:1; cursor:grab;
  letter-spacing:-2px; touch-action:none;
}
.dayhead:hover .grip{opacity:1}
.dayhead .grip:hover{background:var(--surface-2); color:var(--text)}
.dayhead .more{
  position:absolute; top:5px; right:6px; opacity:0; color:var(--faint);
  padding:2px 5px; border-radius:5px; font-size:14px; line-height:1;
}
.dayhead:hover .more{opacity:1}
.dayhead .more:hover{background:var(--surface-2); color:var(--text)}
.title{
  width:100%; border:none; background:transparent; padding:1px 0; font-size:13.5px;
  font-weight:600; letter-spacing:-.01em; outline:none;
}
.title::placeholder{color:var(--faint); font-weight:500}
.tagrow{display:flex; align-items:center; gap:5px}
.tagpill{
  font-size:10.5px; font-weight:700; letter-spacing:.05em; text-transform:uppercase;
  padding:2px 7px; border-radius:20px; color:#fff; background:var(--t);
}
.tagpill.none{background:transparent; color:var(--faint); border:1px dashed var(--border-strong)}

.cell{
  height:var(--rowh); background:var(--surface); border:1px solid var(--border);
  border-radius:8px; padding:7px 9px; overflow:auto; outline:none; font-size:13px;
}
.cell:hover{border-color:var(--border-strong)}
.cell:focus{border-color:var(--accent); box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 14%,transparent)}
.cell ul,.cell ol{margin:2px 0; padding-left:19px}
.cell p{margin:0 0 3px}

.offcol{
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  text-align:center; padding:14px 10px; gap:6px;
  background:repeating-linear-gradient(45deg,var(--surface-2),var(--surface-2) 8px,transparent 8px,transparent 16px);
  border:1px dashed var(--border-strong); border-radius:var(--radius); color:var(--muted);
}
.offcol b{font-size:12.5px; color:var(--text)}
.offcol span{font-size:11px; color:var(--faint)}
.offcol button{
  font-size:11.5px; font-weight:600; color:var(--accent); padding:3px 8px;
  border-radius:6px; border:1px solid var(--border-strong); background:var(--surface);
}
.offcol button:hover{background:var(--surface-2)}

/* ─────────────────────────── Drag overlay ─────────────────────────── */
#dragCaret{
  position:fixed; width:3px; background:var(--accent); border-radius:2px;
  pointer-events:none; z-index:200; display:none;
}
/* Added a frame after the caret first appears, so it slides between seams
   instead of popping — the motion is what tells the eye it moved. */
#dragCaret.slide{transition:left .09s ease-out, opacity .09s}
#dragCaret::before,#dragCaret::after{
  content:''; position:absolute; left:50%; transform:translateX(-50%);
  border-left:5px solid transparent; border-right:5px solid transparent;
}
#dragCaret::before{top:-1px; border-top:6px solid var(--accent)}
#dragCaret::after{bottom:-1px; border-bottom:6px solid var(--accent)}
#dragGhost{
  position:fixed; pointer-events:none; z-index:201; opacity:.85; display:none;
  transform:rotate(-1.2deg); box-shadow:0 8px 24px rgba(0,0,0,.22);
  border-radius:var(--radius); overflow:hidden;
}
#dragLabel{
  position:fixed; pointer-events:none; z-index:202; display:none;
  background:var(--text); color:var(--bg); font-size:12px; font-weight:620;
  padding:6px 11px; border-radius:7px; white-space:nowrap; box-shadow:var(--shadow);
  line-height:1.35;
}
#dragLabel .sub{font-weight:480; font-size:11px; opacity:.72}
#dragLabel.dim{opacity:.6}

/* ─────────────────────────── Day view ─────────────────────────── */
.dayview{max-width:820px; margin:0 auto; display:flex; flex-direction:column; gap:12px}
.dayview .card{background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:16px 18px}
.dayview .hd{display:flex; align-items:baseline; gap:10px; margin-bottom:12px}
.dayview .hd h2{margin:0; font-size:19px; letter-spacing:-.02em}
.dayview .lbl{
  font-size:11px; font-weight:700; color:var(--muted); text-transform:uppercase;
  letter-spacing:.07em; margin-bottom:5px;
}
.dayview .cell{height:auto; min-height:74px}
.dayview .title{font-size:17px}
.dayview .card.cls{border-left:3px solid var(--c)}

/* ─────────────────────────── Month view ─────────────────────────── */
.month{display:grid; grid-template-columns:repeat(5,1fr); gap:7px; min-width:640px}
.month .dow{
  text-align:center; font-size:11px; font-weight:700; color:var(--muted);
  text-transform:uppercase; letter-spacing:.07em; padding-bottom:2px;
}
.mcell{
  min-height:88px; background:var(--surface); border:1px solid var(--border);
  border-radius:9px; padding:7px 9px; display:flex; flex-direction:column; gap:4px;
  cursor:pointer; overflow:hidden;
}
.mcell:hover{border-color:var(--border-strong)}
.mcell.off{background:transparent; border-style:dashed; cursor:default}
.mcell.hol{background:var(--surface-2); border-style:dashed; cursor:default}
.mcell .n{font-size:11.5px; font-weight:650; color:var(--faint)}
.mcell.today .n{color:var(--accent)}
.mcell .t{font-size:12.5px; font-weight:560; line-height:1.3; overflow:hidden}
.mcell .bar{height:3px; border-radius:2px; background:var(--t); margin:-1px -3px 1px}
.mcell .hn{font-size:11.5px; color:var(--muted); font-style:italic}

/* ── all-classes month ──────────────────────────────────────────────
   One mini-row per class, always in the same order and always the same
   height whether the class meets or not. The fixed vertical position is
   the whole point: you scan down a column and Grade 7 is always third. */
.mcell.multi{min-height:98px; gap:1px; padding:6px 7px}
.mcell .nrow{display:flex; align-items:center; gap:5px; margin-bottom:2px}
.mcell .warn{
  margin-left:auto; font-size:10.5px; font-weight:750; color:var(--warn);
  display:flex; align-items:center; gap:2px;
}
.mcell.collide{border-color:var(--warn); box-shadow:0 0 0 2px color-mix(in srgb,var(--warn) 22%,transparent)}

.mrow{
  display:flex; align-items:center; gap:5px; min-height:19px;
  padding:1px 3px; margin:0 -3px; border-radius:4px; background:var(--w,transparent);
}
.mrow.live{cursor:pointer}
.mrow.live:hover{outline:1.5px solid var(--border-strong); outline-offset:0}
.mrow .mc{
  width:15px; height:14px; border-radius:3.5px; background:var(--c); color:#fff;
  font-size:9.5px; font-weight:800; display:grid; place-items:center; flex:0 0 auto;
}
.mrow.absent .mc{opacity:.3}
.mrow.void .mc{opacity:.14}
.mrow .md{width:7px; height:7px; border-radius:50%; background:var(--t); flex:0 0 auto}
.mrow .md.no{background:transparent}
.mrow .mt{
  flex:1; min-width:0; font-size:11.5px; font-weight:520; line-height:1.25;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
/* An unplanned meeting is a ruled blank, like a line in a ledger — never the
   word "Untitled", which reads as an error twenty times over. */
.mrow .mt.blank{height:1px; background:var(--border-strong); opacity:.5; margin-right:5px}
.mrow .mt.nc{color:var(--faint); font-style:italic; font-size:10.5px; font-weight:500}
.legend{
  display:flex; align-items:center; gap:14px; margin-bottom:12px;
  font-size:12px; color:var(--muted); flex-wrap:wrap;
}
.legend .k{display:flex; align-items:center; gap:6px}
.legend .k i{width:11px;height:11px;border-radius:3px;background:var(--c);display:block}

/* ─────────────────────────── Overview (week) ─────────────────────────── */
.ovgrid{display:grid; gap:8px; min-width:760px}
.ovhead{
  font-size:11px; font-weight:700; color:var(--muted); text-transform:uppercase;
  letter-spacing:.07em; padding:0 2px 2px; text-align:center;
}
.ovhead small{display:block; font-weight:500; color:var(--faint); font-size:11px;
  text-transform:none; letter-spacing:0}
.ovclass{
  display:flex; align-items:center; gap:8px; padding:10px 11px; background:var(--surface);
  border:1px solid var(--border); border-left:3px solid var(--c); border-radius:9px;
  font-weight:620; font-size:13px; position:sticky; left:0; z-index:2; cursor:pointer;
}
.ovcell{
  min-height:62px; background:var(--surface); border:1px solid var(--border);
  border-radius:9px; padding:8px 10px; display:flex; flex-direction:column; gap:5px;
  cursor:pointer;
}
.ovcell:hover{border-color:var(--border-strong)}
.ovcell.empty{background:transparent; border-style:dashed; cursor:default}
.ovcell .t{font-size:12.5px; font-weight:560; line-height:1.32}
.ovcell.empty .t{color:var(--faint); font-style:italic; font-weight:500}
.ovcell .t.blank{height:1px; background:var(--border-strong); opacity:.5; margin-top:7px}

/* ─────────────────────────── Format toolbar ─────────────────────────── */
.fmt{
  position:fixed; display:none; gap:1px; background:var(--surface); padding:3px;
  border:1px solid var(--border-strong); border-radius:8px; box-shadow:var(--shadow); z-index:60;
}
.fmt.on{display:flex}
.fmt button{
  width:29px;height:27px;border-radius:5px;display:grid;place-items:center;
  color:var(--muted); font-size:13px;
}
.fmt button:hover{background:var(--surface-2); color:var(--text)}
.fmt button b{font-size:14px}
.fmt button i{font-size:14px; font-family:Georgia,serif}

/* ─────────────────────────── Menu ─────────────────────────── */
.menu{
  position:fixed; display:none; flex-direction:column; min-width:250px; padding:5px;
  background:var(--surface); border:1px solid var(--border-strong); border-radius:10px;
  box-shadow:var(--shadow); z-index:80;
}
.menu.on{display:flex}
.menu .sec{
  font-size:10px; font-weight:700; color:var(--faint); text-transform:uppercase;
  letter-spacing:.08em; padding:7px 9px 4px;
}
.menu button{
  text-align:left; padding:7px 9px; border-radius:6px; font-size:13px; display:flex;
  align-items:center; gap:9px;
}
.menu button:hover{background:var(--surface-2)}
.menu button.danger:hover{background:color-mix(in srgb,#dc2626 12%,transparent); color:#dc2626}
.menu button small{display:block; color:var(--faint); font-size:11.5px; font-weight:450}
.menu button .col{display:flex; flex-direction:column; gap:1px}
.menu hr{border:none; border-top:1px solid var(--border); margin:4px 0}
.menu .sw{width:11px;height:11px;border-radius:3px;background:var(--t);flex:0 0 auto}
.menu .sw.none{background:transparent;border:1px dashed var(--border-strong)}

/* ─────────────────────────── Toast ─────────────────────────── */
.toast{
  position:fixed; bottom:22px; left:50%; transform:translateX(-50%) translateY(14px);
  background:var(--text); color:var(--bg); padding:9px 16px; border-radius:9px;
  font-size:13px; font-weight:520; box-shadow:var(--shadow); z-index:90;
  opacity:0; pointer-events:none; transition:opacity .16s,transform .16s; white-space:nowrap;
}
.toast.on{opacity:1; transform:translateX(-50%) translateY(0)}

/* ─────────────────────────── Panel ─────────────────────────── */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:70;display:none}
.scrim.on{display:block}
.panel{
  position:fixed; top:0; right:0; bottom:0; width:min(460px,94vw); background:var(--surface);
  border-left:1px solid var(--border); z-index:75; padding:20px; overflow:auto;
  display:none; flex-direction:column; gap:18px;
}
.panel.on{display:flex}
.panel h3{margin:0; font-size:16px; letter-spacing:-.01em}
.panel h4{margin:0; font-size:13px; letter-spacing:-.01em}
.panel .grp{display:flex; flex-direction:column; gap:8px}
.panel .grp>label{font-size:11px;font-weight:700;color:var(--muted);
  text-transform:uppercase;letter-spacing:.07em}
.panel input[type=text],.panel input[type=date]{
  padding:7px 10px; border:1px solid var(--border); border-radius:7px;
  background:var(--bg); outline:none; width:100%;
}
.panel input:focus{border-color:var(--accent)}
.panel .note{font-size:12px; color:var(--muted); line-height:1.5}
.panel hr{border:none;border-top:1px solid var(--border);margin:2px 0;width:100%}

.dayrow{display:flex; gap:6px; flex-wrap:wrap}
.daychip{
  padding:6px 12px; border-radius:7px; border:1px solid var(--border);
  font-size:12.5px; font-weight:600; color:var(--muted); min-width:44px;
}
.daychip.on{background:var(--c); border-color:var(--c); color:#fff}

.clslist{display:flex; flex-direction:column; gap:4px}
.clsitem{
  display:flex; align-items:center; gap:9px; padding:8px 10px; border-radius:8px;
  border:1px solid var(--border); font-size:13.5px; font-weight:560; cursor:pointer;
}
.clsitem:hover{background:var(--surface-2)}
.clsitem.on{border-color:var(--c); background:color-mix(in srgb,var(--c) 8%,transparent)}
.clsitem .dot{width:9px;height:9px;border-radius:50%;background:var(--c);flex:0 0 auto}
.clsitem .meta{margin-left:auto; font-size:11.5px; color:var(--faint); font-weight:500}

.swatches{display:flex; gap:6px; flex-wrap:wrap}
.swatch{width:24px;height:24px;border-radius:6px;background:var(--c);border:2px solid transparent}

<body>

<script>
'use strict';

/* ═══════════════════════════════════════════════════════════════════
   CONSTANTS
   ═══════════════════════════════════════════════════════════════════ */

const TAGS = {
  none:    { label:'No tag',     color:'transparent' },
  test:    { label:'Test',       color:'#dc2626' },
  quiz:    { label:'Quiz',       color:'#ea580c' },
  lab:     { label:'Lab',        color:'#0d9488' },
  project: { label:'Project',    color:'#7c3aed' },
  review:  { label:'Review',     color:'#2563eb' },
  trip:    { label:'Field Trip', color:'#16a34a' },
};
/* Tags that count as an assessment for collision detection in the month view. */
const ASSESSMENT = new Set(['test','quiz']);

const DOW  = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const DOW3 = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MON  = ['January','February','March','April','May','June','July',
              'August','September','October','November','December'];
const WEEKDAYS = [1,2,3,4,5];
const PALETTE = ['#2563eb','#059669','#d97706','#7c3aed','#dc2626','#0d9488','#db2777','#65a30d'];
const STORAGE_KEY = 'lessonPlannerSandbox.v2';

const ALL = 'ALL';                       // sentinel course id for the all-classes tab

/* ═══════════════════════════════════════════════════════════════════
   DATE HELPERS  (dates are 'YYYY-MM-DD' strings, parsed as local)
   ═══════════════════════════════════════════════════════════════════ */

const pad = n => String(n).padStart(2,'0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y,m-1,d); };
const addDays = (s,n) => { const d = parse(s); d.setDate(d.getDate()+n); return iso(d); };
const dow = s => parse(s).getDay();
const isWeekday = s => { const w = dow(s); return w >= 1 && w <= 5; };

function weekStart(s){                   // Monday of the week containing s
  const w = dow(s);
  return addDays(s, w === 0 ? -6 : 1 - w);
}
const fmtShort = s => { const d = parse(s); return `${d.getMonth()+1}/${d.getDate()}`; };
const fmtLong  = s => { const d = parse(s);
  return `${DOW[d.getDay()]}, ${MON[d.getMonth()]} ${d.getDate()}`; };
const fmtMed   = s => { const d = parse(s); return `${MON[d.getMonth()].slice(0,3)} ${d.getDate()}`; };
const fmtMedY  = s => { const d = parse(s);
  return `${MON[d.getMonth()].slice(0,3)} ${d.getDate()}, ${d.getFullYear()}`; };
const fmtDay   = s => { const d = parse(s);
  return `${DOW3[d.getDay()]}, ${MON[d.getMonth()].slice(0,3)} ${d.getDate()}, ${d.getFullYear()}`; };
const dayDiff  = (a,b) => Math.round((parse(a) - parse(b)) / 86400000);
const uid = () => Math.random().toString(36).slice(2,10);

/** A span of days, collapsing whatever the two ends share.
    "Aug 24 – 28, 2026" · "Aug 31 – Sep 4, 2026" · "Dec 28, 2026 – Jan 1, 2027" */
function fmtRange(a, b){
  const x = parse(a), y = parse(b);
  const mA = MON[x.getMonth()].slice(0,3), mB = MON[y.getMonth()].slice(0,3);
  if (x.getFullYear() !== y.getFullYear())
    return `${mA} ${x.getDate()}, ${x.getFullYear()} – ${mB} ${y.getDate()}, ${y.getFullYear()}`;
  if (x.getMonth() !== y.getMonth())
    return `${mA} ${x.getDate()} – ${mB} ${y.getDate()}, ${y.getFullYear()}`;
  return `${mA} ${x.getDate()} – ${y.getDate()}, ${y.getFullYear()}`;
}

/* ═══════════════════════════════════════════════════════════════════
   TERMS
   ───────────────────────────────────────────────────────────────────
   A term is just a start date. The school owns a default set; a class
   may override it. Week numbers count from the start of whichever term
   contains the date, so "Week 3 · S2" means the third week of the
   second semester — not the third week of the year.
   ═══════════════════════════════════════════════════════════════════ */

const TERM_MODES = {
  semester:  { n:2, abbr:'S', label:'Semesters'  },
  year:      { n:1, abbr:'',  label:'Whole year' },
  trimester: { n:3, abbr:'T', label:'Trimesters' },
  custom:    { n:0, abbr:'T', label:'Custom'     },
};

/** N term starts spread evenly across a year, each snapped to a Monday. */
function spreadTerms(yearStart, yearEnd, n){
  const a = parse(yearStart), b = parse(yearEnd);
  const out = [yearStart];
  for (let i = 1; i < n; i++)
    out.push(weekStart(iso(new Date(a.getTime() + (b - a) * i / n))));
  return out;
}

const termsFor = c => (c && c.terms) ? c.terms : state.terms;

/** Which term a date falls in: { index, start, mode, count } */
function termOn(date, c){
  const t = termsFor(c);
  if (!t || !t.starts || !t.starts.length) return null;
  let i = 0;
  t.starts.forEach((s,k) => { if (date >= s) i = k; });
  return { index:i, start:t.starts[i], mode:t.mode, count:t.starts.length };
}

const termAbbr = t =>
  t && t.count > 1 && TERM_MODES[t.mode] && TERM_MODES[t.mode].abbr
    ? TERM_MODES[t.mode].abbr + (t.index + 1) : '';

/** "Week 3 · S1", or just "Week 3" when the year isn't divided. */
function weekLabel(date, c){
  const t = termOn(date, c);
  if (!t) return '';
  const n = Math.floor(dayDiff(weekStart(date), weekStart(t.start)) / 7) + 1;
  if (n < 1) return '';
  const abbr = termAbbr(t);
  return abbr ? `Week ${n} · ${abbr}` : `Week ${n}`;
}

/* ═══════════════════════════════════════════════════════════════════
   SEED DATA  (loaded on demand, never automatically)
   ═══════════════════════════════════════════════════════════════════ */

const mkRows = labels => labels.map(l => ({ id:uid(), label:l }));

function emptyState(){
  const yearStart = '2026-08-24', yearEnd = '2027-06-04';
  return {
    schemaVersion: 3,
    yearStart, yearEnd,
    terms: { mode:'semester', starts: spreadTerms(yearStart, yearEnd, 2) },
    holidays: [],
    courses: [],
    lessons: {},
  };
}


/* ═══════════════════════════════════════════════════════════════════
   STATE + PERSISTENCE + UNDO
   ═══════════════════════════════════════════════════════════════════ */

let state, ui, undoStack = [], redoStack = [];

function load(){
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return migrate(JSON.parse(raw));
  } catch(e){ console.warn('load failed', e); }
  return emptyState();
}

/** Bring older files forward. v1 = rotating cycle, v2 = weekdays, v3 = terms. */
function migrate(data){
  if (!data || !data.courses) return emptyState();
  if (data.schemaVersion >= 3) return data;

  data.courses.forEach(c => {
    if (!c.weekdays) c.weekdays = [...WEEKDAYS];   // old cycleDays don't map; assume all
    delete c.cycleDays;
    if (!c.startDate) c.startDate = data.yearStart;
    if (!c.endDate)   c.endDate   = data.yearEnd;
    if (!c.cancelled) c.cancelled = [];
    if (c.terms === undefined) c.terms = null;     // null = follow the school default
  });
  delete data.cycleLength;
  if (!data.terms)
    data.terms = { mode:'semester', starts: spreadTerms(data.yearStart, data.yearEnd, 2) };
  data.schemaVersion = 3;
  return data;
}

function save(){
  /* localStorage stays a mirror even when a folder is connected — it costs
     nothing and means a folder going missing never loses the day's work. */
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
  catch(e){ console.warn('save failed', e); }
  if (typeof scheduleFolderSave === 'function') scheduleFolderSave();
}
const clone = o => JSON.parse(JSON.stringify(o));

/** Wrap a mutation so the whole thing becomes ONE undo entry. */
function commit(label, fn){
  undoStack.push({ label, snap: clone(state) });
  if (undoStack.length > 60) undoStack.shift();
  redoStack = [];
  fn();
  invalidateSchedule();
  save();
  render();
  if (label) toast(label);
}
/**
 * A targeted undo entry, for typing. Cloning the whole state on every cell
 * focus would be wasteful, so a text edit records a pair of functions instead
 * of a snapshot. They look their target up by id rather than closing over the
 * object, because undoing a structural change swaps `state` for a fresh clone
 * and any captured reference would then be pointing at an orphan.
 */
function pushEdit(label, apply, invert){
  undoStack.push({ label, apply, invert });
  if (undoStack.length > 60) undoStack.shift();
  redoStack = [];
}
const setTitle = (id, v) => () => { const l = state.lessons[id]; if (l) l.title = v; };
const setCell  = (id, rowId, v) => () => { const l = state.lessons[id]; if (l) l.cells[rowId] = v; };

/** Live-edit a field, but bank ONE undo entry for the whole editing session. */
function bindEditable(node, read, setter, label){
  let before = null;
  node.addEventListener('focus', () => { before = read(); });
  node.addEventListener('blur', () => {
    const after = read();
    if (before !== null && after !== before)
      pushEdit(label, setter(before), setter(after));
    before = null;
  });
}

function undo(){
  if (!undoStack.length) return toast('Nothing to undo');
  const e = undoStack.pop();
  if (e.apply){
    redoStack.push({ label:e.label, apply:e.invert, invert:e.apply });
    e.apply();
  } else {
    redoStack.push({ label:'', snap: clone(state) });
    state = e.snap;
  }
  invalidateSchedule(); save(); render();
  toast('Undid: ' + (e.label || 'last change'));
}
function redo(){
  if (!redoStack.length) return toast('Nothing to redo');
  const e = redoStack.pop();
  if (e.apply){
    undoStack.push({ label:e.label, apply:e.invert, invert:e.apply });
    e.apply();
  } else {
    undoStack.push({ label:'', snap: clone(state) });
    state = e.snap;
  }
  invalidateSchedule(); save(); render();
  toast('Redone');
}

let toastTimer;
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('on'), 2400);
}

/* ═══════════════════════════════════════════════════════════════════
   SCHEDULE ENGINE
   ───────────────────────────────────────────────────────────────────
   Lessons have NO date. Each course owns an ordered array of lesson
   ids. We generate the dates a course meets, then lesson[i] lands on
   meetingDates[i]. Insert = splice; everything after re-projects onto
   later dates for free.

   A course meets on a date when ALL of these hold:
     · it's a weekday inside the school year
     · it isn't a school-wide holiday
     · it's inside the course's own start/end range
     · the weekday is one the course meets
     · the course hasn't marked that specific date "No Class"
   ═══════════════════════════════════════════════════════════════════ */

let _schoolDays = null, _schoolKey = '';

function holidayOn(date){
  return state.holidays.find(h => date >= h.date && date <= (h.endDate || h.date)) || null;
}

/** Every school-wide teaching day in the year. */
function schoolDays(){
  const key = state.yearStart + '|' + state.yearEnd + '|' + JSON.stringify(state.holidays);
  if (_schoolDays && _schoolKey === key) return _schoolDays;
  const out = [];
  for (let d = state.yearStart; d <= state.yearEnd; d = addDays(d,1)){
    if (!isWeekday(d)) continue;
    if (holidayOn(d)) continue;
    out.push(d);
  }
  _schoolDays = out; _schoolKey = key;
  return out;
}
const invalidateSchedule = () => { _schoolDays = null; };

const isCancelled = (course, date) => course.cancelled.some(x => x.date === date);

/** The dates this course meets, in order. */
function meetingDates(course){
  return schoolDays().filter(d =>
    d >= course.startDate && d <= course.endDate &&
    course.weekdays.includes(dow(d)) &&
    !isCancelled(course, d));
}
function meetingIndexByDate(course){
  const m = new Map();
  meetingDates(course).forEach((d,i) => m.set(d, i));
  return m;
}
function lessonOn(course, date){
  const idx = meetingIndexByDate(course).get(date);
  if (idx === undefined) return null;
  const id = course.lessons[idx];
  return id ? state.lessons[id] : null;
}
/** Lessons pushed past the end of the course's schedule. Never deleted. */
const overflowCount = course => Math.max(0, course.lessons.length - meetingDates(course).length);

function ensureLesson(course, idx){
  while (course.lessons.length <= idx){
    const id = uid();
    state.lessons[id] = { id, title:'', tag:'none', cells:{} };
    course.lessons.push(id);
  }
  return state.lessons[course.lessons[idx]];
}
const blankLesson = () => {
  const id = uid();
  state.lessons[id] = { id, title:'', tag:'none', cells:{} };
  return id;
};

/* ═══════════════════════════════════════════════════════════════════
   STRUCTURAL OPERATIONS — all of them array ops on course.lessons
   ═══════════════════════════════════════════════════════════════════ */

const insertDay = (c, i) =>
  commit('Day inserted · rest shifted', () => c.lessons.splice(i, 0, blankLesson()));

const removeDay = (c, i) =>
  commit('Day removed · gap closed', () => c.lessons.splice(i, 1));

const clearDay = (c, i) =>
  commit('Day cleared', () => {
    const l = state.lessons[c.lessons[i]];
    if (l){ l.title = ''; l.tag = 'none'; l.cells = {}; }
  });

const duplicateDay = (c, i) =>
  commit('Day duplicated', () => {
    const src = state.lessons[c.lessons[i]], id = uid();
    state.lessons[id] = { id, title:src.title, tag:src.tag, cells:clone(src.cells) };
    c.lessons.splice(i+1, 0, id);
  });

const swapDays = (c, a, b) =>
  commit('Days swapped', () => {
    const t = c.lessons[a]; c.lessons[a] = c.lessons[b]; c.lessons[b] = t;
  });

/** Extract at `from`, close the gap, re-insert at `to`. One atomic move. */
const moveDay = (c, from, to) =>
  commit('Day moved · rest shifted', () => {
    const [id] = c.lessons.splice(from, 1);
    c.lessons.splice(from < to ? to - 1 : to, 0, id);
  });

/** "No Class": drop this meeting for ONE course and ripple it forward. */
const cancelMeeting = (c, date) =>
  commit(`No Class ${fmtMed(date)} · ${c.name} shifted`, () => {
    if (!isCancelled(c, date)) c.cancelled.push({ date, reason:'No Class' });
  });

const restoreMeeting = (c, date) =>
  commit(`${fmtMed(date)} restored · ${c.name} shifted back`, () => {
    c.cancelled = c.cancelled.filter(x => x.date !== date);
  });

/* ═══════════════════════════════════════════════════════════════════
   UI STATE
   ═══════════════════════════════════════════════════════════════════ */

state = load();
ui = { view:'week', courseId: state.courses[0] ? state.courses[0].id : ALL, anchor:'' };
ui.anchor = clampToYear(iso(new Date()));

function clampToYear(d){
  if (d < state.yearStart) return state.yearStart;
  if (d > state.yearEnd)   return state.yearEnd;
  return d;
}
const isAll = () => ui.courseId === ALL;
function course(){
  return state.courses.find(c => c.id === ui.courseId) || state.courses[0] || null;
}

/* ═══════════════════════════════════════════════════════════════════
   RENDER
   ═══════════════════════════════════════════════════════════════════ */

const $ = id => document.getElementById(id);
const el = (tag, cls, txt) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (txt !== undefined) n.textContent = txt;
  return n;
};
const VIEWS = [['day','Day'],['week','Week'],['month','Month']];

function render(){
  /* Never rebuild the stage mid-gesture — it would destroy the column the
     pointer is captured on and the drag would die silently. */
  if (drag && drag.active) return;
  renderViews();
  renderTabs();
  renderPeriod();
  const stage = $('stage');
  stage.innerHTML = '';
  if (!state.courses.length) return renderFirstRun(stage);
  if (isAll()){
    ({ day:renderAllDay, week:renderAllWeek, month:renderAllMonth })[ui.view](stage);
  } else {
    ({ day:renderDay, week:renderWeek, month:renderMonth })[ui.view](stage);
  }
  paintSelection();
}

function renderFirstRun(stage){
  const box = el('div','empty-state');
  box.appendChild(el('b','','No classes yet'));
  box.appendChild(el('div','','Add each class you teach — its name, the days it meets, and the rows you plan against.'));
  const cta = el('button','cta','+ Add a class');
  cta.onclick = () => { openPanel('classes'); setTimeout(addCourse, 60); };
  box.appendChild(cta);
  const alt = el('div','alt');
  alt.appendChild(document.createTextNode('Already have a backup file? '));
  const imp = el('button','','Open it');
  imp.onclick = () => $('filepick').click();
  alt.appendChild(imp);
  box.appendChild(alt);
  stage.appendChild(box);
}

function renderViews(){
  const box = $('views'); box.innerHTML = '';
  VIEWS.forEach(([k,label]) => {
    const b = el('button', ui.view === k ? 'on' : '', label);
    b.onclick = () => { ui.view = k; render(); };
    box.appendChild(b);
  });
}

function renderTabs(){
  const box = $('tabs'); box.innerHTML = '';
  state.courses.forEach(c => {
    const t = el('button', 'tab' + (c.id === ui.courseId ? ' on' : ''));
    t.style.setProperty('--c', c.color);
    t.appendChild(el('span','dot'));
    t.appendChild(el('span','', c.name));
    t.onclick = () => { ui.courseId = c.id; render(); };
    box.appendChild(t);
  });
  if (state.courses.length){
    const t = el('button','tab sep' + (isAll() ? ' on' : ''));
    t.style.setProperty('--c','var(--muted)');
    const dots = el('span','dots');
    state.courses.slice(0,4).forEach(c => {
      const i = document.createElement('i');
      i.style.background = c.color;
      dots.appendChild(i);
    });
    t.appendChild(dots);
    t.appendChild(el('span','','All Classes'));
    t.onclick = () => { ui.courseId = ALL; render(); };
    box.appendChild(t);
  }
}

/** The anchor the Today button would set. Clamped into the school year, and
    snapped onto a weekday in day view — where a Saturday anchor renders an
    empty state rather than a lesson. */
function todayAnchor(){
  let d = clampToYear(iso(new Date()));
  if (ui.view === 'day')
    for (let i = 0; i < 7 && !isWeekday(d); i++) d = clampToYear(addDays(d, 1));
  return d;
}

/** The button is noise when pressing it wouldn't move anything. Asking that
    directly — rather than "is today inside the year" — is what makes it hide
    over the summer, and on a weekend in day view. */
function todayOnScreen(){
  const t = todayAnchor();
  if (ui.view === 'day') return ui.anchor === t;
  if (ui.view === 'month'){
    const a = parse(ui.anchor), d = parse(t);
    return a.getFullYear() === d.getFullYear() && a.getMonth() === d.getMonth();
  }
  return weekStart(ui.anchor) === weekStart(t);
}

function renderPeriod(){
  const p = $('period'); p.innerHTML = '';
  const c = isAll() ? null : course();
  let text = '', badge = '';

  if (ui.view === 'day'){
    text  = fmtDay(ui.anchor);
    badge = weekLabel(ui.anchor, c);
  } else if (ui.view === 'month'){
    const d = parse(ui.anchor);
    text  = `${MON[d.getMonth()]} ${d.getFullYear()}`;
    badge = termAbbr(termOn(ui.anchor, c));
  } else {
    const dates = weekDates(ui.anchor);
    text  = fmtRange(dates[0], dates[dates.length-1]);
    badge = weekLabel(dates[0], c);
  }
  p.appendChild(el('span','', text));
  if (badge) p.appendChild(el('span','wk', badge));

  $('today').style.display = todayOnScreen() ? 'none' : '';
  paintStorageBadge();

  const ob = $('overflow'); ob.innerHTML = '';
  if (c){
    const n = overflowCount(c);
    if (n > 0){
      const pill = el('div','overflowpill', `${n} lesson${n>1?'s':''} past the end`);
      pill.title = 'Kept, not deleted. Extend the class end date or remove days to pull them back in.';
      ob.appendChild(pill);
    }
  }
}

const weekDates = anchor => {
  const s = weekStart(anchor);
  return [0,1,2,3,4].map(i => addDays(s,i));
};

/* ─────────────────────────── WEEK (one class) ─────────────────────────── */

function renderWeek(stage){
  const c = course();
  const dates = weekDates(ui.anchor);
  const idxByDate = meetingIndexByDate(c);

  const grid = el('div','weekgrid');
  grid.style.setProperty('--rowh','66px');
  grid.style.setProperty('--headh','86px');
  grid.style.gridTemplateColumns = `168px repeat(${dates.length}, minmax(190px,1fr))`;

  /* Row labels */
  const labels = el('div','rowlabels');
  labels.appendChild(el('div','rl-spacer'));
  c.rows.forEach((r,ri) => labels.appendChild(rowLabel(c, r, ri)));
  const add = el('button','addrowmini','+ Row');
  add.title = 'Add a row to this class';
  add.onclick = () => commit('Row added', () => c.rows.push({ id:uid(), label:'New row' }));
  labels.appendChild(add);
  grid.appendChild(labels);

  /* Day columns */
  dates.forEach(date => {
    const hol = holidayOn(date);
    if (hol) return grid.appendChild(offColumn(hol.reason, fmtShort(date)));

    if (isCancelled(c, date)){
      const col = offColumn('No Class', fmtShort(date));
      const b = el('button','','Restore');
      b.onclick = () => restoreMeeting(c, date);
      col.firstChild.appendChild(b);
      return grid.appendChild(col);
    }
    const idx = idxByDate.get(date);
    if (idx === undefined)
      return grid.appendChild(offColumn('No Class', fmtShort(date)));

    grid.appendChild(dayColumn(c, date, idx));
  });

  stage.appendChild(grid);
}

/* ─────────────────────────── Editable cells ───────────────────────────
   Pasting from Word or Google Docs carries inline styles, font tags and
   class names that wreck the grid's typography and bloat the file. Keep the
   handful of tags the toolbar can actually produce; unwrap everything else.
   ─────────────────────────────────────────────────────────────────────── */

const PASTE_KEEP = new Set(['B','STRONG','I','EM','U','UL','OL','LI','BR','P','DIV']);
const PASTE_DROP = new Set(['SCRIPT','STYLE','HEAD','TITLE','META','LINK']);

function cleanPaste(html){
  const box = document.createElement('div');
  box.innerHTML = html;                       // innerHTML never runs scripts
  box.querySelectorAll([...PASTE_DROP].join(',')).forEach(n => n.remove());
  /* Static list, walked in document order — unwrapped children stay in it
     and still get visited, so nested junk is stripped too. */
  box.querySelectorAll('*').forEach(n => {
    if (!PASTE_KEEP.has(n.tagName)) return n.replaceWith(...n.childNodes);
    [...n.attributes].forEach(a => n.removeAttribute(a.name));
  });
  return box.innerHTML;
}
const escapeHtml = s => s.replace(/[&<>]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[ch]));

/** Everything a rich-text cell needs: content, live save, undo, clean paste. */
function makeCell(lesson, rowId, cls){
  const cell = el('div', cls || 'cell');
  cell.contentEditable = 'true';
  cell.innerHTML = lesson.cells[rowId] || '';
  cell.dataset.row = rowId;
  cell.oninput = () => { lesson.cells[rowId] = cell.innerHTML; save(); };
  cell.onfocus = () => showFmt(cell);
  cell.onblur  = () => hideFmt();
  cell.addEventListener('paste', e => {
    e.preventDefault();
    const cd = e.clipboardData;
    const html = cd.getData('text/html');
    document.execCommand('insertHTML', false,
      html ? cleanPaste(html) : escapeHtml(cd.getData('text/plain')).replace(/\n/g,'<br>'));
  });
  bindEditable(cell, () => cell.innerHTML, v => setCell(lesson.id, rowId, v), 'Cell edited');
  return cell;
}

/** The lesson-concept input, with the same one-entry-per-session undo. */
function makeTitle(lesson){
  const title = document.createElement('input');
  title.className = 'title';
  title.value = lesson.title || '';
  title.placeholder = 'Lesson concept…';
  title.oninput = () => { lesson.title = title.value; save(); };
  bindEditable(title, () => title.value, v => setTitle(lesson.id, v), 'Concept edited');
  return title;
}

function offColumn(title, sub){
  const col = el('div','daycol');
  const box = el('div','offcol');
  box.appendChild(el('b','', title));
  box.appendChild(el('span','', sub));
  col.appendChild(box);
  return col;
}

function rowLabel(c, r, ri){
  const rl = el('div','rowlabel');
  rl.draggable = true;
  rl.appendChild(el('span','grip','⋮⋮'));
  const txt = el('span','txt', r.label);
  txt.contentEditable = 'true';
  txt.style.outline = 'none';
  txt.onblur = () => {
    const v = txt.textContent.trim();
    if (v && v !== r.label) commit('Row renamed', () => { r.label = v; });
    else txt.textContent = r.label;
  };
  txt.onkeydown = e => { if (e.key === 'Enter'){ e.preventDefault(); txt.blur(); } };
  rl.appendChild(txt);
  const x = el('button','x','×');
  x.title = 'Delete row';
  x.onclick = e => {
    e.stopPropagation();
    commit('Row deleted', () => c.rows.splice(ri,1));
  };
  rl.appendChild(x);

  rl.ondragstart = e => {
    e.dataTransfer.setData('text/row', String(ri));
    e.dataTransfer.effectAllowed = 'move';
    rl.classList.add('dragging');
  };
  rl.ondragend   = () => rl.classList.remove('dragging');
  rl.ondragover  = e => {
    if (!e.dataTransfer.types.includes('text/row')) return;
    e.preventDefault(); rl.classList.add('over');
  };
  rl.ondragleave = () => rl.classList.remove('over');
  rl.ondrop = e => {
    e.preventDefault(); rl.classList.remove('over');
    const from = Number(e.dataTransfer.getData('text/row'));
    if (from === ri) return;
    commit('Reordered rows', () => {
      const [m] = c.rows.splice(from,1);
      c.rows.splice(ri,0,m);
    });
  };
  return rl;
}

function dayColumn(c, date, idx){
  const lesson = ensureLesson(c, idx);
  const col = el('div','daycol');
  col.dataset.idx  = String(idx);
  col.dataset.date = date;

  const head = el('div','dayhead');
  const top = el('div','top');
  top.appendChild(el('span','dow', DOW3[dow(date)]));
  top.appendChild(el('span','date', fmtShort(date)));
  head.appendChild(top);

  head.appendChild(makeTitle(lesson));

  const tagrow = el('div','tagrow');
  const pill = el('button','tagpill' + (lesson.tag === 'none' ? ' none' : ''),
                  lesson.tag === 'none' ? '+ tag' : TAGS[lesson.tag].label);
  pill.style.setProperty('--t', TAGS[lesson.tag].color);
  pill.onclick = e => { e.stopPropagation(); openTagMenu(e, c, idx, date); };
  tagrow.appendChild(pill);
  head.appendChild(tagrow);

  const grip = el('button','grip','⋮⋮');
  grip.title = 'Drag to move this day';
  head.appendChild(grip);

  const more = el('button','more','⋯');
  more.onclick = e => { e.stopPropagation(); openDayMenu(e, c, idx, date); };
  head.appendChild(more);
  head.oncontextmenu = e => { e.preventDefault(); openDayMenu(e, c, idx, date); };

  col.appendChild(head);

  c.rows.forEach(r => {
    const cell = makeCell(lesson, r.id);
    cell.oncontextmenu = e => { e.preventDefault(); openCellMenu(e, c, idx, r); };
    col.appendChild(cell);
  });

  /* Drag starts from the grip, or from empty space in the header. One
     listener on the header covers both — the grip is inside it, so binding
     the grip separately would fire beginDrag twice for the same press.
     Shift is reserved for range selection, so it must not start a drag. */
  head.addEventListener('pointerdown', e => {
    if (e.shiftKey) return;
    if (e.target.closest('input, .more, .tagpill')) return;
    beginDrag(e, c, col);
  });
  head.addEventListener('click', e => {
    if (!e.shiftKey || e.target.closest('input, .more, .tagpill')) return;
    e.preventDefault();
    extendSelection(c, idx);
  });

  return col;
}

/* ═══════════════════════════════════════════════════════════════════
   DAY DRAG — pointer events, geometry-based targeting.

   The old version used HTML5 drag-and-drop. Every day column holds
   several contenteditable cells, and dragover/dragleave fire per
   ELEMENT, so crossing from the header into a cell fired dragleave and
   wiped the drop indicator mid-aim. relatedTarget is routinely null
   during a native drag, so the guard against that failed open. Result:
   a flickering target that only sometimes accepted the drop.

   Here nothing is hit-tested. We measure the columns on every move and
   decide purely from the cursor's x position, so the cells underneath
   are irrelevant and the indicator cannot flicker.

     · within 22px of a boundary between days  → INSERT there
     · anywhere else inside a day              → SWAP with that day
   ═══════════════════════════════════════════════════════════════════ */

const GUTTER = 24;        // half-width of an insert zone, px — fixed, not a %
const THRESHOLD = 5;      // px of movement before a drag actually starts
const EDGE = 64;          // autoscroll trigger distance from the stage edge
const HYST = 8;           // px you must overshoot a boundary to change your mind

let drag = null;

function beginDrag(e, c, col){
  if (e.button !== 0 || drag) return;
  e.preventDefault();
  drag = {
    course: c,
    fromIdx: Number(col.dataset.idx),
    col,
    x0: e.clientX, y0: e.clientY,
    px: e.clientX, py: e.clientY,
    active: false, target: null, geo: null, raf: 0,
    pointerId: e.pointerId,
  };
  window.addEventListener('pointermove', onDragMove);
  window.addEventListener('pointerup', onDragEnd);
  window.addEventListener('pointercancel', cancelDrag);
  window.addEventListener('blur', cancelDrag);
}

/* Moves only record the cursor. All measuring and painting happens in the
   frame loop, so the indicator keeps updating while the pointer is parked
   at a screen edge and the view scrolls underneath it. */
function onDragMove(e){
  if (!drag) return;
  drag.px = e.clientX; drag.py = e.clientY;
  if (!drag.active &&
      Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0) >= THRESHOLD) activateDrag();
}

function activateDrag(){
  drag.active = true;
  document.body.classList.add('dragging');
  drag.col.classList.add('drag-src');

  const head = drag.col.querySelector('.dayhead');
  const r = head.getBoundingClientRect();
  const ghost = $('dragGhost');
  ghost.innerHTML = '';
  const cl = head.cloneNode(true);
  cl.style.width = r.width + 'px';
  cl.style.height = r.height + 'px';
  cl.style.margin = '0';
  ghost.appendChild(cl);
  ghost.style.width = r.width + 'px';
  ghost.style.display = 'block';
  ghost.dataset.dx = String(drag.x0 - r.left);   // grab it where it was grabbed,
  ghost.dataset.dy = String(drag.y0 - r.top);    // so it doesn't jump under the hand
  $('dragCaret').classList.remove('slide');      // first placement shouldn't animate
  drag.raf = requestAnimationFrame(dragFrame);
}

function dragFrame(){
  if (!drag || !drag.active) return;
  autoScroll(drag.px);
  drag.geo = columnGeometry();
  drag.target = resolveTarget(drag.px, drag.target, drag.geo);
  paintDrag(drag.px, drag.py, drag.geo);
  drag.raf = requestAnimationFrame(dragFrame);
}

/** Measure every droppable day column. Holiday and no-class columns carry no
    data-idx, so they're invisible here and can never be a swap target. */
function columnGeometry(){
  return [...document.querySelectorAll('.daycol[data-idx]')].map(n => {
    const r = n.getBoundingClientRect();
    return { idx:Number(n.dataset.idx), date:n.dataset.date, node:n,
             left:r.left, right:r.right, top:r.top, bottom:r.bottom };
  }).sort((a,b) => a.left - b.left);
}

/**
 * Decide what a drop at this x means, purely from geometry — nothing is
 * hit-tested, so the contenteditable cells underneath are irrelevant.
 *
 *   { kind:'insert', at, cx }  — sequence index to insert before
 *   { kind:'swap', idx, node } — sequence index to exchange with
 *   noop:true                  — resolves to no change; commits nothing
 *
 * Each result carries the x range [lo,hi] it owns. A decision keeps its
 * territory plus HYST px, so the target doesn't flip back and forth while
 * you're hovering near a boundary trying to release.
 */
function resolveTarget(x, prev, cols){
  if (!cols.length) return null;
  if (prev && prev.lo !== undefined && x >= prev.lo - HYST && x <= prev.hi + HYST) return prev;

  // Boundaries: before the first column, between each pair, after the last.
  const bounds = [{ x: cols[0].left, at: cols[0].idx }];
  for (let i = 1; i < cols.length; i++)
    bounds.push({ x:(cols[i-1].right + cols[i].left)/2, at: cols[i].idx });
  bounds.push({ x: cols[cols.length-1].right, at: cols[cols.length-1].idx + 1 });

  let best = null;
  bounds.forEach(b => {
    const d = Math.abs(x - b.x);
    if (d <= GUTTER && (!best || d < best.d)) best = b;
  });
  if (best) return {
    kind:'insert', at:best.at, cx:best.x,
    lo:best.x - GUTTER, hi:best.x + GUTTER,
    noop: best.at === drag.fromIdx || best.at === drag.fromIdx + 1,
  };

  const hit = cols.find(c => x >= c.left && x <= c.right);
  if (!hit) return null;
  return {
    kind:'swap', idx:hit.idx, date:hit.date, node:hit.node,
    lo:hit.left + GUTTER, hi:hit.right - GUTTER,
    noop: hit.idx === drag.fromIdx,
  };
}

function paintDrag(x, y, cols){
  const ghost = $('dragGhost'), caret = $('dragCaret'), label = $('dragLabel');
  ghost.style.left = (x - Number(ghost.dataset.dx)) + 'px';
  ghost.style.top  = (y - Number(ghost.dataset.dy)) + 'px';

  const t = drag.target;
  const lit = t && t.kind === 'swap' && !t.noop ? t.node : null;
  document.querySelectorAll('.swap-target').forEach(n => {
    if (n !== lit) n.classList.remove('swap-target');
  });
  if (lit) lit.classList.add('swap-target');

  let text = 'Release to cancel', sub = '';
  if (t && t.kind === 'insert'){
    const top = Math.min(...cols.map(c => c.top));
    const bot = Math.max(...cols.map(c => c.bottom));
    caret.style.display = 'block';
    caret.style.left = (t.cx - 1.5) + 'px';
    caret.style.top = top + 'px';
    caret.style.height = (bot - top) + 'px';
    caret.style.opacity = t.noop ? '.28' : '1';
    requestAnimationFrame(() => caret.classList.add('slide'));
    text = t.noop ? 'Back where it started' : 'Insert here';
    sub  = t.noop ? '' : 'rest shifts forward one meeting';
  } else {
    caret.style.display = 'none';
    caret.classList.remove('slide');
    if (t && t.kind === 'swap')
      text = t.noop ? 'Back where it started'
                    : 'Swap with ' + DOW3[dow(t.date)] + ' ' + fmtShort(t.date);
  }

  label.innerHTML = '';
  label.appendChild(el('div','', text));
  if (sub) label.appendChild(el('div','sub', sub));
  label.classList.toggle('dim', !t || t.noop);
  label.style.display = 'block';
  const lw = label.offsetWidth;
  label.style.left = Math.min(Math.max(8, x + 16), innerWidth - lw - 8) + 'px';
  label.style.top  = Math.min(y + 22, innerHeight - label.offsetHeight - 8) + 'px';
}

function autoScroll(x){
  const stage = $('stage'), r = stage.getBoundingClientRect();
  if (x < r.left + EDGE)       stage.scrollLeft -= Math.min(26, Math.max(3, (r.left + EDGE - x) / 2.5));
  else if (x > r.right - EDGE) stage.scrollLeft += Math.min(26, Math.max(3, (x - (r.right - EDGE)) / 2.5));
}

function onDragEnd(){
  if (!drag) return;
  const { active, target, course:c, fromIdx } = drag;
  teardownDrag();
  if (!active || !target || target.noop) return;
  if (target.kind === 'insert') moveDay(c, fromIdx, target.at);
  else if (target.kind === 'swap') swapDays(c, fromIdx, target.idx);
}

function cancelDrag(){
  if (!drag) return;
  const wasActive = drag.active;
  teardownDrag();
  if (wasActive) toast('Move cancelled');
}

function teardownDrag(){
  if (drag && drag.raf) cancelAnimationFrame(drag.raf);
  window.removeEventListener('pointermove', onDragMove);
  window.removeEventListener('pointerup', onDragEnd);
  window.removeEventListener('pointercancel', cancelDrag);
  window.removeEventListener('blur', cancelDrag);
  document.body.classList.remove('dragging');
  if (drag && drag.col) drag.col.classList.remove('drag-src');
  document.querySelectorAll('.swap-target').forEach(n => n.classList.remove('swap-target'));
  $('dragGhost').style.display = 'none';
  $('dragCaret').style.display = 'none';
  $('dragCaret').classList.remove('slide');
  $('dragLabel').style.display = 'none';
  drag = null;
}

/* ─────────────────────────── DAY (one class) ─────────────────────────── */

function renderDay(stage){
  const c = course(), date = ui.anchor;
  const wrap = el('div','dayview');
  const hol = holidayOn(date);

  const bail = (title, sub, extra) => {
    const card = el('div','card'), es = el('div','empty-state');
    es.appendChild(el('b','', title));
    es.appendChild(el('div','', sub));
    if (extra) es.appendChild(extra);
    card.appendChild(es); wrap.appendChild(card); stage.appendChild(wrap);
  };

  if (hol) return bail(hol.reason, 'No school');
  if (isCancelled(c, date)){
    const b = el('button','cta','Restore');
    b.onclick = () => restoreMeeting(c, date);
    return bail('No Class', 'Lessons shifted forward', b);
  }
  if (date < c.startDate) return bail('Not started', `Begins ${fmtMed(c.startDate)}`);
  if (date > c.endDate)   return bail('Finished', `Ended ${fmtMed(c.endDate)}`);

  const idx = meetingIndexByDate(c).get(date);
  if (idx === undefined)
    return bail('No Class', `Meets ${c.weekdays.map(w => DOW3[w]).join(' ')}`);

  const lesson = ensureLesson(c, idx);
  const card = el('div','card');
  const hd = el('div','hd');
  hd.appendChild(el('h2','', fmtLong(date)));
  hd.appendChild(el('span','note','lesson #' + (idx+1)));
  hd.appendChild(el('div','spacer'));
  const pill = el('button','tagpill' + (lesson.tag === 'none' ? ' none' : ''),
                  lesson.tag === 'none' ? '+ tag' : TAGS[lesson.tag].label);
  pill.style.setProperty('--t', TAGS[lesson.tag].color);
  pill.onclick = e => openTagMenu(e, c, idx, date);
  hd.appendChild(pill);
  card.appendChild(hd);

  card.appendChild(makeTitle(lesson));
  wrap.appendChild(card);

  c.rows.forEach(r => {
    const box = el('div','card');
    box.appendChild(el('div','lbl', r.label));
    box.appendChild(makeCell(lesson, r.id));
    wrap.appendChild(box);
  });
  stage.appendChild(wrap);
}

/* ─────────────────────────── MONTH (one class) ─────────────────────────── */

function monthCells(anchor){
  const d = parse(anchor);
  const first = new Date(d.getFullYear(), d.getMonth(), 1);
  const last  = new Date(d.getFullYear(), d.getMonth()+1, 0);
  const fw = new Date(first);
  while (fw.getDay() === 0 || fw.getDay() === 6) fw.setDate(fw.getDate()+1);
  const lead = fw.getDay() - 1;                      // Mon → 0 … Fri → 4
  const days = [];
  for (let dd = new Date(first); dd <= last; dd.setDate(dd.getDate()+1)){
    const s = iso(dd);
    if (isWeekday(s)) days.push(s);
  }
  return { lead, days };
}

function renderMonth(stage){
  const c = course();
  const { lead, days } = monthCells(ui.anchor);
  const idxByDate = meetingIndexByDate(c);
  const today = iso(new Date());

  const grid = el('div','month');
  ['Mon','Tue','Wed','Thu','Fri'].forEach(n => grid.appendChild(el('div','dow', n)));
  for (let i = 0; i < lead; i++) grid.appendChild(el('div','mcell off'));

  days.forEach(date => {
    const cell = el('div','mcell' + (date === today ? ' today' : ''));
    const hol = holidayOn(date);
    if (hol){
      cell.classList.add('hol');
      cell.appendChild(el('div','n', String(parse(date).getDate())));
      cell.appendChild(el('div','hn', hol.reason));
      return grid.appendChild(cell);
    }
    const idx = idxByDate.get(date);
    if (idx === undefined){
      cell.classList.add('off');
      cell.appendChild(el('div','n', String(parse(date).getDate())));
      if (isCancelled(c, date)) cell.appendChild(el('div','hn','No Class'));
      return grid.appendChild(cell);
    }
    const lesson = state.lessons[c.lessons[idx]];
    if (lesson && lesson.tag !== 'none'){
      const bar = el('div','bar');
      bar.style.setProperty('--t', TAGS[lesson.tag].color);
      cell.appendChild(bar);
    }
    cell.appendChild(el('div','n', String(parse(date).getDate())));
    cell.appendChild(el('div','t', lesson && lesson.title ? lesson.title : ''));
    cell.dataset.idx = String(idx);
    cell.onclick = e => {
      /* Month view is where a semester gets blocked out, so range-select
         belongs here as much as in the week grid. */
      if (e.shiftKey){ e.preventDefault(); return extendSelection(c, idx); }
      ui.anchor = date; ui.view = 'day'; render();
    };
    grid.appendChild(cell);
  });
  stage.appendChild(grid);
}

/* ─────────────────────────── ALL CLASSES ───────────────────────────
   Week: rows = classes, columns = weekdays, concept + tag.
   Month: chips only — built for spotting assessment collisions.
   Day: what every class is doing on one date.
   ─────────────────────────────────────────────────────────────────── */

/** A badge for a class: the number in its name ("Grade 7" → 7), else initials. */
function shortLabel(name){
  const m = String(name).match(/\d+/);
  if (m) return m[0];
  const letters = String(name).replace(/[^A-Za-z]/g,'');
  return (letters.slice(0,2) || '?').toUpperCase();
}

/* The class tab bar above already maps colour to name, so the legend only
   has to explain the marks. */
function classLegend(){
  const box = el('div','legend');
  box.appendChild(el('div','k',
    'Coloured dot = tagged · ruled line = not planned yet · ⚠ = two or more assessments'));
  return box;
}

/** How many classes have a test or quiz on this date. */
function collisionsOn(date){
  return state.courses.filter(c => {
    const l = lessonOn(c, date);
    return l && ASSESSMENT.has(l.tag);
  }).length;
}

function renderAllMonth(stage){
  const { lead, days } = monthCells(ui.anchor);
  const today = iso(new Date());
  stage.appendChild(classLegend());

  const grid = el('div','month');
  ['Mon','Tue','Wed','Thu','Fri'].forEach(n => grid.appendChild(el('div','dow', n)));
  for (let i = 0; i < lead; i++) grid.appendChild(el('div','mcell off multi'));

  days.forEach(date => {
    const cell = el('div','mcell multi' + (date === today ? ' today' : ''));
    const hol = holidayOn(date);
    if (hol){
      cell.classList.add('hol');
      cell.appendChild(el('div','n', String(parse(date).getDate())));
      cell.appendChild(el('div','hn', hol.reason));
      return grid.appendChild(cell);
    }

    const hits = collisionsOn(date);
    if (hits >= 2) cell.classList.add('collide');

    const nrow = el('div','nrow');
    nrow.appendChild(el('div','n', String(parse(date).getDate())));
    if (hits >= 2){
      const w = el('div','warn');
      w.textContent = '⚠ ' + hits;
      w.title = hits + ' classes have a test or quiz on this day';
      nrow.appendChild(w);
    }
    cell.appendChild(nrow);

    state.courses.forEach(c => {
      const row = el('div','mrow');
      const badge = el('div','mc', shortLabel(c.name));
      badge.style.setProperty('--c', c.color);
      row.appendChild(badge);

      const dot = el('div','md no');
      row.appendChild(dot);

      if (date < c.startDate || date > c.endDate){
        row.classList.add('void');
        row.appendChild(el('div','mt blank'));
        row.title = `${c.name} · not running`;
      } else if (isCancelled(c, date)){
        row.appendChild(el('div','mt nc','No Class'));
        row.title = `${c.name} · No Class`;
      } else {
        const l = lessonOn(c, date);
        if (!l){
          row.classList.add('absent');
          row.appendChild(el('div','mt blank'));
          row.title = `${c.name} · No Class`;
        } else {
          if (l.tag !== 'none'){
            dot.classList.remove('no');
            dot.style.setProperty('--t', TAGS[l.tag].color);
            row.style.setProperty('--w',
              `color-mix(in srgb, ${TAGS[l.tag].color} 12%, transparent)`);
          }
          row.appendChild(l.title ? el('div','mt', l.title) : el('div','mt blank'));
          row.title = `${c.name} · ${l.title || 'Not planned'}` +
                      (l.tag !== 'none' ? ` · ${TAGS[l.tag].label}` : '');
          row.classList.add('live');
          row.onclick = ev => {
            ev.stopPropagation();
            ui.courseId = c.id; ui.anchor = date; ui.view = 'day'; render();
          };
        }
      }
      cell.appendChild(row);
    });
    grid.appendChild(cell);
  });
  stage.appendChild(grid);
}

function renderAllWeek(stage){
  const dates = weekDates(ui.anchor);
  const grid = el('div','ovgrid');
  grid.style.gridTemplateColumns = `150px repeat(${dates.length}, minmax(140px,1fr))`;

  grid.appendChild(el('div',''));
  dates.forEach(date => {
    const h = el('div','ovhead');
    h.appendChild(document.createTextNode(DOW3[dow(date)]));
    const hol = holidayOn(date);
    h.appendChild(el('small','', hol ? hol.reason : fmtShort(date)));
    grid.appendChild(h);
  });

  state.courses.forEach(c => {
    const label = el('div','ovclass');
    label.style.setProperty('--c', c.color);
    label.appendChild(el('span','', c.name));
    label.onclick = () => { ui.courseId = c.id; ui.view = 'week'; render(); };
    grid.appendChild(label);

    const idxByDate = meetingIndexByDate(c);
    dates.forEach(date => {
      const hol = holidayOn(date);
      const idx = idxByDate.get(date);
      if (hol || idx === undefined){
        const cell = el('div','ovcell empty');
        cell.appendChild(el('div','t', hol ? '—' : 'No Class'));
        return grid.appendChild(cell);
      }
      const lesson = state.lessons[c.lessons[idx]];
      const cell = el('div','ovcell');
      if (lesson && lesson.tag !== 'none'){
        const p = el('span','tagpill', TAGS[lesson.tag].label);
        p.style.setProperty('--t', TAGS[lesson.tag].color);
        p.style.alignSelf = 'flex-start';
        cell.appendChild(p);
      }
      /* An unplanned meeting is a ruled blank, not the word "Untitled". */
      cell.appendChild(lesson && lesson.title
        ? el('div','t', lesson.title) : el('div','t blank'));
      cell.onclick = () => { ui.courseId = c.id; ui.anchor = date; ui.view = 'day'; render(); };
      grid.appendChild(cell);
    });
  });
  stage.appendChild(grid);
}

function renderAllDay(stage){
  const date = ui.anchor;
  const wrap = el('div','dayview');
  const hol = holidayOn(date);
  if (hol){
    const card = el('div','card'), es = el('div','empty-state');
    es.appendChild(el('b','', hol.reason));
    es.appendChild(el('div','','No school'));
    card.appendChild(es); wrap.appendChild(card); stage.appendChild(wrap); return;
  }
  state.courses.forEach(c => {
    const card = el('div','card cls');
    card.style.setProperty('--c', c.color);
    const hd = el('div','hd');
    hd.appendChild(el('h2','', c.name));
    hd.appendChild(el('div','spacer'));
    const l = lessonOn(c, date);
    if (l && l.tag !== 'none'){
      const p = el('span','tagpill', TAGS[l.tag].label);
      p.style.setProperty('--t', TAGS[l.tag].color);
      hd.appendChild(p);
    }
    card.appendChild(hd);
    if (!l){
      card.appendChild(el('div','note',
        date < c.startDate ? 'Not started'
        : date > c.endDate ? 'Finished'
        : 'No Class'));
    } else {
      card.appendChild(el('div','title', l.title || ''));
      c.rows.forEach(r => {
        const html = l.cells[r.id];
        if (!html || !html.replace(/<[^>]*>/g,'').trim()) return;
        card.appendChild(el('div','lbl', r.label));
        const body = el('div','');
        body.innerHTML = html;
        body.style.fontSize = '13px';
        card.appendChild(body);
      });
      card.onclick = () => { ui.courseId = c.id; ui.view = 'day'; render(); };
      card.style.cursor = 'pointer';
    }
    wrap.appendChild(card);
  });
  stage.appendChild(wrap);
}

/** At the cursor, or hung under an anchor element when there's one. */
function placeMenu(e, anchor){
  const m = $('menu');
  m.classList.add('on');
  const r = m.getBoundingClientRect();
  let x, y;
  if (anchor){
    const a = anchor.getBoundingClientRect();
    x = a.right - r.width; y = a.bottom + 6;
  } else {
    x = e.clientX ?? 0; y = e.clientY ?? 0;
  }
  if (x + r.width  > innerWidth  - 8) x = innerWidth  - r.width  - 8;
  if (y + r.height > innerHeight - 8) y = innerHeight - r.height - 8;
  m.style.left = Math.max(8, x) + 'px'; m.style.top = Math.max(8, y) + 'px';
}

/** Everything that used to be an unlabelled icon, with its name on it. */
function openMoreMenu(e){
  const m = $('menu'); m.innerHTML = '';
  m.appendChild(el('div','sec','Planner'));
  menuItem(m, 'Classes & settings', () => openPanel('classes'), '',
           'Classes, meeting days, rows, terms, holidays');
  menuItem(m, 'Help & shortcuts', () => openPanel('help'));
  m.appendChild(document.createElement('hr'));
  m.appendChild(el('div','sec','Share & back up'));
  menuItem(m, 'Export to Excel…', () => openPanel('export'), '',
           'A range of dates, for sharing');
  menuItem(m, 'Export for AI…', () => openPanel('ai'), '',
           'Readable JSON you can hand to Claude');
  menuItem(m, 'Save a backup file', exportJson, '', 'Everything, as JSON');
  menuItem(m, 'Open a backup file…', () => $('filepick').click());
  m.appendChild(document.createElement('hr'));
  menuItem(m, 'Where plans are saved…', () => openPanel('storage'), '',
           dirHandle ? dirHandle.name : 'This browser only — not backed up');
  placeMenu(e, $('btnMore'));
}
const closeMenu = () => $('menu').classList.remove('on');

function menuItem(m, label, fn, cls, sub){
  const b = el('button', cls || '');
  if (sub){
    const col = el('div','col');
    col.appendChild(el('span','', label));
    col.appendChild(el('small','', sub));
    b.appendChild(col);
  } else b.textContent = label;
  b.onclick = () => { closeMenu(); fn(); };
  m.appendChild(b);
  return b;
}

function openDayMenu(e, c, idx, date){
  const m = $('menu'); m.innerHTML = '';
  m.appendChild(el('div','sec', `${DOW3[dow(date)]} ${fmtShort(date)} · lesson ${idx+1}`));
  menuItem(m, 'Insert day before', () => insertDay(c, idx));
  menuItem(m, 'Insert day after',  () => insertDay(c, idx+1));
  m.appendChild(document.createElement('hr'));
  /* The same moves as dragging, without the gesture — always available. */
  if (idx > 0)
    menuItem(m, 'Swap with previous day', () => swapDays(c, idx-1, idx));
  if (idx < c.lessons.length - 1)
    menuItem(m, 'Swap with next day',     () => swapDays(c, idx, idx+1));
  m.appendChild(document.createElement('hr'));
  menuItem(m, 'Duplicate day', () => duplicateDay(c, idx));
  m.appendChild(document.createElement('hr'));
  menuItem(m, 'Clear day', () => clearDay(c, idx), '', 'Keeps the meeting, wipes the plan');
  menuItem(m, 'Remove day', () => removeDay(c, idx), 'danger', 'Everything after slides back');
  m.appendChild(document.createElement('hr'));
  menuItem(m, 'Mark “No Class”', () => cancelMeeting(c, date), '', `${c.name} skips this date`);
  if (state.courses.length > 1){
    m.appendChild(document.createElement('hr'));
    m.appendChild(el('div','sec','Copy this day to'));
    state.courses.filter(x => x.id !== c.id).forEach(other =>
      menuItem(m, other.name, () => copyDayTo(c, idx, other, date)));
  }
  placeMenu(e);
}

function openTagMenu(e, c, idx, date){
  const m = $('menu'); m.innerHTML = '';
  m.appendChild(el('div','sec','Tag this day'));
  Object.entries(TAGS).forEach(([k,t]) => {
    const b = el('button','');
    const sw = el('span','sw' + (k === 'none' ? ' none' : ''));
    sw.style.setProperty('--t', t.color);
    b.appendChild(sw);
    b.appendChild(document.createTextNode(t.label));
    b.onclick = () => {
      closeMenu();
      commit(k === 'none' ? 'Tag cleared' : 'Tagged ' + t.label,
             () => { ensureLesson(c, idx).tag = k; });
    };
    m.appendChild(b);
  });
  m.appendChild(document.createElement('hr'));
  menuItem(m, 'Mark “No Class”', () => cancelMeeting(c, date), '', `${c.name} skips this date`);
  placeMenu(e);
}

let fmtTarget = null, fmtHideTimer;
function showFmt(cell){
  clearTimeout(fmtHideTimer);
  fmtTarget = cell;
  const f = $('fmt');
  f.classList.add('on');
  const r = cell.getBoundingClientRect();
  let top = r.top - 36;
  if (top < 8) top = r.bottom + 6;
  f.style.top = top + 'px';
  f.style.left = Math.min(r.left, innerWidth - 150) + 'px';
}
function hideFmt(){
  fmtHideTimer = setTimeout(() => { $('fmt').classList.remove('on'); fmtTarget = null; }, 140);
}
$('fmt').addEventListener('mousedown', e => {
  e.preventDefault();                              // keep focus in the cell
  const cmd = e.target.closest('button')?.dataset.cmd;
  if (!cmd || !fmtTarget) return;
  document.execCommand(cmd, false, null);
  fmtTarget.dispatchEvent(new Event('input'));
});

let panelTab = 'classes', editingId = null;

function openPanel(tab){
  panelTab = tab || panelTab;
  const p = $('panel'); p.innerHTML = '';
  $('scrim').classList.add('on'); p.classList.add('on');

  const hd = el('div','');
  hd.style.display = 'flex'; hd.style.alignItems = 'center'; hd.style.gap = '10px';
  hd.appendChild(el('h3','',
    panelTab === 'help'    ? 'Help & shortcuts'     :
    panelTab === 'export'  ? 'Export to Excel'      :
    panelTab === 'ai'      ? 'Export for AI'        :
    panelTab === 'storage' ? 'Where plans are saved' : 'Classes & settings'));
  const close = el('button','iconbtn','Close');
  close.style.marginLeft = 'auto';
  close.onclick = closePanel;
  hd.appendChild(close);
  p.appendChild(hd);

  if (panelTab === 'help')    return renderHelp(p);
  if (panelTab === 'export')  return renderExportPanel(p);
  if (panelTab === 'ai')      return renderAiPanel(p);
  if (panelTab === 'storage') return renderStoragePanel(p);
  renderClassesPanel(p);
  p.appendChild(document.createElement('hr'));
  renderCalendarPanel(p);
  p.appendChild(document.createElement('hr'));
  renderStoragePanel(p);
}
function closePanel(){
  $('panel').classList.remove('on');
  $('scrim').classList.remove('on');
}

function addCourse(){
  const id = uid();
  commit('Class added', () => {
    state.courses.push({
      id, name:'New class', color: PALETTE[state.courses.length % PALETTE.length],
      weekdays:[...WEEKDAYS], rows: mkRows(['Homework Due','Opener','Procedure']),
      startDate: state.yearStart, endDate: state.yearEnd, terms:null, cancelled:[], lessons:[],
    });
    ui.courseId = id;
  });
  editingId = id;
  openPanel('classes');
}


function renderClassesPanel(p){
  const g = el('div','grp');
  g.appendChild(el('label','','Classes'));
  const list = el('div','clslist');
  state.courses.forEach(c => {
    const item = el('div','clsitem' + (c.id === editingId ? ' on' : ''));
    item.style.setProperty('--c', c.color);
    item.appendChild(el('span','dot'));
    item.appendChild(el('span','', c.name));
    item.appendChild(el('span','meta',
      c.weekdays.length ? c.weekdays.map(w => DOW3[w][0]).join('') : 'never'));
    item.onclick = () => { editingId = (editingId === c.id ? null : c.id); openPanel('classes'); };
    list.appendChild(item);
  });
  g.appendChild(list);
  const add = el('button','iconbtn','+ Add a class');
  add.onclick = addCourse;
  g.appendChild(add);

  p.appendChild(g);

  const c = state.courses.find(x => x.id === editingId);
  if (!c) return;
  p.appendChild(document.createElement('hr'));
