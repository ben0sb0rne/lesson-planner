   IMPORT / EXPORT
   ═══════════════════════════════════════════════════════════════════ */

/** Filenames can't carry these on Windows or macOS. */
const safeName = s => String(s).replace(/[\/\\:*?"<>|]+/g,'-').replace(/\s+/g,' ').trim();

/** Shared download plumbing. The revoke is deferred — doing it synchronously
    after click() races the browser on anything larger than a small JSON. */
function download(blob, filename){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 10000);
}

function exportJson(){
  download(new Blob([JSON.stringify(state,null,2)], { type:'application/json' }),
           `lesson-planner-${iso(new Date())}.json`);
  localStorage.setItem(EXPORT_KEY, String(Date.now()));
  markClean();
  paintStorageBadge();
  toast('Backed up');
}
function importJson(file){
  const fr = new FileReader();
  fr.onload = () => {
    try {
      const data = JSON.parse(fr.result);
      if (!data.courses || !data.lessons) throw new Error('Not a planner file');
      commit('Imported', () => {
        state = migrate(data);
        ui.courseId = state.courses[0] ? state.courses[0].id : ALL;
      });
    } catch(err){ toast('Could not read that file'); }
  };
  fr.readAsText(file);
}

/* ═══════════════════════════════════════════════════════════════════
   SEARCH
   ═══════════════════════════════════════════════════════════════════ */

let searchHits = [], searchAt = 0;

/* Which class the search is narrowed to. localStorage, not state: everything on
   state travels in planner.json to the other machine, and "what am I looking
   through right now" is per-person, not per-file. */
const SEARCH_FILTER_KEY = 'lessonPlanner.searchFilter';
let searchFilter = (() => {
  try { return JSON.parse(localStorage.getItem(SEARCH_FILTER_KEY)) || {}; }
  catch(e){ return {}; }
})();
function setSearchFilter(patch){
  Object.assign(searchFilter, patch);
  try { localStorage.setItem(SEARCH_FILTER_KEY, JSON.stringify(searchFilter)); }
  catch(e){ /* private mode — the filter just won't survive a reload */ }
}

function snippet(text, needle){
  const at = text.toLowerCase().indexOf(needle);
  if (at < 0) return text.slice(0, 90);
  const s = Math.max(0, at - 30);
  return (s ? '…' : '') + text.slice(s, at + needle.length + 60).trim() + '…';
}

/* An archived year has its own calendar. meetingDates reads the LIVE year, so
   it can't be reused — and this runs per keystroke, hence the cache. */
const _arDates = new Map();
function archiveDates(ar, c){
  const key = ar.id + '|' + c.id;
  if (_arDates.has(key)) return _arDates.get(key);
  const out = [];
  for (let d = ar.yearStart; d <= ar.yearEnd; d = addDays(d, 1)){
    if ((ar.holidays || []).some(h => d >= h.date && d <= (h.endDate || h.date))) continue;
    if (d < c.startDate || d > c.endDate) continue;
    if (!c.weekdays.includes(dow(d))) continue;
    if ((c.cancelled || []).some(x => x.date === d)) continue;
    out.push(d);
  }
  _arDates.set(key, out);
  return out;
}

/** Walk course.lessons — never state.lessons, which can hold strays. */
function runSearch(q){
  const needle = q.trim().toLowerCase();
  if (needle.length < 2) return [];
  const out = [];
  const only = searchFilter.courseId;
  const yr = searchFilter.year || '';
  const ar = yr ? (state.archives || []).find(a => a.id === yr) : null;
  if (yr && !ar) return [];                       // an archive that aged out

  const scan = (courses, lessons, datesFor, archive) => courses.forEach(c => {
    if (only && c.id !== only) return;
    const dates = datesFor(c);
    c.lessons.forEach((id, i) => {
      const l = lessons[id]; if (!l) return;
      const parts = [];
      if (l.title) parts.push(l.title);
      c.rows.forEach(r => { const t = htmlToText(l.cells[r.id]); if (t) parts.push(t); });
      const blob = parts.join(' · ');
      if (!blob.toLowerCase().includes(needle)) return;
      out.push({ course:c, lesson:l, idx:i, date: dates[i] || null, archive,
                 snip: snippet(blob, needle), needle });
    });
  });

  if (ar) scan(ar.courses, ar.lessons, c => archiveDates(ar, c), ar);
  else    scan(state.courses, state.lessons, meetingDates, null);

  out.sort((a,b) => (a.date || '9999') < (b.date || '9999') ? -1 : 1);
  return out.slice(0, 80);
}

function renderHits(){
  const box = $('searchHits'), list = $('hitList');
  const q = $('searchInput').value.trim();
  if (!q){ box.classList.remove('on'); return; }
  box.classList.add('on');
  renderSearchFilters();
  list.innerHTML = '';
  if (!searchHits.length){
    list.appendChild(el('div','none', q.length < 2 ? 'Type at least two letters'
      : searchFilter.courseId ? 'Nothing found in this class' : 'Nothing found'));
    return;
  }
  searchHits.forEach((h, i) => {
    const row = el('div','hit');
    const badge = el('div','mc', shortLabel(h.course.name));
    badge.style.setProperty('--c', h.course.color);
    row.appendChild(badge);
    row.appendChild(el('div','d', h.date ? fmtMed(h.date) : 'past end'));
    row.appendChild(el('div','t', h.lesson.title || '—'));
    const s = el('div','s');
    /* Highlight the match without letting stored text become markup. */
    const at = h.snip.toLowerCase().indexOf(h.needle);
    if (at < 0) s.textContent = h.snip;
    else {
      s.appendChild(document.createTextNode(h.snip.slice(0, at)));
      s.appendChild(el('mark','', h.snip.slice(at, at + h.needle.length)));
      s.appendChild(document.createTextNode(h.snip.slice(at + h.needle.length)));
    }
    row.appendChild(s);
    row.onmouseenter = () => { searchAt = i; paintHitSel(); };
    row.onclick = () => gotoHit(h);
    list.appendChild(row);
  });
  paintHitSel();
}

/** Move the highlight between existing rows — never rebuild them.
    renderHits() used to run on mouseenter, which destroyed the row under the
    pointer; a click needs mousedown and mouseup on the SAME node, so the first
    press was swallowed every time and every result took two clicks. */
function paintHitSel(){
  if (!searchHits.length) return;
  const rows = $('hitList').children;
  for (let i = 0; i < rows.length; i++) rows[i].classList.toggle('on', i === searchAt);
  if (rows[searchAt]) rows[searchAt].scrollIntoView({ block:'nearest' });
}

/** The class filter. Rebuilt only when the class list itself changes —
    replacing a <select> mid-keystroke would drop an open dropdown. */
function renderSearchFilters(){
  const bar = $('searchFilters');
  const sig = state.courses.map(c => c.id + ':' + c.name).join('|') + '#' +
              (state.archives || []).map(a => a.id + ':' + a.label).join('|');
  if (bar.dataset.sig !== sig){
    bar.dataset.sig = sig;
    bar.innerHTML = '';
    /* A class the filter pointed at can be deleted, which would otherwise
       leave the search permanently returning nothing. */
    if (searchFilter.courseId && !state.courses.some(c => c.id === searchFilter.courseId))
      setSearchFilter({ courseId:'' });

    const sel = document.createElement('select');
    sel.className = 'sfilter';
    sel.setAttribute('aria-label', 'Filter by class');
    [['', 'All classes']].concat(state.courses.map(c => [c.id, c.name]))
      .forEach(([v, label]) => {
        const o = document.createElement('option');
        o.value = v; o.textContent = label;
        sel.appendChild(o);
      });
    const rerun = () => {
      searchHits = runSearch($('searchInput').value);
      searchAt = 0;
      renderHits();
      $('searchInput').focus();
    };
    sel.onchange = () => { setSearchFilter({ courseId: sel.value }); rerun(); };
    bar.appendChild(sel);

    /* Only worth a control once there is something to choose between. */
    if ((state.archives || []).length){
      if (searchFilter.year && !state.archives.some(a => a.id === searchFilter.year))
        setSearchFilter({ year:'' });            // that archive has aged out
      const ysel = document.createElement('select');
      ysel.className = 'sfilter yr';
      ysel.setAttribute('aria-label','Filter by school year');
      [['', yearLabel(state.yearStart, state.yearEnd) + ' (this year)']]
        .concat(state.archives.map(a => [a.id, a.label]))
        .forEach(([v, label]) => {
          const o = document.createElement('option');
          o.value = v; o.textContent = label;
          ysel.appendChild(o);
        });
      ysel.onchange = () => { setSearchFilter({ year: ysel.value }); rerun(); };
      bar.appendChild(ysel);
    }
    bar.appendChild(el('div','sfcount'));
  }
  const sel = bar.querySelector('select');
  const cur = searchFilter.courseId || '';
  if (sel.value !== cur) sel.value = cur;
  sel.classList.toggle('set', !!cur);
  const ysel = bar.querySelector('select.yr');
  if (ysel){
    const cy = searchFilter.year || '';
    if (ysel.value !== cy) ysel.value = cy;
    ysel.classList.toggle('set', !!cy);
  }
  const n = searchHits.length;
  bar.querySelector('.sfcount').textContent =
    n ? `${n}${n >= 80 ? '+' : ''} result${n > 1 ? 's' : ''}` : '';
}

function gotoHit(h){
  closeSearch();
  $('searchInput').blur();
  /* The views are built on the live year, so there is nowhere to navigate to.
     Show the day instead, with a way to bring it forward. */
  if (h.archive) return openArchivePreview(h);
  if (!h.date) return toast('That lesson sits past the end of the year');
  /* Set the anchor and leave ui.view alone. All three views derive from this
     one date — weekDates(anchor), monthCells(anchor) — so a week-view search
     lands on the right week instead of throwing you into day view. */
  ui.courseId = h.course.id; ui.anchor = h.date;
  daySel = null; render();
}

/** A day from a past year, read-only, with the one action that matters:
    copy it into the clipboard the range-paste already reads. */
function openArchivePreview(h){
  const m = $('menu'); m.innerHTML = '';
  m.classList.add('preview');
  m.appendChild(el('div','sec',
    `${h.archive.label} · ${h.course.name}${h.date ? ' · ' + fmtMedY(h.date) : ''}`));
  const body = el('div','pvbody');
  if (h.lesson.title) body.appendChild(el('div','pvtitle', h.lesson.title));
  let any = false;
  h.course.rows.forEach(r => {
    const t = htmlToText(h.lesson.cells[r.id]);
    if (!t) return;
    any = true;
    body.appendChild(el('div','pvrow', r.label));
    body.appendChild(el('div','pvtext', t));
  });
  if (!any && !h.lesson.title) body.appendChild(el('div','pvtext','Nothing on this day.'));
  m.appendChild(body);
  m.appendChild(document.createElement('hr'));
  menuItem(m, 'Copy this day', () => {
    const cells = {}, labels = {};
    h.course.rows.forEach(r => {
      const html = h.lesson.cells[r.id];
      if (!html || !htmlToText(html)) return;
      const k = normLabel(r.label);
      cells[k] = html; labels[k] = r.label;
    });
    daysClip = { from: `${h.course.name} · ${h.archive.label}`,
                 days: [{ title:h.lesson.title, tag:h.lesson.tag || 'none', cells }], labels };
    toast('1 day copied — right-click a day to paste it');
  }, '', 'Then right-click a day in this year to paste it');
  placeMenu(null, $('searchbox'));
}

/** Re-runs the query rather than re-showing a stale list — the plan may have
    changed since it was typed, and old hits that no longer match are worse
    than no hits. `select` only on ⌘K: selecting all on a plain click would
    stop you placing the caret. */
function openSearch(select){
  const inp = $('searchInput');
  inp.focus();
  if (select) inp.select();
  if (!inp.value.trim()) return;
  searchHits = runSearch(inp.value);
  searchAt = 0;
  renderHits();
}
function closeSearch(){
  $('searchHits').classList.remove('on');
}
const searchIsOpen = () => $('searchHits').classList.contains('on');

/* ═══════════════════════════════════════════════════════════════════
   CLIPBOARD — cells, and whole days across classes
   ═══════════════════════════════════════════════════════════════════ */

let cellClip = null;                     // { label, html }

function openCellMenu(e, c, idx, row){
  const m = $('menu'); m.innerHTML = '';
  const lesson = state.lessons[c.lessons[idx]];
  if (!lesson) return;
  const html = lesson.cells[row.id] || '';
  const filled = !!htmlToText(html);

  m.appendChild(el('div','sec', row.label));
  if (filled){
    menuItem(m, 'Copy', () => { cellClip = { label:row.label, html }; toast('Cell copied'); });
    menuItem(m, 'Cut', () => {
      cellClip = { label:row.label, html };
      commit('Cell cut', () => { lesson.cells[row.id] = ''; });
    });
  }
  if (cellClip)
    menuItem(m, 'Paste', () => commit('Cell pasted', () => { lesson.cells[row.id] = cellClip.html; }),
             '', cellClip.label === row.label ? '' : `from ${cellClip.label}`);
  if (filled)
    menuItem(m, 'Clear', () => commit('Cell cleared', () => { lesson.cells[row.id] = ''; }), 'danger');
  placeMenu(e);
}

/**
 * Copy a whole day into another class on the same date. Rows are per-class
 * with their own ids, so they're matched by LABEL — and anything the target
 * has no row for is reported rather than dropped in silence.
 */
function copyDayTo(from, idx, to, date){
  const tIdx = meetingIndexByDate(to).get(date);
  if (tIdx === undefined) return toast(`${to.name} has no class on ${fmtMed(date)}`);
  const src = state.lessons[from.lessons[idx]];
  if (!src) return;

  const byLabel = new Map(to.rows.map(r => [r.label.trim().toLowerCase(), r.id]));
  const moved = {}, missing = [];
  from.rows.forEach(r => {
    const html = src.cells[r.id];
    if (!html || !htmlToText(html)) return;
    const target = byLabel.get(r.label.trim().toLowerCase());
    if (target) moved[target] = html; else missing.push(r.label);
  });

  const note = missing.length ? ` · no row for ${missing.join(', ')}` : '';
  commit(`Copied to ${to.name}${note}`, () => {
    const dst = ensureLesson(to, tIdx);
    dst.title = src.title; dst.tag = src.tag; dst.status = src.status || null;
    dst.cells = Object.assign({}, dst.cells, moved);
  });
}

/* ═══════════════════════════════════════════════════════════════════
   COPYING A RANGE OF DAYS
   ───────────────────────────────────────────────────────────────────
   The unit of reuse is a run of days, and the only stable coordinate in
   this model is the sequence index — so the clipboard is built from the
   shift-click selection that already exists.

   Cells are keyed by row LABEL, not row id: ids are per-class and shared
   with nothing, so a label is the only thing that means the same on both
   sides. Same normalisation copyDayTo already uses.
   ═══════════════════════════════════════════════════════════════════ */

let daysClip = null;             // { from, days:[{ title, tag, cells:{label:html} }] }

const normLabel = s => String(s || '').trim().toLowerCase();

const isBlankLesson = l =>
  !l || (!l.title && (!l.tag || l.tag === 'none') && !l.status &&
         !Object.values(l.cells || {}).some(h => htmlToText(h)));

/** Strip what shouldn't survive being reused somewhere else. Both relative
    due forms stay — each re-resolves against wherever the lesson lands — but
    a pinned date meant one specific day of one specific year. */
function scrubForReuse(html){
  const box = document.createElement('div');
  box.innerHTML = html || '';
  box.querySelectorAll('li[data-c]').forEach(li => li.removeAttribute('data-c'));
  box.querySelectorAll('[data-due]').forEach(n => {
    if (isPinned(n.getAttribute('data-due'))) n.removeAttribute('data-due');
  });
  box.querySelectorAll('[data-dueon]').forEach(n => n.removeAttribute('data-dueon'));
  return box.innerHTML;
}

function copySelection(){
  const r = selRange(); if (!r) return;
  const c = state.courses.find(x => x.id === daySel.courseId); if (!c) return;
  let [a, b] = r;
  /* ensureLesson appends blank lessons as a side effect of RENDERING, so
     browsing to the end of a class inflates lessons.length. Trailing blanks in
     a range are that artefact, not something anyone meant to copy. */
  while (b > a && isBlankLesson(state.lessons[c.lessons[b]])) b--;

  const days = [], labels = {};
  for (let i = a; i <= b; i++){
    const l = state.lessons[c.lessons[i]];
    const cells = {};
    c.rows.forEach(row => {
      const html = l && l.cells[row.id];
      if (!html || !htmlToText(html)) return;
      const key = normLabel(row.label);
      cells[key] = html;
      labels[key] = row.label;        // matching is normalised; reporting isn't
    });
    days.push({ title: l ? l.title : '', tag: l ? (l.tag || 'none') : 'none', cells });
  }
  daysClip = { from: c.name, days, labels };
  clearSelection();
  toast(`${days.length} day${days.length === 1 ? '' : 's'} copied from ${c.name}`);
}

/**
 * @param mode 'insert' splices and ripples · 'replace' overwrites from `at`.
 * One commit for the whole range — a loop of single-day copies would push a
 * snapshot each, blow the 60-entry undo stack in one gesture, and fire a toast
 * and a render per day.
 */
function pasteDays(c, at, mode){
  if (!daysClip || !daysClip.days.length) return;
  const byLabel = new Map(c.rows.map(r => [normLabel(r.label), r.id]));
  const missing = new Set();
  const built = daysClip.days.map(d => {
    const cells = {};
    Object.entries(d.cells).forEach(([label, html]) => {
      const rid = byLabel.get(label);
      if (rid) cells[rid] = scrubForReuse(html);
      else missing.add((daysClip.labels && daysClip.labels[label]) || label);
    });
    return { title:d.title, tag:d.tag, cells };
  });

  const n = built.length;
  /* Aggregated once, not once per day — twenty days missing the same row
     should say so a single time. */
  const note = missing.size ? ` · no row for ${[...missing].join(', ')}` : '';
  commit(`${n} day${n === 1 ? '' : 's'} ${mode === 'insert' ? 'inserted into' : 'pasted into'} ${c.name}${note}`, () => {
    const ids = built.map(b => {
      const id = uid();
      state.lessons[id] = { id, title:b.title, tag:b.tag, status:null, cells:b.cells };
      return id;
    });
    if (mode === 'insert') c.lessons.splice(at, 0, ...ids);
    else {
      /* Replace wants exactly these n slots to exist. copyDayTo's merge
         semantics are wrong here — a range paste overwrites. */
      ensureLesson(c, at + n - 1);
      for (let k = 0; k < n; k++) c.lessons[at + k] = ids[k];
    }
  });
}

/* ═══════════════════════════════════════════════════════════════════
   DAY SELECTION — shift-click a run, then tag it in one go
   ═══════════════════════════════════════════════════════════════════ */

let daySel = null;               // { courseId, from, to } — sequence indices

function selRange(){
  if (!daySel) return null;
  return [Math.min(daySel.from, daySel.to), Math.max(daySel.from, daySel.to)];
}

function extendSelection(c, idx){
  if (!daySel || daySel.courseId !== c.id) daySel = { courseId:c.id, from:idx, to:idx };
  else daySel.to = idx;
  paintSelection();
}
function clearSelection(){
  if (!daySel) return false;
  daySel = null; paintSelection(); return true;
}

function paintSelection(){
  document.querySelectorAll('.selected').forEach(n => n.classList.remove('selected'));
  const bar = $('selbar');
  const r = selRange();
  if (!r || isAll() || !course() || course().id !== daySel.courseId){
    bar.classList.remove('on'); bar.innerHTML = '';
    return;
  }
  const [a,b] = r;
  document.querySelectorAll('[data-idx]').forEach(n => {
    const i = Number(n.dataset.idx);
    if (i >= a && i <= b) n.classList.add('selected');
  });

  const n = b - a + 1;
  bar.innerHTML = '';
  bar.appendChild(el('span','n', `${n} day${n === 1 ? '' : 's'}`));
  Object.entries(TAGS).forEach(([k,t]) => {
    if (k === 'none') return;
    const btn = el('button','', t.label);
    btn.style.setProperty('--t', t.color);
    btn.onclick = () => tagSelection(k);
    bar.appendChild(btn);
  });
  const clr = el('button','ghost','Clear tag');
  clr.onclick = () => tagSelection('none');
  bar.appendChild(clr);
  const cp = el('button','ghost','Copy');
  cp.title = 'Copy these days, then right-click a day in any class to paste them';
  cp.onclick = () => copySelection();
  bar.appendChild(cp);
  const done = el('button','ghost','Done');
  done.onclick = () => clearSelection();
  bar.appendChild(done);
  bar.classList.add('on');
}

function tagSelection(k){
  const r = selRange(); if (!r) return;
  const c = state.courses.find(x => x.id === daySel.courseId); if (!c) return;
  const [a,b] = r, n = b - a + 1;
  commit(k === 'none' ? `Tag cleared on ${n} day${n===1?'':'s'}`
                      : `${n} day${n===1?'':'s'} tagged ${TAGS[k].label}`, () => {
    for (let i = a; i <= b; i++){
      const l = state.lessons[c.lessons[i]];
      if (l) l.tag = k;
    }
  });
  daySel = null;
}

/* ═══════════════════════════════════════════════════════════════════
   EXPORT FOR AI
   ───────────────────────────────────────────────────────────────────
   planner.json is normalised for the app: lessons live in a flat map,
   cells are keyed by row id, dates aren't stored at all. That's the
   right shape for splicing an array and the wrong shape for a language
   model, which would have to join three structures and still wouldn't
   know what day anything falls on.

   So this is a second, derived view: flattened, chronological, real
   names, resolved dates, plain text — and a _readme block up front
   explaining the sequence-first model, because an assistant that
   doesn't know about the ripple will give confidently wrong advice
   about moving a day.
   ═══════════════════════════════════════════════════════════════════ */

const AI_README = {
  what: 'A teacher\'s lesson plans, exported from Lesson Planner to be read by an AI assistant.',
  theKeyIdea:
    'Lessons are an ORDERED LIST, not a set of dates. Each class has a fixed set of weekdays ' +
    'it meets; the app lays that class\'s lesson list onto those dates in order. The "date" on ' +
    'each lesson below is therefore DERIVED, never stored.',
  whatFollowsFromThat: [
    'Inserting a lesson pushes every later lesson forward by one meeting.',
    'Removing one pulls everything after it back by one meeting.',
    'A holiday shortens the meeting list, so each class shifts by one of ITS OWN meetings — not by one calendar day. Classes meeting different weekdays shift by different amounts of calendar time.',
    'Dates are not commitments. If you suggest adding a day of practice before a quiz, say plainly that the quiz moves too.',
  ],
  whenYouSuggestChanges: [
    'Refer to a lesson by class name and its "n" number, not by date. Numbers are stable; dates move.',
    'Spell out the ripple: which lessons shift, and where they land afterwards.',
    'Respect each class\'s own rows. They differ per class and are listed under "rows" for each class.',
    'Keep plan text plain. The app stores light HTML but plain text is what reads back cleanly.',
  ],
  thisFileIsReadOnly:
    'Editing this file does not change the planner — it is a snapshot. Describe the changes you ' +
    'recommend and the teacher will make them in the app.',
};

/** The whole planner as one flat, readable, chronological structure. */
function buildAiJson(from, to){
  const inRange = d => (!from || d >= from) && (!to || d <= to);

  return {
    _readme: AI_README,
    exportedOn: iso(new Date()),
    coveringDates: { from: from || state.yearStart, to: to || state.yearEnd },

    schoolYear: {
      firstDay: state.yearStart,
      lastDay: state.yearEnd,
      terms: (state.terms && state.terms.starts || []).map((s,i) => ({
        name: `${TERM_MODES[state.terms.mode].abbr || 'Term'}${i+1}`,
        starts: s,
      })),
      holidays: state.holidays
        .filter(h => inRange(h.date))
        .map(h => ({ from:h.date, to:h.endDate || h.date, reason:h.reason }))
        .sort((a,b) => a.from < b.from ? -1 : 1),
    },

    classes: state.courses.map(c => {
      const dates = meetingDates(c);
      const dueIdx = hwOn(c) ? buildDueIndex(c, dates) : new Map();
      const lessons = [];
      const overflow = [];

      c.lessons.forEach((id, i) => {
        const l = state.lessons[id];
        if (!l) return;
        const date = dates[i] || null;

        const plan = {};
        c.rows.forEach(r => {
          let text = htmlToText(l.cells[r.id]);
          if (date && hwOn(c) && rowRole(r) === 'due'){
            const inbound = (dueIdx.get(date) || []).map(a => a.text);
            text = inbound.concat(text ? [text] : []).join('\n');
          }
          if (text) plan[r.label] = text;
        });

        const entry = { n: i + 1 };
        if (date){
          entry.date = date;
          entry.weekday = DOW[dow(date)];
          entry.week = weekLabel(date, c);
        }
        entry.concept = l.title || null;
        if (l.tag && l.tag !== 'none') entry.tag = TAGS[l.tag].label;
        if (l.status && STATUS[l.status]) entry.status = STATUS[l.status].label;
        if (Object.keys(plan).length) entry.plan = plan;

        if (!date) overflow.push(entry);
        else if (inRange(date)) lessons.push(entry);
      });

      const out = {
        name: c.name,
        meetsOn: c.weekdays.map(w => DOW[w]),
        runs: { from: c.startDate, to: c.endDate },
        rows: c.rows.map(r => r.label),
        lessonCount: c.lessons.length,
        lessons,
      };
      const nc = c.cancelled.filter(x => inRange(x.date));
      if (nc.length)
        out.noClassDays = nc.map(x => x.date).sort();
      if (overflow.length){
        out.pastEndOfYear = overflow;
        out.pastEndOfYearNote =
          'These lessons have been pushed beyond the last day this class meets. They still exist ' +
          'and are not deleted, but they have no date until the class end date is extended or ' +
          'days are removed earlier in the sequence.';
      }
      return out;
    }),
  };
}

let aiPick = null;

function renderAiPanel(p){
  if (!aiPick) aiPick = { from: state.yearStart, to: state.yearEnd };

  const g = el('div','grp');
  g.appendChild(el('div','note',
    'A flattened, readable copy of your plans — real dates, class and row names, plain text, and ' +
    'a short briefing that teaches the assistant how the schedule works before it gives you advice.'));
  p.appendChild(g);

  const rg = el('div','grp');
  rg.appendChild(el('label','','Dates'));
  [['from','First day'],['to','Last day']].forEach(([k,lab]) => {
    const row = el('div','addrow');
    const l = el('span','note', lab);
    l.style.minWidth = '64px'; l.style.alignSelf = 'center';
    const inp = document.createElement('input');
    inp.type = 'date'; inp.value = aiPick[k];
    inp.onchange = () => { aiPick[k] = inp.value; repaintPane(); };
    row.appendChild(l); row.appendChild(inp);
    rg.appendChild(row);
  });
  const quick = el('div','dayrow');
  [['This week', ...currentRange()], ['Whole year', state.yearStart, state.yearEnd]]
    .forEach(([lab,a,b]) => {
      const chip = el('div','daychip' + (aiPick.from === a && aiPick.to === b ? ' on' : ''), lab);
      chip.style.setProperty('--c','var(--accent)');
      chip.onclick = () => { aiPick.from = a; aiPick.to = b; repaintPane(); };
      quick.appendChild(chip);
    });
  rg.appendChild(quick);
  p.appendChild(rg);

  const text = JSON.stringify(buildAiJson(aiPick.from, aiPick.to), null, 2);
  const kb = Math.round(text.length / 1024);

  const go = el('div','grp');
  const copy = el('button','cta','Copy to clipboard');
  copy.onclick = async () => {
    try {
      await navigator.clipboard.writeText(text);
      toast(`Copied — ${kb} KB, paste it into a chat`);
    } catch(e){
      /* Clipboard permission varies by origin; downloading always works. */
      download(new Blob([text], { type:'application/json' }), 'lesson-plans-for-ai.json');
      toast('Clipboard blocked — downloaded instead');
    }
  };
  go.appendChild(copy);

  const dl = el('button','iconbtn','Download as a file');
  dl.style.marginTop = '8px';
  dl.onclick = () => {
    download(new Blob([text], { type:'application/json' }), 'lesson-plans-for-ai.json');
    toast('Downloaded');
  };
  go.appendChild(dl);
  go.appendChild(el('div','note', `About ${kb} KB. Long ranges get big — a term at a time reads best.`));
  p.appendChild(go);
}

/* ═══════════════════════════════════════════════════════════════════
   FILE STORAGE
   ───────────────────────────────────────────────────────────────────
   localStorage is one "clear browsing data" away from losing a year of
   plans, and it is keyed to where this HTML file sits — move the file
   and the data silently disappears. So the real home is a folder you
   pick, ideally inside OneDrive:

       Lesson Planner Data/
         planner.json
         backups/planner-2026-09-08.json

   A folder rather than a single file, because a lone file handle can't
   write siblings and backups would be impossible.

   localStorage is still written on every change as a mirror, so nothing
   is lost if the folder goes away. Where the API is missing (Safari,
   Firefox) that mirror is the only copy and the panel says so.
   ═══════════════════════════════════════════════════════════════════ */

const CAN_FS = typeof window.showDirectoryPicker === 'function';
const PLANNER_FILE = 'planner.json';
const READABLE_FILE = 'plans-readable.json';
const REV_KEY = 'lessonPlanner.revision';
const BACKUP_KEY = 'lessonPlanner.lastBackup';
const EXPORT_KEY = 'lessonPlanner.lastExport';

/** A stable-enough name for this computer, so a conflict can say who wrote what. */
const MACHINE = (() => {
  let m = localStorage.getItem('lessonPlanner.machine');
  if (!m){
    const os = /Mac/i.test(navigator.platform) ? 'Mac'
             : /Win/i.test(navigator.platform) ? 'PC' : 'Device';
    m = `${os}-${Math.random().toString(36).slice(2,6)}`;
    localStorage.setItem('lessonPlanner.machine', m);
  }
  return m;
})();

/* Directory handles are structured-cloneable, so IndexedDB can hold one
   across restarts. localStorage can't — it's strings only. */
const IDB = { name:'lessonPlanner', store:'handles' };
const idbOpen = () => new Promise((res,rej) => {
  const r = indexedDB.open(IDB.name, 1);
  r.onupgradeneeded = () => r.result.createObjectStore(IDB.store);
  r.onsuccess = () => res(r.result);
  r.onerror = () => rej(r.error);
});
const idbGet = k => idbOpen().then(db => new Promise((res,rej) => {
  const q = db.transaction(IDB.store,'readonly').objectStore(IDB.store).get(k);
  q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error);
}));
const idbSet = (k,v) => idbOpen().then(db => new Promise((res,rej) => {
  const q = db.transaction(IDB.store,'readwrite').objectStore(IDB.store).put(v,k);
  q.onsuccess = () => res(); q.onerror = () => rej(q.error);
}));

let dirHandle = null;       // the connected folder
let pendingHandle = null;   // remembered, but needs a click to re-grant permission
let storageState = 'none';  // none | saved | saving | error | reconnect | denied
let saveTimer = null, savingNow = false, saveAgain = false;

function setStorage(s){ storageState = s; paintStorageBadge(); }

async function writeInto(dir, name, text){
  const fh = await dir.getFileHandle(name, { create:true });
  const w = await fh.createWritable();   // stages to a swap file…
  await w.write(text);
  await w.close();                       // …and swaps atomically here
}

async function flushToFolder(){
  if (!dirHandle) return;
  if (savingNow){ saveAgain = true; return; }
  savingNow = true; setStorage('saving');
  try {
    state.revision = (state.revision || 0) + 1;
    state.lastWrittenBy = MACHINE;
    state.lastWrittenAt = new Date().toISOString();
    const text = JSON.stringify(state, null, 2);
    await writeInto(dirHandle, PLANNER_FILE, text);
    localStorage.setItem(REV_KEY, String(state.revision));
    /* A readable companion, kept current so it's always there to hand to an
       assistant without exporting anything first. Never read back — planner.json
       stays the single source of truth. */
    try { await writeInto(dirHandle, READABLE_FILE, JSON.stringify(buildAiJson(), null, 2)); }
    catch(e){ console.warn('readable copy failed', e); }
    await rollBackup(text);
    lastSavedAt = Date.now(); markClean();
    setStorage('saved');
  } catch(e){
    console.warn('folder save failed', e);
    setStorage('error');
    toast('Could not save to your folder');
  } finally {
    savingNow = false;
    if (saveAgain){ saveAgain = false; scheduleFolderSave(); }
  }
}

function scheduleFolderSave(){
  if (!dirHandle) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flushToFolder, 900);
}

/** One snapshot per day, most recent 30 kept. */
async function rollBackup(text){
  const today = iso(new Date());
  if (localStorage.getItem(BACKUP_KEY) === today) return;
  const dir = await dirHandle.getDirectoryHandle('backups', { create:true });
  await writeInto(dir, `planner-${today}.json`, text);
  localStorage.setItem(BACKUP_KEY, today);
  const names = [];
  for await (const [name] of dir.entries())
    if (/^planner-\d{4}-\d\d-\d\d\.json$/.test(name)) names.push(name);
  names.sort();
  for (const n of names.slice(0, Math.max(0, names.length - 30)))
    await dir.removeEntry(n).catch(() => {});
}

function adoptLoaded(data){
  state = migrate(data);
  localStorage.setItem(REV_KEY, String(state.revision || 0));
  ui.courseId = state.courses[0] ? state.courses[0].id : ALL;
  ui.anchor = todayAnchor();
  undoStack = []; redoStack = [];
  lastSavedAt = Date.parse(state.lastWrittenAt) || 0;
  invalidateSchedule(); save(); render(); schedulePaneRepaint();
  markClean();
}

/** Read planner.json from the connected folder, or seed it if absent. */
async function loadFromFolder(){
  let data = null;
  try {
    const fh = await dirHandle.getFileHandle(PLANNER_FILE);
    data = JSON.parse(await (await fh.getFile()).text());
  } catch(e){ data = null; }

  if (!data || !data.courses){
    await flushToFolder();                 // empty folder — this becomes its home
    return;
  }

  /* If the file is behind what this machine last wrote, OneDrive probably
     hasn't finished syncing. Never merge — that's how a year of work gets
     quietly mangled. Ask, and let a human decide. */
  const known = Number(localStorage.getItem(REV_KEY) || 0);
  if (known && (data.revision || 0) < known){
    const useFile = confirm(
      'The planner file in your folder looks older than this computer\'s last save.\n\n' +
      `File: revision ${data.revision || 0} (saved by ${data.lastWrittenBy || 'unknown'})\n` +
      `This computer last saved: revision ${known}\n\n` +
      'This usually means OneDrive is still syncing. Wait a moment and reopen if unsure.\n\n' +
      'OK — open the file anyway.\nCancel — keep this computer\'s copy and overwrite the file.');
    if (!useFile){ await flushToFolder(); return; }
  }
  adoptLoaded(data);
  setStorage('saved');
}

async function chooseFolder(){
  if (!CAN_FS) return toast('This browser can’t save to a folder');
  let h;
  try {
    h = await window.showDirectoryPicker({ id:'lessonPlannerData', mode:'readwrite' });
  } catch(e){
    if (e && e.name === 'AbortError') return;             // user closed the dialog
    console.warn('directory picker failed', e);
    setStorage('denied');
    repaintPane();
    return toast('This page isn’t allowed to open a folder');
  }
  try {
    dirHandle = h;
    await idbSet('dir', h);
    const existing = await dirHandle.getFileHandle(PLANNER_FILE).then(() => true, () => false);
    if (existing && state.courses.length){
      const useFile = confirm(
        'That folder already has a planner file.\n\n' +
        'OK — open it and replace what\'s on screen.\n' +
        'Cancel — keep what\'s on screen and overwrite the file.');
      if (!useFile){ await flushToFolder(); }
      else { await loadFromFolder(); }
    } else if (existing){
      await loadFromFolder();
    } else {
      await flushToFolder();
    }
    setupDone();
    toast('Saving to your folder');
  } catch(e){
    console.warn(e); dirHandle = null; setStorage('error');
    toast('Could not use that folder');
  }
  repaintPane();
}

async function forgetFolder(){
  dirHandle = null; pendingHandle = null;
  await idbSet('dir', null).catch(() => {});
  localStorage.removeItem(REV_KEY);
  setStorage('none');
  repaintPane();
  toast('Folder disconnected — saving in this browser only');
}

/** Re-grant permission on a handle we remembered. Needs a user gesture. */
async function reconnectFolder(){
  if (!pendingHandle) return;
  try {
    const p = await pendingHandle.requestPermission({ mode:'readwrite' });
    if (p !== 'granted') return toast('Permission declined');
    dirHandle = pendingHandle; pendingHandle = null;
    await loadFromFolder();
    repaintPane();
  } catch(e){ console.warn(e); toast('Could not reconnect'); }
}

/** On boot: reattach silently if permission survived, else offer a button. */
async function restoreFolder(){
  if (!CAN_FS) return;
  let h = null;
  try { h = await idbGet('dir'); } catch(e){ return; }
  if (!h) return;
  try {
    const p = await h.queryPermission({ mode:'readwrite' });
    if (p === 'granted'){ dirHandle = h; await loadFromFolder(); }
    else { pendingHandle = h; setStorage('reconnect'); }
  } catch(e){ pendingHandle = h; setStorage('reconnect'); }
}

/* ── the badge in the sub bar ─────────────────────────────────────── */

const daysSince = ts => ts ? Math.floor((Date.now() - Number(ts)) / 86400000) : Infinity;

function paintStorageBadge(){
  const box = $('storage'); if (!box) return;
  /* A minute tick must not yank focus off the button under the cursor. */
  if (box.contains(document.activeElement)) return;
  box.innerHTML = '';
  box.appendChild(
    storageState === 'reconnect' ? reconnectPill() :
    dirHandle                    ? folderStatusPill()
                                 : backupPill());
}

/* A remembered folder that lost permission. Not the backup button — the right
   move here is one click to get the folder back, not a download. */
function reconnectPill(){
  const b = el('button','savepill warn');
  b.appendChild(el('span','dot'));
  b.appendChild(el('span','t','Reconnect'));
  if (pendingHandle) b.appendChild(el('span','sub', pendingHandle.name));
  b.title = 'Your saved folder needs permission again';
  b.onclick = reconnectFolder;
  return b;
}

/* Folder mode. Always visible, so "is it saving?" never has to be asked —
   but when the answer is simply "yes", a dot says it. The words come back the
   moment there is something to report, and they grow at the right edge, so
   nothing else in the bar moves. The folder name lives in Settings now. */
function folderStatusPill(){
  const bad = storageState === 'error', busy = storageState === 'saving';
  const quiet = !bad && !busy;
  const b = el('button','savepill ' + (bad ? 'warn' : busy ? 'busy' : 'ok') + (quiet ? ' dotonly' : ''));
  b.appendChild(el('span','dot'));
  if (!quiet) b.appendChild(el('span','t', bad ? 'Not saving' : 'Saving…'));
  else b.setAttribute('aria-label', savedLabel(lastSavedAt));
  b.title = (bad ? 'The last save failed. ' : quiet ? savedLabel(lastSavedAt) + '. ' : '') +
    `Click or ${MODK}S to save now — ${dirHandle.name}/${PLANNER_FILE}` +
    (state.lastWrittenBy && state.lastWrittenBy !== MACHINE
      ? `\nLast written by ${state.lastWrittenBy}` : '');
  /* A status you can act on. Clicking a thing that says "Saved" and being
     shown a settings page is a small betrayal. */
  b.onclick = saveNow;
  return b;
}

/** Force a write this instant rather than waiting out the debounce. */
function saveNow(){
  if (!dirHandle) return exportJson();
  clearTimeout(saveTimer);
  flushToFolder();
}

/* Browser-only mode. "Back up", not "Save" — nothing is lost when the tab
   closes, and a button that overstates the danger is one you learn to ignore. */
const DIRTY_WARN = 30 * 60000;
function backupPill(){
  const age = dirtySince ? Date.now() - dirtySince : 0;
  const level = !dirtySince ? 'clean' : age >= DIRTY_WARN ? 'warn' : 'dirty';
  const b = el('button','savepill ' + level);
  if (level !== 'clean') b.appendChild(el('span','dot'));
  b.appendChild(el('span','t','Back up'));
  if (level === 'warn') b.appendChild(el('span','sub', ageLabel(age)));
  b.onclick = saveNow;
  b.title = !dirtySince
    ? 'Your plans are in this browser only. Download a copy you can keep.'
    : 'Unsaved changes — download a copy you can keep.';
  return b;
}

const fmtClock = ms => new Date(ms).toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' });
function savedLabel(ms){
  /* lastWrittenAt comes off disk and may be junk, or from a skewed clock. */
  if (!ms || isNaN(ms)) return 'Saved';
  return 'Saved ' + (iso(new Date(ms)) === iso(new Date()) ? fmtClock(ms) : fmtMed(iso(new Date(ms))));
}
function ageLabel(ms){
  const m = Math.floor(ms / 60000);
  if (m < 90) return m + ' min';
  const h = Math.round(m / 60);
  return h < 36 ? h + ' hr' : Math.round(h / 24) + ' days';
}

function savingSummary(){
  if (dirHandle) return dirHandle.name + '/';
  if (pendingHandle) return 'Needs permission';
  return CAN_FS ? 'This browser only' : 'No autosave here';
}

function renderStoragePane(box){
  const g = el('div','grp');

  if (dirHandle){
    g.appendChild(el('label','','Saving to'));
    const row = el('div','holitem');
    row.appendChild(el('span','r', dirHandle.name + '/' + PLANNER_FILE));
    g.appendChild(row);
    g.appendChild(el('div','note',
      'Written automatically as you type, with a dated copy in backups/ once a day. ' +
      'Keep this folder in OneDrive and both computers stay in step.'));
    const btns = el('div','addrow');
    const ch = el('button','','Change folder'); ch.onclick = chooseFolder;
    const fg = el('button','','Disconnect');    fg.onclick = forgetFolder;
    btns.appendChild(ch); btns.appendChild(fg);
    g.appendChild(btns);

  } else if (!CAN_FS){
    g.appendChild(el('label','','This browser can’t autosave'));
    g.appendChild(el('div','note',
      'Safari and Firefox can’t write to a folder you choose, so your plans live inside this ' +
      'browser only — and clearing browsing data would erase them. Use Back up regularly, or ' +
      'open the app in Chrome or Edge, where it can save to a folder by itself.'));

  } else {
    g.appendChild(el('label','','Keep your plans in a folder'));
    g.appendChild(el('div','note',
      'Right now they’re inside this browser. Clearing browsing data loses them. Pick a folder — ' +
      'ideally in OneDrive — and it saves there by itself and follows you between computers.'));
    const b = el('button','cta', pendingHandle ? 'Reconnect folder' : 'Choose a folder…');
    b.style.justifyContent = 'center';
    b.onclick = pendingHandle ? reconnectFolder : chooseFolder;
    g.appendChild(b);
    if (storageState === 'denied')
      g.appendChild(el('div','note',
        'That didn’t work here — this page may not be allowed to open a folder. Back up stays the reliable option.'));
  }

  /* Reachable in every mode, so the manual escape hatch always exists. */
  g.appendChild(document.createElement('hr'));
  const man = el('div','addrow');
  const bk = el('button','','Back up now');   bk.onclick = exportJson;
  const op = el('button','','Open a backup…'); op.onclick = () => $('filepick').click();
  man.appendChild(bk); man.appendChild(op);
  g.appendChild(man);
  const last = Number(localStorage.getItem(EXPORT_KEY)) || 0;
  g.appendChild(el('div','note', last
    ? `Last backup ${savedLabel(last).replace('Saved ','')}.`
    : 'You haven’t downloaded a backup yet.'));

  box.appendChild(g);
}

/* Asks for a folder — but only where there is one to ask for, and only once
   there is something worth protecting. Device-local: a folder is a property of
   this computer, so syncing "already asked" would silence it on the second
   machine, which is the one that needs it. */
let promptedThisSession = false;
const readSetup  = () => { try { return JSON.parse(localStorage.getItem(SETUP_KEY)) || {n:0}; }
                           catch(e){ return {n:0}; } };
const writeSetup = o => localStorage.setItem(SETUP_KEY, JSON.stringify(o));
const setupDone  = () => writeSetup({ done:true });

function maybePromptStorage(){
  if (promptedThisSession || dirHandle || pendingHandle) return;
  if (!state.courses.length) return;
  const rec = readSetup();
  if (rec.done) return;
  promptedThisSession = true;
  if (!CAN_FS){
    /* No dialog — there's no action to offer in one. Say it once and let the
       Back up button carry the message from then on. */
    setupDone();
    return toast('This browser can’t autosave — use Back up to keep a copy');
  }
  if (rec.n >= 3) return;
  if (rec.at && Date.now() - rec.at < 7 * 864e5) return;
  writeSetup({ n: rec.n + 1, at: Date.now() });
  openPanel('saving');
}

/** A nudge at the top of the settings root while nothing is protecting the data. */
function storageBanner(){
  if (dirHandle || !state.courses.length) return null;
  /* Stops once a folder is set up, or after the third decline — the Saving
     row still reports the truth, but a banner that never takes no for an
     answer is one you stop reading. */
  const rec = readSetup();
  if (rec.done || (rec.n || 0) >= 3) return null;
  const g = el('div','grp');
  const card = el('div','banner');
  card.appendChild(el('b','', CAN_FS ? 'Your plans aren’t backed up'
                                     : 'This browser can’t autosave'));
  card.appendChild(el('div','note', CAN_FS
    ? 'They live inside this browser. Pick a folder and it saves there by itself.'
    : 'Chrome or Edge can save to a folder for you. Until then, Back up regularly.'));
  const b = el('button','cta', CAN_FS ? 'Choose a folder…' : 'Back up now');
  b.style.justifyContent = 'center';
  b.onclick = CAN_FS ? chooseFolder : exportJson;
  card.appendChild(b);
  g.appendChild(card);
  return g;
}

/* ═══════════════════════════════════════════════════════════════════
   NAVIGATION + WIRING
   ═══════════════════════════════════════════════════════════════════ */

function step(dir){
  if (ui.view === 'day'){
    let d = ui.anchor;
    for (let i = 0; i < 400; i++){
      d = addDays(d, dir);
      if (d < state.yearStart || d > state.yearEnd) break;
      if (isVisibleDay(d)){ ui.anchor = d; break; }
    }
  } else if (ui.view === 'month'){
    const d = parse(ui.anchor);
    ui.anchor = iso(new Date(d.getFullYear(), d.getMonth() + dir, 1));
  } else {
    ui.anchor = addDays(weekStart(ui.anchor), dir * 7);
  }
  render();
}

$('prev').onclick = () => step(-1);
$('next').onclick = () => step(1);
$('today').onclick = () => { ui.anchor = todayAnchor(); render(); };
$('btnMore').onclick = openMoreMenu;
$('period').onclick = () => {
  const m = $('menu');
  if (m.classList.contains('on') && m.classList.contains('cal')) return closeMenu();
  openDatePicker();
};

/* Drives the Back up escalation. Guarded so it costs nothing the rest of the time. */
setInterval(() => { if (!dirHandle && dirtySince) paintStorageBadge(); }, 60000);
$('scrim').onclick = () => { closeSearch(); closePanel(); };
$('filepick').onchange = e => { if (e.target.files[0]) importJson(e.target.files[0]); };

/** Same row, next or previous day — the one move Tab can't make, since Tab
    walks down a day column and then into the next one. */
function moveCellFocus(dir){
  const cur = document.activeElement;
  if (!cur || !cur.classList || !cur.classList.contains('cell')) return false;
  const col = cur.closest('.daycol');
  if (!col) return false;
  const cols = [...document.querySelectorAll('.daycol[data-idx]')];
  const next = cols[cols.indexOf(col) + dir];
  if (!next) return false;
  const target = next.querySelector(`.cell[data-row="${cur.dataset.row}"]`)
              || next.querySelector('.cell');
  if (!target) return false;
  target.focus();
  const sel = getSelection();                 // caret to the end, not the start
  sel.removeAllRanges();
  const r = document.createRange();
  r.selectNodeContents(target); r.collapse(false);
  sel.addRange(r);
  return true;
}

const inEditor = () => {
  const a = document.activeElement;
  return !!a && (a.isContentEditable || a.tagName === 'INPUT' || a.tagName === 'TEXTAREA');
};
/* A <select> isn't text entry, so inEditor() rightly ignores it — but it does
   eat keystrokes, because typing jumps to the option that starts with them.
   Bare-letter shortcuts have to stand off it too, or picking a search filter
   and typing to find a class would switch the view out from under you. */
const inControl = () => {
  const a = document.activeElement;
  return inEditor() || (!!a && a.tagName === 'SELECT');
};

document.addEventListener('keydown', e => {
  const mod = e.metaKey || e.ctrlKey;

  /* Search — ⌘K anywhere, or "/" when you're not typing into something. */
  if ((mod && e.key.toLowerCase() === 'k') || (!mod && !inEditor() && e.key === '/')){
    e.preventDefault();
    return searchIsOpen() ? closeSearch() : openSearch(true);
  }
  if (searchIsOpen()){
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp'){
      e.preventDefault();
      if (!searchHits.length) return;
      searchAt = (searchAt + (e.key === 'ArrowDown' ? 1 : -1) + searchHits.length) % searchHits.length;
      return paintHitSel();
    }
    if (e.key === 'Enter'){
      e.preventDefault();
      if (searchHits[searchAt]) gotoHit(searchHits[searchAt]);
      return;
    }
    if (e.key === 'Escape'){ e.preventDefault(); return closeSearch(); }
  }

  if (mod && e.key.toLowerCase() === 'z'){
    if (document.activeElement && document.activeElement.isContentEditable) return;
    e.preventDefault();
    e.shiftKey ? redo() : undo();
  }

  /* ⌘S saves. Not gated on isContentEditable — the moment you most want it is
     mid-sentence — and preventDefault is what stops the browser's Save Page. */
  if (mod && e.key.toLowerCase() === 's'){
    e.preventDefault();
    saveNow();
    return;
  }

  /* Alt + ← / → hops sideways between days without leaving the keyboard. */
  if (e.altKey && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')){
    if (moveCellFocus(e.key === 'ArrowRight' ? 1 : -1)) e.preventDefault();
    return;
  }

  if (e.key === 'Escape'){
    if (drag) return cancelDrag();
    if (inEditor()) return document.activeElement.blur();
    if (clearSelection()) return;
    closeMenu();
    /* One level at a time — closing outright from three deep loses your place. */
    if (panelIsOpen() && panelPath.length) return panelBack();
    closePanel();
  }

  if (!mod && !e.altKey && document.activeElement === document.body){
    if (e.key === 'ArrowLeft')  step(-1);
    if (e.key === 'ArrowRight') step(1);
  }

  /* Views and Today. Gated so they never fire mid-sentence — typing "the" in
     a cell must not jump the whole app to today. */
  if (!mod && !e.altKey && !inControl()){
    const v = VIEWS[Number(e.key) - 1];
    if (v && e.key >= '1' && e.key <= '9'){
      e.preventDefault();
      ui.view = v[0]; render();
      return;
    }
    if (e.key.toLowerCase() === 't'){
      e.preventDefault();
      ui.anchor = todayAnchor(); render();
      return;
    }
  }
});

$('searchInput').addEventListener('input', () => {
  searchHits = runSearch($('searchInput').value);
  searchAt = 0;
  renderHits();
});

/* There was no focus handler at all. openSearch() only ever ran from ⌘K, so
   clicking out and back into the box left the panel shut with the query still
   sitting in the field. */
$('searchInput').addEventListener('focus', () => openSearch(false));

/* Labels that name a modifier are written once, from the platform. */
$('kbdSearch').textContent = MODK + 'K';
document.querySelectorAll('[data-mod]').forEach(b => {
  b.title = `${b.title} (${MODK}${b.dataset.mod})`;
});
document.body.classList.toggle('hints', showHints());

render();
restoreFolder().then(maybePromptStorage, maybePromptStorage);

/* ── Installable app, but only when hosted ────────────────────────────
   The manifest, icons and service worker live beside this file on the web
   copy. Opened straight off disk none of them exist, so they're attached at
   runtime rather than in <head> — that keeps the emailable single file free
   of references that would 404. */
if (location.protocol === 'https:' || location.protocol === 'http:'){
  const link = (rel, href) => {
    const l = document.createElement('link');
    l.rel = rel; l.href = href;
    document.head.appendChild(l);
  };
  link('manifest', 'manifest.json');
  link('apple-touch-icon', 'apple-touch-icon.png');
  if (navigator.serviceWorker)
    navigator.serviceWorker.register('sw.js').catch(err => console.warn('sw', err));
}
</script>
</body>
</html>
